<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGPD Checklist | Arquindex Capture</title><style>
:root{--blue:#1765dc;--ink:#14243b;--muted:#64748b;--line:#dce4ef;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer}a{color:var(--blue)}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#101d30;color:#fff;padding:25px 16px;overflow:auto}.brand{font-size:23px;font-weight:800;letter-spacing:2px}.sub{font-size:12px;color:#91b7f0;margin:6px 0 28px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd6e7;padding:11px 12px;border-radius:7px;margin:3px 0}nav button.active,nav button:hover{background:#1c3964;color:white}main{margin-left:245px;padding:28px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.tag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:white}h1{font-size:29px;margin:7px 0}h2{font-size:19px}p{line-height:1.6}.muted{color:var(--muted)}.card{border:1px solid var(--line);border-radius:13px;background:white;padding:22px;margin-bottom:20px}.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.bar select{min-width:250px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}label{font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #bfccdd;border-radius:7px;background:white;color:var(--ink);padding:11px}textarea{min-height:98px;resize:vertical}input[type=checkbox]{width:auto}button.primary,.primary{background:var(--blue);color:white;border:0;padding:11px 18px;border-radius:7px;text-decoration:none;display:inline-block}button.secondary{background:white;color:var(--ink);border:1px solid var(--line);padding:9px 12px;border-radius:7px}button.danger{color:#b42339;border:1px solid #f1c9cd;background:white;padding:8px;border-radius:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}td p{max-width:560px;white-space:pre-wrap;overflow-wrap:anywhere}th{color:#51647f}.scroll{overflow:auto}#toast{position:fixed;bottom:22px;right:22px;max-width:440px;background:#102b51;color:white;padding:14px 22px;border-radius:10px;z-index:30}#toast:empty{display:none}.empty{padding:30px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}dialog{border:1px solid var(--line);border-radius:15px;max-width:min(850px,94vw);width:850px;padding:25px}dialog::backdrop{background:#0b172a99}.linkbox{padding:12px;border:1px solid var(--line);background:#eff6ff;overflow-wrap:anywhere}.pill{font-size:12px;background:#e9f0ff;color:#23549a;border-radius:20px;padding:4px 10px}@media(max-width:800px){aside{position:relative;width:auto;padding:16px}nav{display:flex;overflow:auto}nav button{min-width:145px}.sub{margin-bottom:12px}main{margin:0;padding:16px}header{align-items:flex-start;flex-wrap:wrap}.brand{font-size:19px}}
</style></head><body><aside><div class="brand">ARQUINDEX</div><div class="sub">LGPD CHECKLIST · CAPTURE</div><nav id="nav" aria-label="Módulos"></nav></aside><main><header><div><span class="tag">Governança da privacidade</span><h1 id="title">Carregando seu ambiente…</h1><div class="muted" id="identity"></div></div><div class="bar"><a href="/">Página do produto</a><button class="secondary" id="logout">Sair</button></div></header><section class="card bar"><label for="company">Empresa em trabalho</label><select id="company"><option value="">Selecione uma empresa</option></select><span class="muted" id="scope"></span></section><div id="aiHost"></div><div id="templateAction" class="card" hidden><h2>Modelo LGPD — Clinica com 3 unidades</h2><p>Importacao demonstrativa: cadastro, unidades, sistema, ROPA, risco, politica e plano de acao. Nenhuma politica sera publicada.</p><button class="primary" id="importClinicPreview" type="button">Importar modelo em homologacao</button></div><div id="view"></div></main><div id="toast" role="status"></div><dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><div id="editFields" class="grid"></div><div class="actions"><button class="primary">Salvar</button><button class="secondary" type="button" onclick="document.querySelector('#editor').close()">Cancelar</button></div><p id="editError" role="alert"></p></form></dialog><script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,defs,records=[],active='company',companyId='',editing=null;
function notice(s){$('#toast').textContent=s;setTimeout(()=>$('#toast').textContent='',7000);}
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(me?{'X-CSRF-Token':me.csrf}:{})},...(body?{body:JSON.stringify(body)}:{})});if(r.status===401){location.href='/login';throw Error('Sessão expirada');}const b=await r.json().catch(()=>({error:'Não foi possível concluir'}));if(!r.ok)throw Error(b.error||'Acesso indisponível');return b;}
function companies(){return records.filter(x=>x.section==='company');}
function current(){return records.find(x=>x.id===companyId);}
function canWrite(){return ['admin','manager'].includes(me.role);}
function recordName(r){return r?.payload[defs[r?.section]?.name]||'Registro';}
async function refresh(){records=await api('/records');const previous=companyId;$('#company').innerHTML='<option value="">Selecione uma empresa</option>'+companies().map(c=>'<option value="'+c.id+'">'+E(recordName(c))+'</option>').join('');companyId=companies().some(x=>x.id===previous)?previous:companies().length===1?companies()[0].id:'';$('#company').value=companyId;$('#scope').textContent=me.role==='admin'?'Administração de todas as empresas':'Acesso restrito à sua empresa';await render();}
function nav(){const extras={channels:'Canais e solicitações',logs:'Histórico de auditoria',export:'Exportação',...(me.role==='admin'?{users:'Usuários e acessos'}:{})};$('#nav').innerHTML=Object.entries({...Object.fromEntries(Object.entries(defs).map(([k,d])=>[k,d.label])),...extras}).map(([k,n])=>'<button data-section="'+k+'" class="'+(k===active?'active':'')+'">'+E(n)+'</button>').join('');}
function table(rows,columns){return '<div class="scroll"><table><thead><tr>'+columns.map(x=>'<th>'+E(x[0])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+columns.map(x=>'<td>'+x[1](r)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
async function render(){const showAssistant=!!defs[active] || ['channels','logs','export'].includes(active);$('#aiHost').innerHTML=showAssistant&&canWrite()?"<section class=\"card\" id=\"aiPanel\" style=\"border:1px solid #b7d5ff;background:linear-gradient(135deg,#f0f7ff,white);box-shadow:0 8px 24px #17386b12\"><div class=\"bar\" style=\"justify-content:space-between\"><h2>✦ Assistente Arquindex — descreva o que precisa</h2><span class=\"pill\">Rascunho • revisão humana</span></div><p class=\"muted\">Descreva o cliente para sugerir informações do cadastro ou peça uma política, termo, checklist, mapa de dados ou análise de riscos. Nada será salvo ou publicado automaticamente.</p><label class=\"field\">Sua instrução<textarea id=\"aiPrompt\" maxlength=\"6000\" placeholder=\"Ex.: Clínica com três unidades, coleta dados de pacientes e colaboradores e usa prontuário eletrônico. Gere uma política de privacidade e destaque as lacunas de informação.\"></textarea></label><div class=\"bar\"><label><input type=\"checkbox\" id=\"aiConsent\"> Autorizo enviar o texto e os registros selecionados desta empresa ao provedor de IA configurado</label></div><div class=\"actions\"><button class=\"primary\" id=\"aiGenerate\" type=\"button\">Gerar análise ou modelo</button><button class=\"secondary\" id=\"aiStructure\" type=\"button\">Gerar pacote completo (ROPA, RIPD, políticas e auditorias)</button><button class=\"primary\" id=\"aiApply\" type=\"button\" hidden>Gravar rascunhos revisados</button><button class=\"secondary\" id=\"aiCopy\" type=\"button\" hidden>Copiar rascunho</button></div><p id=\"aiFeedback\" role=\"status\" class=\"muted\"></p><div id=\"aiProposals\"></div><pre id=\"aiOutput\" style=\"white-space:pre-wrap;max-height:520px;overflow:auto\"></pre></section>":'';nav();$('#title').textContent=defs[active]?.label||{channels:'Canais e solicitações',logs:'Histórico de auditoria',users:'Usuários e acessos',export:'Exportação'}[active];const v=$('#view');if(active!=='company'&&active!=='users'&&active!=='logs'&&!companyId){v.innerHTML='<div class="card empty">Selecione uma empresa para continuar.</div>';return;}
 if(defs[active]){const rows=records.filter(x=>x.section===active&&(active==='company'||x.company_id===companyId));let top='<div class="bar">'+(canWrite()&&(active!=='company'||me.role==='admin')?'<button class="primary" data-new>+ Novo registro</button>':'<span class="pill">Somente leitura</span>')+(active==='policy'&&canWrite()?'<button class="secondary" id="generatePolicy">Gerar rascunho pelo mapa de dados</button>':'')+'</div>';if(active==='website')top+='<p class="muted">Cadastre a URL HTTPS e execute uma varredura passiva autorizada. O relatório observa cabeçalhos, atributos de cookies e sinais no HTML, sem executar JavaScript ou explorar vulnerabilidades.</p>';if(active==='policy')top+='<p class="muted">Revise o texto e seus fundamentos antes da publicação. Edições retornam a versão para rascunho; apenas a administração publica no portal.</p>';v.innerHTML='<section class="card">'+top+(rows.length?table(rows,[['Registro',r=>'<strong>'+E(recordName(r))+'</strong><p>'+E(Object.entries(r.payload).filter(([k])=>k!==defs[active].name&&k!=='text').map(([k,val])=>(defs[active].fields[k]||k)+': '+val).join('\n'))+'</p>'],['Vínculo',r=>E(active==='company'?r.payload.company_city:recordName(records.find(x=>x.id===r.parent_id))||'')],['Ações',r=>'<div class="actions"><button class="secondary" data-show="'+r.id+'">Abrir</button>'+(canWrite()?'<button class="secondary" data-edit="'+r.id+'">Editar</button><button class="danger" data-delete="'+r.id+'">Excluir</button>':'')+(active==='website'?'<button class="secondary" data-scans="'+r.id+'">Histórico de varreduras</button>'+(canWrite()?'<button class="primary" data-scan="'+r.id+'">Executar varredura</button>':''):'')+(active==='policy'&&me.role==='admin'&&r.payload.status!=='Publicado'?'<button class="primary" data-publish="'+r.id+'">Publicar versão</button>':'')+'</div>']]):'<p class="empty">Nenhum registro cadastrado.</p>')+'</section>';return;}
 if(active==='channels'){const cases=(await api('/cases')).filter(x=>x.company_id===companyId);const url=location.origin+'/portal/'+companyId;v.innerHTML='<section class="card"><h2>Portal público da empresa</h2><p>Políticas publicadas, atendimento ao titular e denúncias. Os relatos de denúncia são visíveis apenas à administração Arquindex.</p><div class="linkbox"><a target="_blank" rel="noopener" href="'+url+'">'+url+'</a></div></section><section class="card"><h2>Solicitações recebidas</h2>'+(cases.length?table(cases,[['Protocolo',r=>E(r.id)+'<p>'+E(r.kind)+' · '+E(r.status)+'</p>'],['Mensagem',r=>'<p>'+E(r.payload.message)+'</p><p>'+E(r.payload.email)+'</p>'],['Andamento',r=>'<p>'+E((r.public_updates||[]).map(x=>x.date+' — '+x.text).join('\n'))+'</p>'+(canWrite()?'<button class="secondary" data-case="'+r.id+'">Atualizar atendimento</button>':'')]]):'<p class="empty">Nenhuma solicitação recebida.</p>')+'</section>';window.caseRows=cases;return;}
 if(active==='logs'){const rows=await api('/audit');v.innerHTML='<section class="card">'+table(rows.filter(x=>!companyId||x.company_id===companyId),[['Quando',r=>E(new Date(r.created_at).toLocaleString('pt-BR'))],['Usuário',r=>E(r.email)],['Ação',r=>E(r.action)],['Registro',r=>E(r.record_id)]])+'</section>';return;}
 if(active==='export'){v.innerHTML='<section class="card"><h2>Exportar os registros desta empresa</h2><p>Arquivo JSON com cadastro, mapa de dados, riscos, auditorias, políticas e relatórios de websites. Solicitações dos canais e credenciais ficam fora desta exportação geral. O arquivo não substitui o backup integral do banco.</p><a class="primary" href="/api/export?company_id='+companyId+'">Baixar dados em JSON</a></section>';return;}
 if(active==='users'){const users=await api('/users');v.innerHTML='<section class="card"><h2>Criar acesso</h2><form id="userForm" class="grid"><label>E-mail<input name="email" type="email" required></label><label>Perfil<select name="role"><option value="client">Cliente — leitura</option><option value="manager">Gestor — edição na empresa</option><option value="admin">Administrador — todas as empresas e denúncias</option></select></label><label>Empresa<select name="company_id"><option value="">Selecione</option>'+companies().map(x=>'<option value="'+x.id+'">'+E(recordName(x))+'</option>').join('')+'</select></label><div><button class="primary">Gerar convite</button></div></form><p id="invite" class="linkbox" hidden></p></section><section class="card">'+table(users,[['E-mail',r=>E(r.email)],['Perfil',r=>E(r.role)],['Empresa',r=>E(recordName(records.find(x=>x.id===r.company_id)))],['Acesso',r=>r.enabled?'Ativo':'Pendente ou desativado'],['Ações',r=>r.id!==me.id?'<button class="danger" data-disable="'+r.id+'">Revogar acesso</button>':'Sua conta']])+'</section>';return;}
}
function scanView(scans){$('#editTitle').textContent='Relatórios de varredura passiva';$('#editFields').innerHTML='<div style="grid-column:1/-1">'+(scans.length?scans.map(s=>{const r=s.result;return '<section class="card"><h3>'+E(new Date(r.scannedAt).toLocaleString('pt-BR'))+'</h3><p>'+E(r.finalUrl)+' · HTTP '+E(r.httpStatus)+'</p><p>'+E(r.interpretation)+'</p>'+table(r.checks,[['Verificação',c=>E(c.label)],['Observação',c=>E(c.observed?'Sinal observado':'Sinal não observado')],['Evidência',c=>'<p>'+E(c.evidence)+'</p>'],['Próxima ação',c=>E(c.nextAction)]])+'<h3>Cookies recebidos (sem valores)</h3><pre>'+E(JSON.stringify(r.cookies,null,2))+'</pre><p>Recursos externos referenciados: '+E(r.externalResourceHosts.join(', ')||'Nenhum identificado')+'</p><p>Formulários no HTML: '+E(r.forms)+'</p><p>'+E(r.bodyAnalyzed?'HTML analisado'+(r.truncated?' parcialmente (limite de tamanho)':''):'HTML não analisado; verifique tipo ou codificação da resposta')+'</p><ul>'+r.limitations.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></section>';}).join(''):'<p>Nenhuma varredura salva.</p>')+'</div>';$('#editError').textContent='';$('#editForm button.primary').hidden=true;$('#editor').addEventListener('close',()=>$('#editForm button.primary').hidden=false,{once:true});$('#editor').showModal();}
function field(k,label,value='',type='text'){return '<label class="field">'+E(label)+(k==='text'||['purpose','security','assessment','message','public_reply','finding','action','public_notice'].includes(k)?'<textarea name="'+k+'" '+(k==='text'?'style="min-height:350px;grid-column:1/-1"':'')+'>'+E(value)+'</textarea>':'<input name="'+k+'" type="'+type+'" value="'+E(value)+'">')+'</label>';}
function edit(id){editing=id?records.find(x=>x.id===id):null;const d=defs[active];$('#editTitle').textContent=(editing?'Editar: ':'Novo: ')+d.label;let html='';if(d.parent){const opts=records.filter(x=>x.section===d.parent&&x.company_id===companyId);html+='<label class="field">Vincular a '+E(defs[d.parent].label)+'<select name="parent_id" required><option value="">Selecione</option>'+opts.map(x=>'<option value="'+x.id+'" '+(x.id===editing?.parent_id?'selected':'')+'>'+E(recordName(x))+'</option>').join('')+'</select></label>';}html+=Object.entries(d.fields).filter(([k])=>!(active==='policy'&&['status','version'].includes(k))).map(([k,l])=>field(k,l,editing?.payload[k]||'')).join('');$('#editFields').innerHTML=html;$('#editError').textContent='';$('#editor').showModal();}
$('#editForm').onsubmit=async e=>{e.preventDefault();const submit=e.submitter;submit.disabled=true;try{const data=Object.fromEntries(new FormData(e.target)),payload={...data};delete payload.parent_id;await api('/records'+(editing?'/'+editing.id:''),editing?'PUT':'POST',{section:active,company_id:companyId,parent_id:data.parent_id||null,payload});$('#editor').close();await refresh();notice('Registro salvo.');}catch(e){$('#editError').textContent=e.message;}finally{submit.disabled=false;}};
$('#company').onchange=async e=>{companyId=e.target.value;try{await render();}catch(e){notice(e.message);}};
$('#nav').onclick=async e=>{const b=e.target.closest('[data-section]');if(!b)return;active=b.dataset.section;try{await render();}catch(e){notice(e.message);}};
document.addEventListener('click',async e=>{if(e.target?.id==='aiGenerate'){const b=e.target;b.disabled=true;const status=$('#aiFeedback');try{const instruction=$('#aiPrompt').value.trim();if(instruction.length<15)throw Error('Descreva o pedido com pelo menos 15 caracteres.');if(!$('#aiConsent').checked)throw Error('Confirme o envio dos dados ao provedor antes de gerar.');status.textContent='Gerando rascunho para conferência…';const out=await api('/assistant/draft','POST',{company_id:companyId||null,instruction,consent:true,section:active});$('#aiOutput').textContent=out.draft;$('#aiCopy').hidden=false;status.textContent='Rascunho pronto para revisão. Nada foi gravado nos cadastros.';}catch(err){status.textContent=err.message;}finally{b.disabled=false;}}if(e.target?.id==='aiCopy'){await navigator.clipboard.writeText($('#aiOutput').textContent);notice('Rascunho copiado.');}});

let pendingAi=[];
document.addEventListener('click',async e=>{
 if(e.target?.id==='aiStructure'){
  const b=e.target;b.disabled=true;try{
   if(!companyId)throw Error('Selecione uma empresa para preencher.');
   if(!$('#aiConsent').checked)throw Error('Confirme o envio ao provedor.');
   const instruction=$('#aiPrompt').value.trim();if(instruction.length<15)throw Error('Descreva melhor a solicitacao.');
   const result=await api('/assistant/structure','POST',{company_id:companyId,instruction,consent:true});
   pendingAi=result.items||[];
   const container=$('#aiProposals');
   container.innerHTML='<h3>Preenchimento proposto por secao</h3><p class="muted">Revise o texto antes de gravar. Sistemas, Politicas, Auditorias, ROPA e Riscos: para ROPA escolha um departamento existente; para RIPD escolha um processo ROPA existente.</p>'+pendingAi.map((x,i)=>'<div class="card"><strong>'+E((defs[x.section]?.label||x.section)+' — '+x.name)+'</strong><label class="field">Conteudo sugerido<textarea data-ai-index="'+i+'" style="min-height:115px">'+E(x.text||x.finding||x.purpose||x.mitigation||x.name)+'</textarea></label><label><input type="checkbox" data-ai-check="'+i+'" '+'checked'+'> Gravar esta proposta</label></div>').join('');
   $('#aiApply').hidden=!pendingAi.some(x=>['system','policy','audit','process','risk'].includes(x.section));
   $('#aiFeedback').textContent='Pacote de propostas gerado: revise as políticas e demais registros antes de gravar.';
  }catch(err){$('#aiFeedback').textContent=err.message;}finally{b.disabled=false;}
 }
 if(e.target?.id==='aiApply'){
  if(!companyId||!pendingAi.length){notice('Selecione uma empresa e gere propostas antes de gravar.');return;}
  if(!confirm('Gravar os registros selecionados como rascunhos?'))return;
  const chosen=[...document.querySelectorAll('[data-ai-check]:checked')];if(!chosen.length){notice('Marque ao menos uma proposta para gravar.');return;}
  const b=e.target;b.disabled=true;let saved=0;
  try{
   for(const check of chosen){
    const i=Number(check.dataset.aiCheck),x=pendingAi[i],value=document.querySelector('[data-ai-index="'+i+'"]').value;
    const payload=x.section==='policy'?{name:x.name,text:value,audience:'A definir',status:'Rascunho',version:'1.0'}:x.section==='audit'?{name:x.name,scope:'Revisao LGPD',finding:value,action:x.action||'Validar plano de acao',status:'Pendente de revisao'}:x.section==='process'?{name:x.name,purpose:value,legal_basis:x.legal_basis||'Pendente de avaliacao',data_categories:x.data_categories||'Pendente',data_subjects:x.data_subjects||'Pendente',origin:x.origin||'A confirmar',storage:x.storage||'A confirmar',sharing:x.sharing||'A confirmar',international_transfer:x.international_transfer||'A confirmar',retention:x.retention||'A confirmar',security:x.security||'A confirmar',responsible:x.responsible||'A definir'}:x.section==='risk'?{name:x.name,assessment:value,impact:x.impact||'A avaliar',probability:x.probability||'A avaliar',mitigation:x.mitigation||'Pendente de avaliacao',responsible:x.responsible||'A definir',status:'Rascunho'}:{name:x.name,provider:'A confirmar',access:'A verificar'};
    let parentId=null;
    if(x.section==='process'||x.section==='risk'){const parentSection=x.section==='process'?'department':'process';const options=records.filter(r=>r.section===parentSection&&r.company_id===companyId);if(!options.length)throw Error('Cadastre primeiro um '+(parentSection==='department'?'departamento vinculado a unidade':'processo ROPA')+' para gravar '+x.name);const selected=prompt('Vincular '+x.name+' a '+parentSection+':\n'+options.map((r,j)=>(j+1)+' - '+recordName(r)).join('\n')+'\nInforme o numero:', '1');if(selected===null)throw Error('Vinculo cancelado');const n=Number(selected);if(!Number.isInteger(n)||n<1||n>options.length)throw Error('Numero de vinculo invalido');parentId=options[n-1].id;}
    const inserted=await api('/records','POST',{section:x.section,company_id:companyId,parent_id:parentId,payload});records.push({id:inserted.id,section:x.section,company_id:companyId,parent_id:parentId,payload});saved++;
    check.checked=false;
   }
   await refresh();active=chosen.length===1?pendingAi[Number(chosen[0].dataset.aiCheck)].section:'policy';await render();notice(saved+' registro(s) salvo(s) no banco. Abra a secao correspondente.');
  }catch(err){notice(saved+' salvo(s); erro: '+err.message);}finally{b.disabled=false;}
 }
});

document.querySelector('#importClinicPreview').onclick=async()=>{if(!confirm('Criar modelo ficticio para homologacao?'))return;try{const r=await api('/templates/clinic-preview','POST',{confirm:true});companyId=r.company_id;await refresh();notice('Modelo criado em rascunho, sem publicacao.');}catch(e){notice(e.message);}};
$('#logout').onclick=async()=>{await api('/logout','POST');location.href='/login';};
$('#view').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.scans){scanView(await api('/websites/'+b.dataset.scans+'/scans'));return;}if(b.dataset.scan){if(!confirm('Confirmo que tenho autorização para analisar esta página pública por leitura HTTPS, sem login, envio de formulários ou exploração.'))return;b.disabled=true;try{notice('Analisando a página pública…');const r=await api('/websites/'+b.dataset.scan+'/scan','POST',{authorized:true});scanView([r]);notice('Relatório salvo no histórico da empresa.');}finally{b.disabled=false;}return;}if(b.dataset.disable){if(!confirm('Revogar acesso e encerrar as sessões deste usuário?'))return;await api('/users/'+b.dataset.disable+'/disable','PUT');await render();return;}if(b.hasAttribute('data-new'))return edit();if(b.dataset.edit)return edit(b.dataset.edit);if(b.dataset.delete){if(!confirm('Excluir este registro? Registros com vínculos não poderão ser excluídos.'))return;await api('/records/'+b.dataset.delete,'DELETE');await refresh();}if(b.dataset.show){const r=records.find(x=>x.id===b.dataset.show);if(active==='company'){companyId=r.id;$('#company').value=companyId;active='branch';return render();}$('#editTitle').textContent=recordName(r);$('#editFields').innerHTML='<pre style="grid-column:1/-1">'+E(Object.entries(r.payload).map(([k,v])=>(defs[r.section].fields[k]||k)+':\n'+v).join('\n\n'))+'</pre>';$('#editor').showModal();$('#editForm button[type=submit],#editForm button.primary').hidden=true;$('#editor').addEventListener('close',()=>$('#editForm button.primary').hidden=false,{once:true});}if(b.id==='generatePolicy'){await api('/policies/generate','POST',{company_id:companyId});await refresh();notice('Rascunho gerado. Revise antes de publicar.');}if(b.dataset.publish&&confirm('A empresa aprovou esta versão para publicação no portal público?')){await api('/policies/'+b.dataset.publish+'/publish','POST');await refresh();}if(b.dataset.case){const r=window.caseRows.find(x=>x.id===b.dataset.case);const statuses=['Recebido','Em análise','Aguardando informação','Concluído'];const state=prompt('Situação: '+statuses.join(' / '),r.status);if(state===null)return;if(!statuses.includes(state))throw Error('Situação inválida');const reply=prompt('Resposta visível ao solicitante (deixe vazia para não enviar mensagem):','');if(reply===null)return;const responsible=prompt('Responsável interno:',r.responsible||'');if(responsible===null)return;const deadline=prompt('Prazo interno (AAAA-MM-DD):',r.deadline||'');if(deadline===null)return;await api('/cases/'+r.id,'PUT',{status:state,public_reply:reply,responsible,deadline});await render();}}catch(e){notice(e.message);}};
$('#view').onsubmit=async e=>{if(e.target.id!=='userForm')return;e.preventDefault();try{const b=await api('/users','POST',Object.fromEntries(new FormData(e.target)));const el=$('#invite');el.hidden=false;el.textContent='Link de ativação (24 horas): '+b.activation_url;e.target.reset();}catch(e){notice(e.message);}};
(async()=>{try{me=await api('/me');defs=await api('/definitions');$('#identity').textContent=me.email+' · '+({admin:'Administrador',manager:'Gestor da empresa',client:'Cliente — leitura'}[me.role]);await refresh();}catch(e){$('#title').textContent='Falha ao carregar o ambiente';notice(e.message);}})();
</script></body></html>

name: Validar ARQ-036 ARQ-038 ARQ-039 2026-10-20 tarde
on:
  push:
    branches: [master]
    paths: ['.github/workflows/validar-rodada-seo-20261020-tarde.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar navegador
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/arq-verify" playwright --no-audit --no-fund
      - name: Validar mobile e desktop
        run: |
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/arq-verify/node_modules/playwright');
          let browser;(async()=>{browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const urls=[['ARQ-036','https://conarq-juridico-nova-lima.arquindex.com.br/?v=20261020'],['ARQ-038','https://ged.arquindex.com.br/bh.html?v=20261020'],['ARQ-039','https://ocr-prontuarios-contagem.arquindex.com.br/?v=20261020']];
          const out=[];for(const vp of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:900}]){const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},isMobile:vp.name==='mobile'});
          for(const [id,url] of urls){const page=await context.newPage();const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(3000);
          const d=await page.evaluate(id=>({title:document.title,canonical:[...document.querySelectorAll('link[rel=canonical]')].map(x=>x.href),h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()),description:document.querySelector('meta[name=description]')?.content||'',cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth,logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),widget:document.querySelectorAll('#arq-floating').length,menu:!!document.querySelector('#aq-nav'),aeo:!!document.querySelector('[data-aq-aeo="'+id+'"]'),whatsapp:[...document.querySelectorAll('a')].some(a=>a.href.includes('5531973632725')),proposal:[...document.querySelectorAll('a')].some(a=>a.href.includes('solicitar-proposta-contratacao')),noindex:/noindex/i.test(document.querySelector('meta[name=robots]')?.content||'')}),id);
          const row={id,vp:vp.name,status:response?.status(),...d};out.push(row);console.log('CHECK',JSON.stringify(row));if(row.status!==200||row.canonical.length!==1||row.h1.length!==1||!row.description||row.sw>row.cw+2||!row.logo||row.widget!==1||!row.menu||!row.aeo||!row.whatsapp||!row.proposal||row.noindex)throw new Error('FAIL '+id+' '+vp.name);}
          await context.close();}await browser.close();console.log('VISUAL_VERIFIED',JSON.stringify(out));})().catch(async e=>{console.error(e);if(browser)await browser.close().catch(()=>{});process.exitCode=1});
          JS

# rerun apos correcao ARQ-038

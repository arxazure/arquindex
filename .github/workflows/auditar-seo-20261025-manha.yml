name: Auditar ARQ-119 a ARQ-124 2026-10-25 manha
on:
  push:
    paths:
      - '.github/workflows/auditar-seo-20261025-manha.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - name: Auditoria pública mobile e desktop
        run: |
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const items = [
            ['ARQ-119','https://contratar-digitalizacao-documentos-armazenamento-nuvem.arquindex.com.br/'],
            ['ARQ-120','https://compliance-digitalizacao-preco.arquindex.com.br/'],
            ['ARQ-121','https://consultoria-mapeamento-mg.arquindex.com.br/'],
            ['ARQ-122','https://empresas-brasileiras-especializadas-digitalizacao-documental-se.arquindex.com.br/'],
            ['ARQ-123','https://mapeamento-juridico.arquindex.com.br/'],
            ['ARQ-124','https://precos-empresas-digitalizacao-documental-pequenas-medias-empres.arquindex.com.br/']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const [id,url] of items){
              for(const [device,width,height] of [['mobile',390,844],['desktop',1440,900]]){
                const page=await browser.newPage({viewport:{width,height}});
                const res=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                const data=await page.evaluate(()=>({
                  title:document.title,
                  h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()),
                  description:document.querySelector('meta[name="description"]')?.content||'',
                  canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                  robots:document.querySelector('meta[name="robots"]')?.content||'',
                  logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),
                  menu:!!document.querySelector('#aq-nav'),
                  widget:document.querySelectorAll('#arq-floating').length,
                  oldWidget:document.querySelectorAll('.aq-brand-wa,#wa-widget-send-button').length,
                  cta:[...document.querySelectorAll('a[href]')].filter(a=>/wa.me|solicitar-proposta/i.test(a.href)).length,
                  forms:document.querySelectorAll('form').length,
                  aeo:document.querySelectorAll('[data-aq-aeo]').length,
                  links:document.querySelectorAll('a[href]').length,
                  words:(document.body.innerText.match(/\S+/g)||[]).length,
                  clientWidth:document.documentElement.clientWidth,
                  scrollWidth:document.documentElement.scrollWidth
                }));
                console.log(JSON.stringify({id,url,device,status:res?.status(),...data}));
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.js

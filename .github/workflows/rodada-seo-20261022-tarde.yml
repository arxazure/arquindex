name: Melhorar ARQ-070 ARQ-073 ARQ-075 2026-10-22 tarde
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261022-tarde.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Identidade ARQ-070
        env:
          DESIGN_TARGET: https://ocr-maua.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-073
        env:
          DESIGN_TARGET: https://mapeamento-educacao.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-075
        env:
          DESIGN_TARGET: https://digitalizar-lgpd-solucao.arquindex.com.br/empresas.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar SEO AEO links e atendimento
        run: python scripts/rodada-seo-20261022-tarde.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-rodada-seo-20261022-tarde
          path: design-report/

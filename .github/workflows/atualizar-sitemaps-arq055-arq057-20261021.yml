name: Atualizar sitemaps ARQ-055 ARQ-057 2026-10-21
on:
  push:
    branches: [master]
    paths: ['.github/workflows/atualizar-sitemaps-arq055-arq057-20261021.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/atualizar-sitemaps-arq055-arq057-20261021.py

# reexecucao apos correcao do tratamento de erro

name: Melhorar ARQ-086 ARQ-087 ARQ-088 2026-10-23 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261023-manha.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pillow
      - name: Identidade ARQ-086
        env:
          DESIGN_TARGET: https://databook-petrobras-elaboracao.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-087
        env:
          DESIGN_TARGET: https://decreto10278-nova-lima.arquindex.com.br/custo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-088
        env:
          DESIGN_TARGET: https://encontrar-consultoria-conformidade-lgpd-bom-custo-beneficio.arquindex.com.br/comparativo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteúdo, sitemaps e artes
        run: python scripts/rodada-seo-20261023-manha.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-seo-20261023-manha
          path: design-report/

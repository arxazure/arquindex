name: Publicar respostas SEO AEO GEO 2026-10-22
on:
  push:
    branches: [master]
    paths:
      - scripts/publicar-blocos-aeo-20261022.py
      - .github/workflows/publicar-blocos-aeo-20261022.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Backup, publicação e verificação pública
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publicar-blocos-aeo-20261022.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprovante-blocos-aeo-20261022
          path: publish-report/blocos-aeo-20261022.json

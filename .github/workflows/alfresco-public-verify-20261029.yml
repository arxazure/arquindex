name: Verificar acesso publico Alfresco
on:
  push:
    branches: [master]
    paths: ['.github/workflows/alfresco-public-verify-20261029.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install playwright --ignore-scripts --no-audit --no-fund
      - name: Conferir paginas com navegador
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const url of ['https://www.arquindex.com.br/','https://www.arquindex.com.br/blog/alfresco-community-gestao-documental-sem-amps/','https://www.arquindex.com.br/manuais/alfresco-community-aspectos-temporalidade/']){
              const p=await b.newPage();
              try{const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});console.log(JSON.stringify({url,status:r.status(),title:await p.title(),text:(await p.locator('body').innerText()).slice(0,180)}))}
              catch(e){console.log(JSON.stringify({url,error:e.message.slice(0,200)}))}
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

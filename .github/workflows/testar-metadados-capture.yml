name: Testar metadados Capture Pro
on:
  pull_request:
    paths:
      - 'capture-pro/**'
      - '.github/workflows/testar-metadados-capture.yml'
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test capture-pro/decreto10278.test.js

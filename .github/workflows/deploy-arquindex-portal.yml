name: Publish Arquindex secondary portal to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site-secundario-wix/**'
      - '.github/workflows/deploy-arquindex-portal.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site-secundario-wix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portal
        run: npm run build
      - name: Check required pages
        run: |
          test -f dist/index.html
          test -f dist/insights/preservacao-digital/index.html
          test -f dist/insights/arquitetura-metadados/index.html
          test -f dist/insights/inteligencia-artificial-documentos/index.html
          test -f dist/insights/ecm-e-processos/index.html
          test -f dist/insights/acervos-engenharia/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        run: npx wrangler@4 pages deploy dist --project-name=arquindex-portal --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
      - name: Explain missing Cloudflare credentials
        if: ${{ env.CF_TOKEN == '' || env.CF_ACCOUNT == '' }}
        run: |
          echo "::error::Set repository secret CLOUDFLARE_API_TOKEN (Pages Edit) and CLOUDFLARE_ACCOUNT_ID."
          exit 1

name: Publicar noticia ANPD Arquindex
on:
  push:
    paths:
      - 'publicacao-noticias/anpd-dosimetria-sancoes-lgpd-2026.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enviar somente artigo ANPD e verificar destino
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os,ftplib,io,hashlib,urllib.request,time
          src='publicacao-noticias/anpd-dosimetria-sancoes-lgpd-2026.html'
          name='anpd-dosimetria-sancoes-lgpd-2026.html'
          data=open(src,'rb').read()
          assert b'<html' in data and b'noindex' not in data.lower()
          assert os.environ.get('FTP_PASSWORD'),'FTP_PASSWORD secret ausente'
          f=ftplib.FTP(os.environ['FTP_HOST'],timeout=45)
          f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          f.cwd('public_html')
          try:f.cwd('noticias')
          except ftplib.error_perm:
            f.mkd('noticias');f.cwd('noticias')
          previous=None
          try:
            old=bytearray();f.retrbinary('RETR '+name,old.extend);previous=bytes(old)
          except ftplib.error_perm:pass
          if previous==data:
            print('UNCHANGED_ALREADY_PRESENT')
          else:
            f.storbinary('STOR '+name,io.BytesIO(data))
          check=bytearray();f.retrbinary('RETR '+name,check.extend)
          assert hashlib.sha256(check).digest()==hashlib.sha256(data).digest(),'FTP_READBACK_MISMATCH'
          f.quit()
          url='https://www.arquindex.com.br/noticias/'+name
          for attempt in range(3):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ArquindexNewsVerification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:
                public=r.read()
                if r.status==200 and hashlib.sha256(public).digest()==hashlib.sha256(data).digest():
                  print('PUBLIC_HTTP_200_BYTES_VERIFIED',url);break
                print('PUBLIC_NOT_YET_MATCHING',r.status,attempt+1)
            except Exception as e:print('PUBLIC_CHECK_ERROR',type(e).__name__,str(e)[:120])
            time.sleep(6)
          else:raise RuntimeError('FTP_OK_BUT_PUBLIC_NOT_VERIFIED: investigar cache/raiz publica antes de divulgar')
          PY

name: Publicar noticia ANPD Arquindex
on:
  push:
    branches: [master]
    paths:
      - 'publicacao-noticias/anpd-dosimetria-sancoes-lgpd-2026.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Publicar somente artigo com FTPS backup e verificacao publica
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publicar-anpd-revisado.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anpd-publicacao-verificada
          path: publish-report/

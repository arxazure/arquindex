name: Verificar sitemaps ARQ-059 ARQ-060 ARQ-063 2026-10-21
on:
  push:
    branches: [master]
    paths: ['.github/workflows/verificar-sitemaps-arq059-arq060-arq063-20261021.yml']
permissions:
  contents: read
jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validar robots e sitemaps
        run: |
          python - <<'PY'
          import requests,xml.etree.ElementTree as ET
          from urllib.parse import urljoin,urlparse
          targets=['https://digitalizar-digitalizacao-especializada.arquindex.com.br/','https://digitalizacao-ocr-empresas.arquindex.com.br/empresas.html','https://digitalizacao-rh-sao-bernardo-do-campo.arquindex.com.br/o-que-e.html']
          for target in targets:
            base=f"{urlparse(target).scheme}://{urlparse(target).netloc}/"
            rr=requests.get(urljoin(base,'robots.txt'),timeout=30,headers={'User-Agent':'ArquindexSEO/1.0'});rr.raise_for_status()
            seeds=[x.split(':',1)[1].strip() for x in rr.text.splitlines() if x.lower().startswith('sitemap:')]
            if not seeds:seeds=[urljoin(base,'sitemap.xml')]
            seen=set();queue=list(seeds);found=[]
            while queue:
              url=queue.pop(0)
              if url in seen:continue
              seen.add(url);r=requests.get(url,timeout=30,headers={'User-Agent':'ArquindexSEO/1.0'});r.raise_for_status()
              root=ET.fromstring(r.content);locs=[e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
              if root.tag.endswith('sitemapindex'):queue.extend(urljoin(url,x) for x in locs)
              elif target in [urljoin(url,x) for x in locs]:found.append(url)
              print('XML_VALID',target,url,len(locs))
            print('SITEMAP_MEMBERSHIP',target,found)
          print('SITEMAPS_CHECKED')
          PY

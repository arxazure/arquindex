name: Corrigir overflow ARQ-055 2026-10-21
on:
  push:
    branches: [master]
    paths: ['.github/workflows/corrigir-overflow-arq055-20261021.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python scripts/corrigir-overflow-arq055-20261021.py

name: Validar ARQ-028 ARQ-031 ARQ-033 2026-10-20 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/validar-rodada-seo-20261020-manha.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar navegador
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/arq-verify" playwright --no-audit --no-fund
      - name: Validar mobile e desktop
        run: |
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/arq-verify/node_modules/playwright');
          const fs=require('fs'); let browser;
          (async()=>{
            browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
            const urls=[
              ['ARQ-028','https://instalacao-lgpd-sp.arquindex.com.br/empresas.html?post=como-criar-inventario-de-dados-pessoais&visual=20261020'],
              ['ARQ-031','https://software-reconhecimento-texto-documentos-digitalizados.arquindex.com.br/guia-completo.html?post=incineracao-de-documentos-sem-risco-juridico&visual=20261020'],
              ['ARQ-033','https://digitalizar-arquivos-bh.arquindex.com.br/?visual=20261020']
            ]; const out=[];
            for(const vp of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:900}]){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},isMobile:vp.name==='mobile'});
              for(const [id,url] of urls){
                const page=await context.newPage(); const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000}); await page.waitForTimeout(5000);
                const d=await page.evaluate((id)=>({title:document.title,canonical:[...document.querySelectorAll('link[rel=canonical]')].map(x=>x.href),h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()),description:document.querySelector('meta[name=description]')?.content||'',clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),widget:document.querySelectorAll('#arq-floating').length,old:document.querySelectorAll('.aq-brand-wa,#wa-widget-send-button').length,menu:!!document.querySelector('#aq-nav'),aeo:!!document.querySelector('[data-aq-aeo="'+id+'"]'),whatsapp:[...document.querySelectorAll('a')].some(a=>a.href.includes('5531973632725')),proposal:[...document.querySelectorAll('a')].some(a=>a.href.includes('solicitar-proposta-contratacao')),noindex:/noindex/i.test(document.querySelector('meta[name=robots]')?.content||'')}),id);
                const row={id,viewport:vp.name,status:response.status(),...d}; out.push(row);
                if(row.status!==200||row.canonical.length!==1||row.h1.length!==1||row.scrollWidth>row.clientWidth+1||row.noindex||!row.logo||row.widget!==1||row.old!==0||!row.menu||!row.aeo||!row.whatsapp||!row.proposal)throw new Error('ACCEPTANCE '+JSON.stringify(row));
                await page.close();
              } await context.close();
            }
            await browser.close(); fs.writeFileSync(process.env.RUNNER_TEMP+'/arq-verify/report.json',JSON.stringify(out,null,2)); console.log('VISUAL_VERIFIED',JSON.stringify(out));
          })().catch(async e=>{console.error(e);if(browser)await browser.close().catch(()=>{});process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao-arq028-arq031-arq033-20261020
          path: ${{ runner.temp }}/arq-verify/report.json

name: Publicar paginas ECM GED IA na Homehost
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publicar-alfresco-ia-homehost.yml'
      - 'conteudo/publicacao/**'
permissions:
  contents: read
concurrency:
  group: homehost-ecm-ged
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_HOST: ftp.arquindex.com.br
      FTP_USER: arquind2
    steps:
      - uses: actions/checkout@v4
      - name: Publicar tres paginas com backup e verificar
        run: |
          python - <<'PY'
          import os,ftplib,io,hashlib,urllib.request,time,sys
          from pathlib import Path
          slugs=['alfresco-ecm-automacao-documental-ia','gestao-documental-software-ged-processos-ia','como-automatizar-a-gestao-documental-processos-ia','solicitar-proposta-contratacao']
          pwd=os.environ.get('FTP_PASSWORD')
          if not pwd:sys.exit('FTP_PASSWORD secret ausente')
          ftp=ftplib.FTP_TLS(os.environ['FTP_HOST'],timeout=30)
          try:
            ftp.login(os.environ['FTP_USER'],pwd);ftp.prot_p()
            print('FTPS_AUTH_OK')
          except Exception as e:
            print('FTPS indisponivel:',type(e).__name__)
            ftp.close()
            ftp=ftplib.FTP(os.environ['FTP_HOST'],timeout=30)
            ftp.login(os.environ['FTP_USER'],pwd)
            print('FTP_AUTH_OK sem TLS - recomenda-se configurar FTPS')
          roots=['/public_html','public_html','/home/arquind2/public_html','/']
          root=None
          for candidate in roots:
            try:
              ftp.cwd('/');ftp.cwd(candidate)
              names={p.rstrip('/').split('/')[-1] for p in ftp.nlst()}
              if {'index.html','index.php','robots.txt','sitemap.xml'} & names:
                root=ftp.pwd();break
            except ftplib.all_errors:pass
          if not root:sys.exit('ROOT_NOT_FOUND: a conta FTP nao acessa a raiz do site; revisar pasta inicial no cPanel')
          print('ROOT_FOUND',root)
          for slug in slugs:
            src=Path('conteudo/publicacao')/(slug+'.html')
            if not src.exists():sys.exit('SOURCE_MISSING '+str(src))
            data=src.read_text('utf-8')
            url='https://www.arquindex.com.br/'+slug+'.html'
            data=data.replace('<meta name="robots" content="noindex,follow">','<meta name="robots" content="index,follow"><link rel="canonical" href="'+url+'">')
            if 'rel="canonical"' not in data:data=data.replace('</head>','<link rel="canonical" href="'+url+'"></head>')
            if data.count('<h1')!=1 or url not in data:sys.exit('HTML_INVALID '+slug)
            payload=data.encode()
            ftp.cwd(root)
            existing=bytearray()
            try:ftp.retrbinary('RETR '+slug+'.html',existing.extend)
            except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
            if existing==payload:
              print('UNCHANGED',slug);continue
            if existing:
              backup=slug+'.html.backup-'+str(int(time.time()))
              ftp.storbinary('STOR '+backup,io.BytesIO(existing))
              print('BACKUP',backup)
            ftp.storbinary('STOR '+slug+'.html',io.BytesIO(payload))
            print('UPLOADED',slug,'SHA256',hashlib.sha256(payload).hexdigest())
            verified=False
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'ArquindexPublishCheck/1.0'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  body=response.read().decode('utf-8','replace')
                  verified=response.status==200 and url in body and 'noindex' not in body
                  print('HTTP_CHECK',slug,response.status,verified)
                  if verified:break
              except Exception as e:print('HTTP_CHECK_RETRY',slug,type(e).__name__)
              time.sleep(4)
            if not verified:sys.exit('PUBLISHED_BUT_HTTP_NOT_VERIFIED '+slug+'; arquivo mantido e backup disponivel')
          ftp.quit()
          PY

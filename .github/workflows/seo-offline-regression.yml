name: SEO offline regression
on:
  push:
    branches: [ops/seo-credentials-validation-20261104]
    paths:
      - 'scripts/wix_semantic_seo.py'
      - 'painel-seo/collect_gsc.py'
      - 'tests/test_wix_semantic_seo.py'
      - 'tests/test_collect_gsc.py'
      - '.github/workflows/seo-offline-regression.yml'
  pull_request:
    paths:
      - 'scripts/wix_semantic_seo.py'
      - 'painel-seo/collect_gsc.py'
      - 'tests/test_wix_semantic_seo.py'
      - 'tests/test_collect_gsc.py'
      - '.github/workflows/seo-offline-regression.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openai
      - run: python -m unittest discover -s tests -p test_collect_gsc.py -v
      - run: python -m unittest discover -s tests -p test_wix_semantic_seo.py -v

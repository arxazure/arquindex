name: Publicar artes individuais dos posts Arquindex 20261025
on:
  push:
    branches: [master]
    paths:
      - 'campanhas/design-20261025/posts-individuais/artes.zip'
      - 'scripts/deploy-artes-posts-20261025.py'
      - '.github/workflows/publicar-artes-posts-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-homehost-design-20261025
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publicar artes e validar HTTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-artes-posts-20261025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artes-individuais-20261025
          path: publish-report/artes-individuais-20261025.json

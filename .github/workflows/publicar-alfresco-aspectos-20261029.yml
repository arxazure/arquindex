name: Publicar aspectos e temporalidade Alfresco
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publicar-alfresco-aspectos-20261029.yml'
      - 'blog/alfresco-community-gestao-documental-sem-amps/**'
      - 'manuais/alfresco-community-aspectos-temporalidade/**'
      - 'scripts/publicar-alfresco-aspectos-20261029.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-alfresco-aspectos
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publicar paginas e links com verificacao
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publicar-alfresco-aspectos-20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-paginas-alfresco
          path: backup-alfresco-publicacao/
          if-no-files-found: ignore

name: Auditar ARQ-083 a ARQ-088 2026-10-23 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/auditoria-seo-20261023-manha.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preparar Playwright
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/arq-audit" playwright --no-audit --no-fund
      - name: Auditar seis URLs em mobile e desktop
        run: |
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/arq-audit/node_modules/playwright'); let browser;
          const urls=[
            ['ARQ-083','https://aplicativos-facilitam-digitalizacao-documentos-pelo-celular.arquindex.com.br/'],
            ['ARQ-084','https://comoadequaralgpd.arquindex.com.br/'],
            ['ARQ-085','https://consultoria-conarq-mg.arquindex.com.br/'],
            ['ARQ-086','https://databook-petrobras-elaboracao.arquindex.com.br/'],
            ['ARQ-087','https://decreto10278-nova-lima.arquindex.com.br/custo.html'],
            ['ARQ-088','https://encontrar-consultoria-conformidade-lgpd-bom-custo-beneficio.arquindex.com.br/comparativo.html']
          ];
          (async()=>{browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          for(const vp of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:900}]){
            const c=await browser.newContext({viewport:{width:vp.width,height:vp.height},isMobile:vp.name==='mobile'});
            for(const [id,url] of urls){const p=await c.newPage();let r=null,err='';
              try{r=await p.goto(url+'?audit=20261023manha',{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(1200);}catch(e){err=String(e.message||e)}
              const d=await p.evaluate(()=>({url:location.href,title:document.title,h1:[...document.querySelectorAll('h1')].map(x=>x.textContent.trim()),description:document.querySelector('meta[name="description"]')?.content||'',canonical:[...document.querySelectorAll('link[rel=canonical]')].map(x=>x.href),robots:document.querySelector('meta[name=robots]')?.content||'',logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),menu:!!document.querySelector('#aq-nav'),widget:document.querySelectorAll('#arq-floating').length,oldWidgets:document.querySelectorAll('.aq-brand-wa,#wa-widget-send-button').length,proposal:[...document.querySelectorAll('a')].some(a=>a.href.includes('solicitar-proposta-contratacao')),aeo:document.querySelectorAll('[data-aq-aeo]').length,links:[...document.querySelectorAll('a[href]')].filter(a=>a.href.includes('arquindex.com.br')).length,forms:document.querySelectorAll('form').length,cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth,words:(document.body.innerText||'').trim().split(/\s+/).filter(Boolean).length}));
              console.log('AUDIT',JSON.stringify({id,vp:vp.name,status:r?.status()||0,err,...d}));await p.close();}
            await c.close();}
          await browser.close();})().catch(async e=>{console.error(e);if(browser)await browser.close().catch(()=>{});process.exitCode=1});
          JS

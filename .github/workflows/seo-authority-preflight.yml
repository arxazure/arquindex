name: SEO Authority Preflight (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/seo_*preflight.py'
      - 'scripts/seo_priority_queue.py'
      - 'tests/test_seo_*preflight.py'
      - 'tests/test_seo_priority_queue.py'
      - '.github/workflows/seo-authority-preflight.yml'
  schedule:
    - cron: '33 10 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for preflight rules
        run: python3 -m unittest discover -s tests -p 'test_seo_*preflight.py'
      - name: Unit tests for SEO priority queue
        run: python3 -m unittest discover -s tests -p test_seo_priority_queue.py
      - name: Inspect versioned HTML without publishing
        run: python3 scripts/seo_authority_preflight.py --out seo-report/authority-preflight.json
      - name: Audit versioned sitemap XML without submitting
        run: python3 scripts/seo_sitemap_preflight.py --out seo-report/sitemap-preflight.json
      - name: Generate human-review remediation queue
        run: python3 scripts/seo_priority_queue.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo-authority-preflight
          path: |
            seo-report/authority-preflight.json
            seo-report/sitemap-preflight.json
            seo-report/priority-queue.json
            seo-report/priority-review.csv
          retention-days: 30

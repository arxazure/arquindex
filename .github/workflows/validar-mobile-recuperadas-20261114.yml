name: Validar mobile tres paginas recuperadas 2026-11-14

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validar-mobile-recuperadas-20261114.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Validar mobile e desktop
        env:
          URLS: 'https://instalacao-acervos-preco.arquindex.com.br/|https://armazenamento.arquindex.com.br/|https://consultorias-adequacao-lgpd-diagnostico-completo-privacidade.arquindex.com.br/'
        run: |
          python - <<'PY'
          import os, json
          from playwright.sync_api import sync_playwright

          out = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for url in os.environ['URLS'].split('|'):
                  item = {'url': url, 'viewports': {}}
                  for label, width, height in [('mobile',390,844),('desktop',1440,1000)]:
                      page = browser.new_page(viewport={'width':width,'height':height})
                      response = page.goto(url, wait_until='networkidle', timeout=45000)
                      metrics = page.evaluate("""() => {
                        const body = document.body;
                        const html = document.documentElement;
                        const title = document.title;
                        const h1 = [...document.querySelectorAll('h1')].map(x => x.innerText.trim());
                        const charset = document.characterSet;
                        const text = body ? body.innerText : '';
                        return {
                          statusTitle: title,
                          h1,
                          charset,
                          scrollWidth: Math.max(body?.scrollWidth || 0, html?.scrollWidth || 0),
                          clientWidth: html?.clientWidth || 0,
                          overflow: Math.max(body?.scrollWidth || 0, html?.scrollWidth || 0) > (html?.clientWidth || 0) + 1,
                          mojibake: /Ã[§£¡©]|â[€“€™]/.test(text),
                          whatsapp: !!document.querySelector('a[href*="wa.me"],a[href*="whatsapp"]'),
                          forms: document.querySelectorAll('form').length,
                          logo: !![...document.images].find(x => /arquindex/i.test(x.alt || x.src)),
                          nav: !!document.querySelector('nav')
                        };
                      }""")
                      metrics['http_status'] = response.status if response else None
                      item['viewports'][label] = metrics
                      page.close()
                  out.append(item)
                  print(json.dumps(item, ensure_ascii=False))
              browser.close()
          with open('validacao-mobile-recuperadas.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          assert len(out) == 3
          assert all(v['http_status'] == 200 for x in out for v in x['viewports'].values())
          PY
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-mobile-recuperadas-20261114
          path: validacao-mobile-recuperadas.json

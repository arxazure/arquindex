name: HomeHost backup retomavel inicio 20261026

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/homehost-resumable-backup-start-20261026.yml"

permissions:
  contents: read

concurrency:
  group: arquindex-homehost-weekly-maintenance
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar sem conexao de rede
        run: python -m unittest discover -s tests -p "test_homehost_resumable_backup.py" -v
      - name: Iniciar backup privado retomavel
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST || 'h59.servidorhh.com' }}
        run: python seo-rotinas/homehost-resumable-backup.py --resume ""

name: Publicar design e materiais Arquindex 20261025
on:
  push:
    branches: [master]
    paths:
      - 'campanhas/design-20261025/release.zip'
      - 'scripts/deploy-design-20261025.py'
      - '.github/workflows/publicar-design-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-homehost-design-20261025
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Preparar codificação de imagens para redes sociais
        run: python3 -m pip install Pillow==12.0.0
      - name: Abrir pacote validado
        run: python3 -m zipfile -e campanhas/design-20261025/release.zip campanhas/design-20261025/public
      - name: Validar páginas e materiais
        env:
          VALIDATE_ONLY: '1'
        run: python3 scripts/deploy-design-20261025.py
      - name: Publicar com backup privado e rollback
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-design-20261025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-design-20261025
          path: publish-report/design-20261025.json

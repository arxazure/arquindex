name: Melhorar ARQ-095 ARQ-096 ARQ-098 2026-10-23 noite
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261023-noite.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pillow
      - name: Identidade ARQ-095
        env:
          DESIGN_TARGET: https://digitalizar-ocr-empresas.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-096
        env:
          DESIGN_TARGET: https://empresas-digitalizacao-documentos-regiao.arquindex.com.br/como-escolher.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-098
        env:
          DESIGN_TARGET: https://digitalizardocumentos.arquindex.com.br/o-que-e.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteúdo, sitemaps e artes
        run: python scripts/rodada-seo-20261023-noite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-seo-20261023-noite
          path: design-report/

name: Capture integrity tests
on:
  pull_request:
    paths:
      - 'capture-integrity/**'
      - '.github/workflows/capture-integrity-test.yml'
  push:
    branches:
      - feat/decreto-10278-hash-metadados-20261026
    paths:
      - 'capture-integrity/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node unit tests
        working-directory: capture-integrity
        run: npm ci && npm test
  postgres-ocr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: capture-test-only
          POSTGRES_DB: capture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real OCR tools
        run: sudo apt-get update && sudo apt-get install -y ocrmypdf poppler-utils tesseract-ocr-eng python3-pil fonts-dejavu-core
      - name: Test disposable PostgreSQL and real OCR
        working-directory: capture-integrity
        env:
          TEST_DATABASE_URL: postgres://postgres:capture-test-only@localhost:5432/capture_test
          CAPTURE_REAL_OCR: '1'
        run: npm ci && node --test integration.test.js

name: Coverage inventario de rotas
on:
  push:
    branches: [master]
    paths: ['.github/workflows/coverage-route-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar roteamento
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/coverage-route-inventory.py

name: Publicar ARQ-234 HomeHost - 2026-11-04 tarde
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publicar-arq234-homehost-20261104-tarde.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gerar e validar Vespasiano
        run: |
          node scripts/build-digitalize.mjs
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path('digitalize-output/digitalize/vespasiano/index.html');s=p.read_text()
          assert len(re.findall(r'<h1\b',s,re.I))==1
          assert 'https://www.arquindex.com.br/digitalize/vespasiano/' in s
          assert 'aq-logo-name' in s and 'arq-floating' in s
          assert 'utm_campaign=digitalize_vespasiano' in s
          assert 'noindex' not in s.lower()
          print('SOURCE_VALIDATED',len(s))
          PY
      - name: Resolver FTPS com TLS verificado
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
        shell: bash
        run: |
          set -euo pipefail
          cert=$(timeout 25 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName)
          selected=""
          if echo "$cert" | grep -Eq "DNS:$FTP_HOST([,[:space:]]|$)"; then selected="$FTP_HOST"; else
            original_ips=$(getent ahostsv4 "$FTP_HOST" | awk '{print $1}' | sort -u)
            while IFS= read -r candidate; do
              case "$candidate" in ""|*"*"*) continue ;; esac
              candidate_ips=$(getent ahostsv4 "$candidate" 2>/dev/null | awk '{print $1}' | sort -u || true)
              [ -n "$candidate_ips" ] || continue
              comm -12 <(printf '%s\n' "$original_ips") <(printf '%s\n' "$candidate_ips") | grep -q . || continue
              if timeout 25 openssl s_client -starttls ftp -connect "$candidate:21" -servername "$candidate" -verify_hostname "$candidate" -verify_return_error </dev/null 2>&1 | grep -q 'Verification: OK'; then selected="$candidate"; break; fi
            done < <(echo "$cert" | grep -oE 'DNS:[A-Za-z0-9.*_-]+(\.[A-Za-z0-9.*_-]+)+' | sed 's/^DNS://' | sort -u)
          fi
          test -n "$selected" || { echo "::error::FTPS sem hostname verificável"; exit 1; }
          echo "FTP_DEPLOY_HOST=$selected" >> "$GITHUB_ENV"
          echo "FTPS_VERIFIED $selected"
      - name: Backup remoto, publicar e conferir leitura
        env:
          FTP_HOST: ${{ env.FTP_DEPLOY_HOST }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASS"
          python - <<'PY'
          import ftplib,ssl,pathlib,hashlib,io,json,os
          local=pathlib.Path('digitalize-output/digitalize/vespasiano/index.html').read_bytes()
          remote='public_html/digitalize/vespasiano/index.html'
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(os.environ['FTP_HOST'],21);f.login(os.environ['FTP_USER'],os.environ['FTP_PASS']);f.prot_p()
          old=bytearray();f.retrbinary('RETR '+remote,old.extend)
          pathlib.Path('backup').mkdir();pathlib.Path('backup/arq234.before.html').write_bytes(old)
          manifest={'remote':remote,'before_sha256':hashlib.sha256(old).hexdigest(),'after_sha256':hashlib.sha256(local).hexdigest()}
          f.storbinary('STOR '+remote,io.BytesIO(local));check=bytearray();f.retrbinary('RETR '+remote,check.extend);f.quit()
          assert hashlib.sha256(check).digest()==hashlib.sha256(local).digest()
          pathlib.Path('backup/manifest.json').write_text(json.dumps(manifest,indent=2))
          print('BACKUP_AND_READBACK',json.dumps(manifest))
          PY
      - name: Verificar público e sitemap
        run: |
          python - <<'PY'
          import urllib.request,re,xml.etree.ElementTree as ET
          u='https://www.arquindex.com.br/digitalize/vespasiano/'
          b=urllib.request.urlopen(urllib.request.Request(u+'?v=20261104tarde',headers={'Cache-Control':'no-cache','User-Agent':'ArquindexSEO/1.0'}),timeout=40).read().decode('utf-8','replace')
          assert len(re.findall(r'<h1\b',b,re.I))==1
          assert 'rel="canonical" href="'+u+'"' in b and 'aq-logo-name' in b and 'arq-floating' in b
          assert 'utm_campaign=digitalize_vespasiano' in b
          sm=urllib.request.urlopen('https://www.arquindex.com.br/digitalize/sitemap.xml',timeout=40).read()
          assert u in {x.text for x in ET.fromstring(sm).iter() if x.tag.endswith('loc')}
          print('PUBLIC_VERIFIED',u)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backup-arq234-${{ github.run_id }}, path: backup/, retention-days: 30 }

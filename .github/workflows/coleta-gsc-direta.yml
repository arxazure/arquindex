name: Arquindex GSC direct daily
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/coleta-gsc-direta.yml'
      - 'painel-seo/collect_gsc.py'
      - 'tests/test_collect_gsc.py'
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar limites e preservacao de dados GSC sem credenciais
        run: python -m unittest discover -s tests -p test_collect_gsc.py -v
  collect:
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Google Search Console data
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python3 painel-seo/collect_gsc.py
      - name: Commit collected data
        run: |
          if test -f painel-seo/gsc-real.json; then
            git config user.name arquindex-gsc-bot
            git config user.email actions@users.noreply.github.com
            git add painel-seo/gsc-real.json
            if ! git diff --cached --quiet; then
              git commit -m 'data: refresh verified GSC metrics'
              git push
            fi
          fi

name: Arquindex GSC direct daily
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Google Search Console data
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python3 painel-seo/collect_gsc.py
      - name: Commit collected data
        run: |
          if test -f painel-seo/gsc-real.json; then
            git config user.name arquindex-gsc-bot
            git config user.email actions@users.noreply.github.com
            git add painel-seo/gsc-real.json
            if ! git diff --cached --quiet; then
              git commit -m 'data: refresh verified GSC metrics'
              git push
            fi
          fi

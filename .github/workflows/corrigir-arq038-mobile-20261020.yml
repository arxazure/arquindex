name: Corrigir ARQ-038 mobile 2026-10-20
on:
  push:
    branches: [master]
    paths: ['.github/workflows/corrigir-arq038-mobile-20261020.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python scripts/corrigir-arq038-mobile-20261020.py

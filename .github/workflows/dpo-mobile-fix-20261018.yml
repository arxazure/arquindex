name: Corrigir overflow mobile DPO sem ocultar contatos
on:
  push:
    branches: [master]
    paths: ['.github/workflows/dpo-mobile-fix-20261018.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Corrigir componentes com backup e verificacao publica
        run: |
          python - <<'PY'
          import ftplib,io,os,hashlib,urllib.request
          from datetime import datetime,timezone
          style="<style id=\"arquindex-dpo-mobile-20261018\">\n@media(max-width:767px){\n div:has(> .trust-card){display:grid!important;grid-template-columns:minmax(0,1fr)!important;width:100%;max-width:100%;box-sizing:border-box;}\n .trust-card{min-width:0!important;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;}\n #wa-widget-send-button{left:auto!important;right:16px!important;max-width:calc(100vw - 32px)!important;box-sizing:border-box!important;}\n}\n</style>"
          url='https://7-motivos-contar-dpo-terceirizado.arquindex.com.br/'
          def public():
           with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ArquindexSEO/1.0','Cache-Control':'no-cache'}),timeout=30) as r:assert r.status==200;return r.read()
          def read(f,p):
           b=bytearray();f.retrbinary('RETR '+p,b.extend);return bytes(b)
          def put(f,p,b):f.storbinary('STOR '+p,io.BytesIO(b));assert read(f,p)==b
          with ftplib.FTP_TLS(timeout=35) as f:
           f.connect('ftp.arquindex.com.br',21);f.login('arquind2',os.environ['FTP_PASSWORD']);f.prot_p()
           p='/7-motivos-contar-dpo-terceirizado.arquindex.com.br/index.html';old=read(f,p);assert old==public(),'SOURCE_PUBLIC_MISMATCH';s=old.decode()
           if 'id="arquindex-dpo-mobile-20261018"' in s:print('ALREADY_APPLIED');raise SystemExit(0)
           assert 'trust-card' in s and '</head>' in s.lower()
           i=s.lower().index('</head>');new=(s[:i]+style+'\n'+s[i:]).encode()
           assert b'Require all denied' in read(f,'/seo-backups/.htaccess')
           stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ');put(f,'/seo-backups/dpo-mobile-'+stamp+'.html',old)
           assert read(f,p)==old,'CONCURRENT_CHANGE'
           try:put(f,p,new);assert public()==new,'PUBLIC_MISMATCH'
           except Exception:put(f,p,old);assert public()==old;print('ROLLBACK_VERIFIED');raise
           print('PUBLIC_VERIFIED',url,hashlib.sha256(new).hexdigest(),flush=True)
          
          PY

name: Publicar landing pages BH Arquindex
on:
  push:
    branches: [master]
    paths:
      - 'alfresco-ecm-open-source/index.html'
      - '.github/workflows/publicar-landingpages-bh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Enviar paginas via FTPS com TLS validado
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_PASS"
          python3 - <<'PY'
          import ftplib,os,io
          host=os.environ['FTP_HOST']
          ftp=ftplib.FTP_TLS(host,timeout=35)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASS'])
          ftp.prot_p()
          ftp.cwd('public_html')
          for slug in ('alfresco-ecm-open-source',):
              try: ftp.mkd(slug)
              except ftplib.error_perm: pass
              data=open(slug+'/index.html','rb').read()
              ftp.storbinary('STOR '+slug+'/index.html',io.BytesIO(data))
              check=bytearray()
              ftp.retrbinary('RETR '+slug+'/index.html',check.extend)
              assert check==data,'Remote bytes differ: '+slug
              print('UPLOAD_VERIFIED',slug)
          ftp.quit()
          PY
      - name: Verificar publicacao HTTP
        run: |
          set -euo pipefail
          for slug in alfresco-ecm-open-source; do
            curl --fail --location --silent --show-error --retry 3 "https://www.arquindex.com.br/$slug/" | grep -qi '<html'
            echo "PUBLIC_OK https://www.arquindex.com.br/$slug/"
          done

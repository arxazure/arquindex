name: Publicar manuais digitalizacao e guarda
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publicar-manuais-20261025.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-manuais-20261025
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publicar paginas novas autorizadas
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publicar-manuais-20261025.py

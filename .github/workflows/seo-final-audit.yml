name: Auditoria final da recuperacao SEO
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir sitemaps canonicas e rastreamento publicados
        run: |
          python - <<'PY'
          import concurrent.futures,json,urllib.parse,urllib.robotparser,xml.etree.ElementTree as ET
          from scripts.seo_recovery import BASE,NS,fetch
          main=fetch(BASE+"/sitemap.xml")
          if main.get("status")!=200:raise RuntimeError("Indice indisponivel")
          index=ET.fromstring(main["data"]);maps=[];urls=[]
          for node in index.findall(".//{"+NS+"}loc"):
           u=(node.text or "").strip();r=fetch(u)
           if r.get("status")!=200:raise RuntimeError("Mapa filho indisponivel")
           child=ET.fromstring(r["data"])
           if child.tag!="{"+NS+"}urlset":raise RuntimeError("Mapa filho invalido")
           locs=[(x.text or "").strip() for x in child.findall(".//{"+NS+"}loc")]
           maps.append({"url":u,"status":r["status"],"entries":len(locs)})
           urls.extend(locs)
          unique=list(dict.fromkeys(urls))
          robots=fetch(BASE+"/robots.txt");parser=urllib.robotparser.RobotFileParser()
          if robots.get("status")!=200:raise RuntimeError("robots.txt indisponivel")
          parser.parse(robots["data"].decode("utf-8").splitlines())
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:checks=list(pool.map(fetch,unique))
          problems=[]
          for u,c in zip(unique,checks):
           if c.get("status")!=200 or c.get("noindex") or c.get("canonical")!=[c.get("final")] or not parser.can_fetch("Googlebot",u):
            problems.append({"url":u,"status":c.get("status"),"final":c.get("final"),"canonical":c.get("canonical"),"noindex":c.get("noindex"),"robots_allowed":parser.can_fetch("Googlebot",u),"error":c.get("error")})
          blog=fetch(BASE+"/blog-original/")
          report={"sitemaps":maps,"entries":len(urls),"unique_urls":len(unique),"duplicate_entries":len(urls)-len(unique),"http_200":sum(c.get("status")==200 for c in checks),"http_404":sum(c.get("status")==404 for c in checks),"static_original_articles":sum("/blog-original/" in u for u in unique),"remaining_query_urls":sum(bool(urllib.parse.urlsplit(u).query) for u in unique),"index_blog_status":blog.get("status"),"index_blog_canonical":blog.get("canonical"),"problems":problems}
          print("AUDITORIA_FINAL",json.dumps(report,ensure_ascii=False),flush=True)
          if problems or blog.get("status")!=200:raise RuntimeError("Auditoria encontrou pendencias")
          
          PY

name: Diagnosticar overflow ARQ-055 2026-10-21
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-overflow-arq055-20261021.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/arq-debug" playwright --no-audit --no-fund
      - run: |
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/arq-debug/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});const c=await b.newContext({viewport:{width:390,height:844},isMobile:true});const p=await c.newPage();await p.goto('https://arquivo.arquindex.com.br/bh.html?debug=20261021',{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(2500);const d=await p.evaluate(()=>{const cw=document.documentElement.clientWidth;return {cw,sw:document.documentElement.scrollWidth,offenders:[...document.querySelectorAll('body *')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,cls:String(e.className||'').slice(0,100),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:e.scrollWidth,text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,120)}}).filter(x=>x.right>cw+2||x.left<-2||x.scrollWidth>x.width+2).slice(0,80)}});console.log('OVERFLOW',JSON.stringify(d));await b.close();})();
          JS

name: Diagnosticar overflow ARQ-098 2026-10-23
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-arq098-20261023.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install --prefix "$RUNNER_TEMP/arq" playwright --no-audit --no-fund
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/arq/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});const c=await b.newContext({viewport:{width:390,height:844},isMobile:true});const p=await c.newPage();await p.goto('https://digitalizardocumentos.arquindex.com.br/o-que-e.html?overflow=20261023',{waitUntil:'domcontentloaded'});await p.waitForTimeout(800);console.log('OVERFLOW',await p.evaluate(()=>[...document.querySelectorAll('*')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,cls:e.className,x:Math.round(r.x),right:Math.round(r.right),w:Math.round(r.width),text:(e.textContent||'').trim().slice(0,100)}}).filter(x=>x.right>document.documentElement.clientWidth+2||x.x<-2).slice(0,40)));await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS

name: Arquindex SEO existing-first guarded deploy
on:
  push:
    paths:
      - '.github/workflows/seo-existing-first-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-existing-first
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy guarded updates with verified backup and rollback
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 seo-rotinas/existing-first-20261018.py

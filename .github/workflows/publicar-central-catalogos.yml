name: Publicar central de servicos e catalogos PDF
on:
  push:
    paths:
      - '.github/workflows/publicar-central-catalogos.yml'
      - 'scripts/catalogos/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-publicacao-homehost-central
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install reportlab
      - name: Gerar PDFs e publicar com backup e verificacao publica
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/catalogos/publicar_central.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogos-arquindex
          path: central-output/

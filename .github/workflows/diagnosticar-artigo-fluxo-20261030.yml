name: Restabelecer artigo fluxo Alfresco
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-artigo-fluxo-20261030.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artigo-fluxo-alfresco-repair
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e reparar somente o arquivo do artigo
        continue-on-error: true
        env:
          FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST || 'h59.servidorhh.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,hashlib,io,datetime,json
          from pathlib import Path
          out=Path('report');out.mkdir(exist_ok=True)
          rel='blog/alfresco-recebimento-aprovacao-revisao-compartilhamento/index.html';target='/public_html/'+rel
          expected=Path(rel).read_bytes();report={'source_sha256':hashlib.sha256(expected).hexdigest(),'changed':False}
          def get(f,p):
            b=bytearray()
            try:f.retrbinary('RETR '+p,b.extend)
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
            return bytes(b)
          def put(f,p,b):f.storbinary('STOR '+p,io.BytesIO(b));assert get(f,p)==b
          def mkdir(f,p):
            cur=''
            for bit in p.strip('/').split('/'):
              cur+='/'+bit
              try:f.mkd(cur)
              except ftplib.error_perm as e:
                if not str(e).startswith('550'):raise
          try:
            with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35) as f:
              f.connect(os.environ['FTP_TLS_HOST'],21);f.login('arquind2',os.environ['FTP_PASSWORD']);f.prot_p()
              before=get(f,target);report['remote_exists']=before is not None
              if before!=expected:
                assert before is None or b'ARQ-ALFRESCO-AUTOMACAO-20261029' in before,'REMOTE_CONTENT_CHANGED_REVIEW_REQUIRED'
                backup='/seo-backups/artigo-fluxo-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
                mkdir(f,backup);put(f,backup+'/.htaccess',b'Require all denied\n')
                if before is not None:put(f,backup+'/index.html.bak',before)
                mkdir(f,target.rsplit('/',1)[0]);assert get(f,target)==before
                put(f,target,expected);report['changed']=True
              report['ftps_verified']=get(f,target)==expected
              print('ARTICLE_FTPS_RESULT',json.dumps(report),flush=True)
          except Exception as e:
            report['error']=type(e).__name__+': '+str(e)[:180];print('ARTICLE_FTPS_ERROR',report['error'],flush=True)
          (out/'origin.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Conferir origem por HTTPS mantendo certificado e dominio
        continue-on-error: true
        run: |
          mkdir -p report
          curl --connect-timeout 8 --max-time 20 --resolve www.arquindex.com.br:443:177.234.150.42 -sS -D report/origin-headers.txt 'https://www.arquindex.com.br/blog/alfresco-recebimento-aprovacao-revisao-compartilhamento/' -o report/origin-response.html
          python3 - <<'PY'
          import pathlib,re,json
          p=pathlib.Path('report/origin-response.html')
          if p.exists():
            s=p.read_text(errors='replace');print('ORIGIN_HTTPS_RESULT',json.dumps({'marker':'ARQ-ALFRESCO-AUTOMACAO-20261029' in s,'title':re.findall('<title>(.*?)</title>',s,re.S)[:1]}))
          PY
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install playwright --ignore-scripts --no-audit --no-fund
      - name: Verificar DNS publico e artigo em desktop e Android
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright');const fs=require('fs');
          (async()=>{
            const report={dns:[],pages:[]};
            for(const name of ['www.arquindex.com.br','arquindex.com.br']){
              for(const endpoint of ['https://dns.google/resolve?name=','https://cloudflare-dns.com/dns-query?name=']){
                try{const r=await fetch(endpoint+name+'&type=A',{headers:{accept:'application/dns-json'},signal:AbortSignal.timeout(7000)});const d=await r.json();report.dns.push({name,resolver:endpoint,...d});console.log('DNS_RESULT',JSON.stringify({name,resolver:endpoint,...d}));}catch(e){console.log('DNS_ERROR',name,e.message)}
              }
            }
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const [label,opts] of [['desktop',{}],['android',devices['Pixel 7']]]){
              const c=await b.newContext(opts);const p=await c.newPage();
              const url='https://www.arquindex.com.br/blog/alfresco-recebimento-aprovacao-revisao-compartilhamento/';
              try{const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:20000});const data=await p.evaluate(()=>({title:document.title,h1:document.querySelector('h1')?.innerText,canonical:document.querySelector('link[rel=canonical]')?.href,marker:document.documentElement.outerHTML.includes('ARQ-ALFRESCO-AUTOMACAO-20261029'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}));const row={label,url,status:r.status(),...data};report.pages.push(row);console.log('PUBLIC_ARTICLE',JSON.stringify(row));await p.screenshot({path:'report/'+label+'.png',fullPage:false});}catch(e){const row={label,url,error:e.message.slice(0,250)};report.pages.push(row);console.log('PUBLIC_ARTICLE_ERROR',JSON.stringify(row))}
              await c.close();
            }
            await b.close();fs.writeFileSync('report/public.json',JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artigo-fluxo-restabelecimento
          path: report/
          if-no-files-found: ignore

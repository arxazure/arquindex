name: Diagnosticar artigo fluxo Alfresco
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-artigo-fluxo-20261030.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install playwright --ignore-scripts --no-audit --no-fund
      - name: Conferir respostas e telas reais
        run: |
          mkdir -p report
          node <<'JS'
          const {chromium,devices}=require('playwright');const dns=require('dns').promises;
          (async()=>{
            for(const name of ['www.arquindex.com.br','arquindex.com.br']){
              try{console.log('DNS',name,JSON.stringify(await dns.lookup(name,{all:true})))}catch(e){console.log('DNS_SYSTEM_ERROR',name,e.code)}
              for(const endpoint of ['https://dns.google/resolve?name=','https://cloudflare-dns.com/dns-query?name=']){
                try{const d=await fetch(endpoint+name+'&type=A',{headers:{accept:'application/dns-json'}});console.log('DNS_DOH',endpoint,name,JSON.stringify(await d.json()))}catch(e){console.log('DNS_DOH_ERROR',name,e.message)}
              }
            }
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const path='/blog/alfresco-recebimento-aprovacao-revisao-compartilhamento/';
            const targets=[
              ['desktop','https://www.arquindex.com.br'+path,{}],
              ['android','https://www.arquindex.com.br'+path,devices['Pixel 7']],
              ['android-nocache','https://www.arquindex.com.br'+path+'?verificacao=20261030',devices['Pixel 7']],
              ['index-html','https://www.arquindex.com.br'+path+'index.html',{}],
              ['sem-barra','https://www.arquindex.com.br'+path.slice(0,-1),{}],
              ['sem-www','https://arquindex.com.br'+path,{}]
            ];
            for(const [label,url,opts] of targets){
              const c=await b.newContext(opts);const p=await c.newPage();
              try{const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await p.waitForTimeout(500);
                const d=await p.evaluate(()=>({title:document.title,h1:document.querySelector('h1')?.innerText,canonical:document.querySelector('link[rel=canonical]')?.href,body:document.body.innerText.slice(0,300),sw:navigator.serviceWorker?.controller?.scriptURL||null}));
                console.log('PUBLIC_RESULT',JSON.stringify({label,url,status:r.status(),final:p.url(),headers:r.headers(),...d}));
                await p.screenshot({path:'report/'+label+'.png',fullPage:false});
              }catch(e){console.log('PUBLIC_ERROR',label,e.message.slice(0,250))}
              await c.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-artigo-fluxo
          path: report/
          if-no-files-found: ignore

name: HomeHost backup retomavel 20261026 checkpoint 14

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/homehost-resumable-backup-resume-20261026-000014.yml"

permissions:
  contents: read

concurrency:
  group: arquindex-homehost-weekly-maintenance
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar sem conexao de rede
        run: python -m unittest discover -s tests -p "test_homehost_resumable_backup.py" -v
      - name: Retomar checkpoint privado verificado
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST || 'h59.servidorhh.com' }}
        run: python seo-rotinas/homehost-resumable-backup.py --resume "/seo-backups/resumable/20261026T115321Z-4df745d1d388/checkpoint-000014-099eed968d6b.json"

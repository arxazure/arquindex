name: Publicar Digitalize BH e RMBH

on:
  push:
    branches: [master, main]
    paths:
      - 'blog/montagem-de-databooks-de-engenharia/index.html'
      - 'seo-regional/gestao-documental-ecm-databooks/**'
      - '.github/workflows/publicar-digitalize-homehost.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-databooks-homehost
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar credenciais FTP
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "::error::Defina FTP_TLS_HOST nas variables"; exit 1; }
          test -n "$FTP_USER" || { echo "::error::Usuario FTP nao configurado"; exit 1; }
          test -n "$FTP_PASS" || { echo "::error::Defina FTP_PASSWORD nos GitHub Actions Secrets"; exit 1; }
      - name: Detectar hostname FTPS valido
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
        shell: bash
        run: |
          set -euo pipefail
          # Nao desabilita a verificacao TLS: exige nome valido e o mesmo IP.
          cert=$(timeout 25 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName)
          echo "$cert"
          selected=""
          if echo "$cert" | grep -Eq "DNS:$FTP_HOST([,[:space:]]|$)"; then
            selected="$FTP_HOST"
          else
            original_ips=$(getent ahostsv4 "$FTP_HOST" | awk '{print $1}' | sort -u)
            while IFS= read -r candidate; do
              case "$candidate" in ""|*"*"*) continue ;; esac
              candidate_ips=$(getent ahostsv4 "$candidate" 2>/dev/null | awk '{print $1}' | sort -u || true)
              [ -n "$candidate_ips" ] || continue
              if ! comm -12 <(printf '%s\n' "$original_ips") <(printf '%s\n' "$candidate_ips") | grep -q .; then
                continue
              fi
              if timeout 25 openssl s_client -starttls ftp -connect "$candidate:21" -servername "$candidate" -verify_hostname "$candidate" -verify_return_error </dev/null 2>&1 | grep -q 'Verification: OK'; then
                selected="$candidate"
                break
              fi
            done < <(echo "$cert" | grep -oE 'DNS:[A-Za-z0-9.*_-]+(\.[A-Za-z0-9.*_-]+)+' | sed 's/^DNS://' | sort -u)
          fi
          if [ -z "$selected" ]; then
            echo "::error::O certificado FTPS nao tem hostname verificavel no mesmo IP. Configure vars.FTP_TLS_HOST com o hostname correto indicado pela HomeHost, ou solicite a correcao do certificado."
            exit 1
          fi
          echo "FTP_DEPLOY_HOST=$selected" >> "$GITHUB_ENV"
          echo "Servidor FTPS validado: $selected"
      - name: Instalar cliente FTP seguro
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Gerar paginas e sitemap
        run: node scripts/build-digitalize.mjs
      - name: Backup e publicacao FTPS
        env:
          FTP_HOST: ${{ env.FTP_DEPLOY_HOST }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="seo-backups/digitalize-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p /tmp/digitalize-backup
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          mkdir -f -p public_html/digitalize
          mirror --no-perms public_html/digitalize /tmp/digitalize-backup
          mkdir -f -p $backup_dir/digitalize
          mirror -R --no-perms /tmp/digitalize-backup $backup_dir/digitalize
          get public_html/robots.txt -o /tmp/robots-original.txt
          put /tmp/robots-original.txt -o $backup_dir/robots.txt
          mirror -R --verbose --no-perms digitalize-output/digitalize public_html/digitalize
          bye
          LFTP
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/robots-original.txt')
          text=p.read_text()
          line='Sitemap: https://www.arquindex.com.br/digitalize/sitemap.xml'
          if line not in text: text=text.rstrip()+'\n'+line+'\n'
          Path('/tmp/robots-digitalize.txt').write_text(text)
          PY
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          put /tmp/robots-digitalize.txt -o public_html/robots.txt
          bye
          LFTP
          echo "Backup remoto: $backup_dir"
      - name: Validar 12 paginas publicas e sitemap
        run: |
          python - <<'PY'
          import urllib.request,re,xml.etree.ElementTree as ET
          base='https://www.arquindex.com.br'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ArquindexPublicationCheck/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  assert r.status==200
                  return r.read().decode('utf-8')
          xml=get('/digitalize/sitemap.xml')
          urls=[e.text for e in ET.fromstring(xml).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==12
          for url in urls:
              path=url[len(base):]; page=get(path)
              assert 'href="'+url+'"' in page and '<h1>' in page and 'Digitalize' in page
              print('PUBLIC_VERIFIED',url)
          assert '/digitalize/sitemap.xml' in get('/robots.txt')
          print('SITEMAP_ROBOTS_VERIFIED')
          PY

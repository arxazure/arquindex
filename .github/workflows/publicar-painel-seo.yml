name: Publicar Arquindex Connect SEO
on:
  push:
    branches: [master]
    paths:
      - 'painel-seo/**'
      - '.github/workflows/publicar-painel-seo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estrutura e funcoes principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('painel-seo/index.html')
          s=p.read_text()
          for k in ('Central de crescimento orgânico','Canibalização','Concorrentes','Central de ações','csvParse','localStorage','Publicações'):
              assert k in s, f'Falta componente {k}'
          assert len(s)>15000
          print('QUALITY_GATE_OK')
          PY
      - name: Validar JavaScript e acessibilidade estrutural
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('painel-seo/index.html').read_text()
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.buttons=0
                  self.scripts=[]
                  self.capture=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag=='button': self.buttons+=1
                  if tag=='script' and not d.get('src'): self.capture=True
              def handle_endtag(self,tag):
                  if tag=='script': self.capture=False
              def handle_data(self,data):
                  if self.capture: self.scripts.append(data)
          p=Check()
          p.feed(html)
          required={'overview','ranking','competitors','cannibal','opportunities','actions','publications','sources','actionform','csv'}
          assert required <= p.ids, 'Missing UI modules: '+str(required-p.ids)
          assert p.buttons>=10,'Insufficient actionable controls'
          Path('/tmp/arquindex-panel.js').write_text(chr(10).join(p.scripts))
          print('STRUCTURE_OK',len(p.ids),'ids',p.buttons,'buttons')
          PY
          node --check /tmp/arquindex-panel.js
          echo JS_SYNTAX_OK
      - name: Publicar com FTPS
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_PASS"
          python3 - <<'PY'
          import ftplib,os,io
          ftp=ftplib.FTP_TLS(os.environ['FTP_HOST'],timeout=35)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASS'])
          ftp.prot_p()
          ftp.cwd('public_html')
          try: ftp.mkd('painel-seo')
          except ftplib.error_perm: pass
          data=open('painel-seo/index.html','rb').read()
          ftp.storbinary('STOR painel-seo/index.html',io.BytesIO(data))
          got=bytearray()
          ftp.retrbinary('RETR painel-seo/index.html',got.extend)
          assert got==data,'FTP integrity mismatch'
          print('UPLOAD_VERIFIED')
          ftp.quit()
          PY
      - name: Verificar resposta HTTP publica
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://www.arquindex.com.br/painel-seo/ -o /tmp/painel.html
          grep -q 'Central de crescimento orgânico' /tmp/painel.html
          grep -q 'Canibalização' /tmp/painel.html
          echo "PUBLIC_OK https://www.arquindex.com.br/painel-seo/"

name: Deduplicar seis entradas legadas com backup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/deduplicar-sitemaps-20261018.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  sitemaps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Preservar URLs, deduplicar e verificar
        run: |
          python - <<'PY'
          import os,io,ftplib,hashlib,json,re,urllib.request,urllib.error
          from datetime import datetime,timezone
          from xml.etree import ElementTree as E
          B='https://www.arquindex.com.br'
          N='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          E.register_namespace('',N[1:-1])
          targets={B+'/'+p for p in ['digitalizacao-documentos-belo-horizonte.html','digitalizacao-documentos-betim.html','digitalizacao-documentos-contagem.html','digitalizacao.html','gestao-documental.html','lgpd-consultoria.html']}
          def fetch(p):
           with urllib.request.urlopen(urllib.request.Request(B+p,headers={'User-Agent':'ArquindexSEO/1.0','Cache-Control':'no-cache'}),timeout=30) as r:
            assert r.status==200;return r.read()
          def locs(b):return [e.text for e in E.fromstring(b).iter(N+'loc')]
          def read(f,p):
           b=bytearray();f.retrbinary('RETR '+p,b.extend);return bytes(b)
          def put(f,p,b):
           f.storbinary('STOR '+p,io.BytesIO(b));assert read(f,p)==b,'READBACK'
          old=fetch('/sitemap-legado.xml')
          other=set(locs(fetch('/sitemap-paginas.xml'))+locs(fetch('/atendimento-rmbh/sitemap.xml')))
          assert targets<=other,'URL_NOT_PRESERVED_IN_SPECIFIC_MAP'
          x=E.fromstring(old);assert x.tag==N+'urlset'
          removed=[]
          for e in list(x):
           l=e.find(N+'loc')
           if l is not None and l.text in targets:removed.append(l.text);x.remove(e)
          if not removed:print('ALREADY_DEDUPLICATED',flush=True);raise SystemExit(0)
          assert len(removed)==6 and set(removed)==targets,'UNEXPECTED_REMOVAL_COUNT'
          new=E.tostring(x,encoding='utf-8',xml_declaration=True)
          assert set(locs(old))|other==set(locs(new))|other,'URL_LOSS'
          with ftplib.FTP_TLS(timeout=35) as f:
           f.connect('ftp.arquindex.com.br',21);f.login('arquind2',os.environ['FTP_PASSWORD']);f.prot_p()
           roots=[]
           for r in ['/public_html','']:
            p=r+'/sitemap-legado.xml'
            try:
             if read(f,p)==old:roots.append(p)
            except ftplib.error_perm:pass
           assert len(roots)==1,('ROOT_NOT_UNIQUE',len(roots))
           path=roots[0]
           try:f.mkd('/seo-backups')
           except ftplib.error_perm:pass
           try:rules=read(f,'/seo-backups/.htaccess')
           except ftplib.error_perm:rules=b''
           if b'Require all denied' not in rules:put(f,'/seo-backups/.htaccess',rules+b'\nOptions -Indexes\nRequire all denied\n')
           stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
           backup='/seo-backups/sitemap-legado-'+stamp+'.xml'
           put(f,backup,old);print('BACKUP_VERIFIED',hashlib.sha256(old).hexdigest(),flush=True)
           assert read(f,path)==old,'CONCURRENT_CHANGE'
           try:
            put(f,path,new)
            assert fetch('/sitemap-legado.xml')==new,'PUBLIC_MISMATCH'
            current_other=set(locs(fetch('/sitemap-paginas.xml'))+locs(fetch('/atendimento-rmbh/sitemap.xml')))
            assert targets<=current_other,'OTHER_MAP_CHANGED'
           except Exception:
            put(f,path,old);assert fetch('/sitemap-legado.xml')==old
            print('ROLLBACK_VERIFIED',flush=True);raise
           print('PUBLIC_VERIFIED',json.dumps({'removed':sorted(removed),'before':len(locs(old)),'after':len(locs(new)),'hash':hashlib.sha256(new).hexdigest()},ensure_ascii=False),flush=True)
          
          PY
  cpanel-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
    steps:
      - name: Revalidar credencial API sem expor valores
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse
          token=os.getenv('CPANEL_API_TOKEN')
          if not token:
              print('CPANEL_PENDING: CPANEL_API_TOKEN ausente; nenhum dominio alterado.');raise SystemExit(0)
          host=(os.getenv('CPANEL_HOST') or 'https://cpanel.arquindex.com.br:2083').rstrip('/')
          if not host.startswith('https://'):host='https://'+host
          assert urllib.parse.urlsplit(host).hostname in ['cpanel.arquindex.com.br','arquindex.com.br','www.arquindex.com.br','ftp.arquindex.com.br']
          user=os.getenv('CPANEL_USER') or 'arquind2'
          req=urllib.request.Request(host+'/execute/DomainInfo/list_domains',headers={'Authorization':'cpanel '+user+':'+token})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:d=json.load(r)
              assert d.get('status')==1 and d.get('data',{}).get('main_domain')=='arquindex.com.br'
              domains=set(d['data'].get('sub_domains',[]))
              print('CPANEL_AUTH_VERIFIED')
              for h in ['digitalizacaodedocumentosembh.arquindex.com.br','guardadocumentalembh.arquindex.com.br']:print('DOMAIN_REGISTERED',h,h in domains)
          except Exception as e:print('CPANEL_PENDING',type(e).__name__,getattr(e,'code',None));raise
          PY

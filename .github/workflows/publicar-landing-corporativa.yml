name: Publicar landing corporativa Arquindex
on:
  push:
    paths:
      - '.github/workflows/publicar-landing-corporativa.yml'
      - 'seo-corporativo/solucoes-corporativas-gestao-documental.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-landing-corporativa
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Publicar via FTP com backup e verificar HTTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os,ftplib,io,urllib.request,time
          src='seo-corporativo/solucoes-corporativas-gestao-documental.html'
          dst='solucoes-corporativas-gestao-documental.html'
          data=open(src,'rb').read()
          assert len(data)>20000 and b'<html' in data
          assert os.getenv('FTP_PASSWORD'), 'FTP_PASSWORD ausente'
          with ftplib.FTP('ftp.arquindex.com.br',timeout=40) as ftp:
            ftp.login('arquind2',os.environ['FTP_PASSWORD'])
            ftp.cwd('public_html')
            existing=set(ftp.nlst())
            if dst in existing:
              old=bytearray()
              ftp.retrbinary('RETR '+dst,old.extend)
              if bytes(old)==data:
                print('ALREADY_CURRENT',dst)
              else:
                stamp=time.strftime('%Y%m%d%H%M%S',time.gmtime())
                backup=dst+'.backup-'+stamp
                ftp.storbinary('STOR '+backup,io.BytesIO(old))
                print('BACKUP_CREATED',backup)
                ftp.storbinary('STOR '+dst,io.BytesIO(data))
            else:
              ftp.storbinary('STOR '+dst,io.BytesIO(data))
            check=bytearray()
            ftp.retrbinary('RETR '+dst,check.extend)
            assert bytes(check)==data,'FTP verification mismatch'
            print('FTP_CONTENT_VERIFIED',dst,len(data))
          url='https://www.arquindex.com.br/'+dst
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ArquindexDeployment/1.0','Cache-Control':'no-cache'}),timeout=30) as resp:
            page=resp.read()
            assert resp.status==200 and b'FAQPage' in page and b'Solicitar or' in page
            print('PUBLIC_VERIFIED',url,resp.status,len(page))
          PY

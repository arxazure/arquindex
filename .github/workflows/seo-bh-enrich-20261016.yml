name: SEO BH enrich 2026-10-16

on:
  push:
    paths:
      - '.github/workflows/seo-bh-enrich-20261016.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup, publicar e validar paginas BH
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, ftplib, io, re, json, datetime, urllib.request, urllib.error
          from xml.etree import ElementTree as ET

          assert os.environ.get('FTP_PASSWORD'), 'FTP_PASSWORD nao configurado'
          base='https://www.arquindex.com.br/'
          pages=[
            'alfresco-belo-horizonte.html',
            'gestao-documental-belo-horizonte.html',
            'consultoria-lgpd-belo-horizonte.html'
          ]
          monitored=['digitalizacao-documentos-belo-horizonte.html']+pages
          local={p:open('seo-bh/'+p,'rb').read() for p in pages}

          def validate_html(p,data,deep=True):
            text=data.decode('utf-8')
            expected=base+p
            assert '<meta name="viewport"' in text
            assert '<link rel="canonical" href="'+expected+'"' in text
            assert text.lower().count('<h1') == 1
            assert 'noindex' not in text.lower()
            assert '5531973632725' in text
            if deep:
              assert len(re.findall(r'\b[\wÀ-ÿ-]+\b',re.sub(r'<[^>]+>',' ',text))) >= 700
              blocks=re.findall(r'<script type="application/ld\+json">(.*?)</script>',text,re.S)
              assert len(blocks)>=2
              for block in blocks: json.loads(block)
              assert 'FAQPage' in text and 'Service' in text
            return text

          for p,data in local.items(): validate_html(p,data)

          ftp=ftplib.FTP(os.environ['FTP_HOST'],timeout=50)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.cwd('public_html')
          names=set(ftp.nlst())
          stamp=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          backup='_backups/seo-bh-enrichment-'+stamp
          parts=backup.split('/')
          for d in parts:
            try: ftp.mkd(d)
            except ftplib.error_perm as e:
              if not str(e).startswith('550'): raise
            ftp.cwd(d)
          ftp.cwd('/public_html')

          originals={}
          touched=[]
          def get_remote(name):
            data=bytearray(); ftp.retrbinary('RETR '+name,data.extend); return bytes(data)
          def save_backup(name,data):
            ftp.storbinary('STOR '+backup+'/'+name.replace('/','__'),io.BytesIO(data))
          def remember(name):
            if name in originals:return
            try: originals[name]=get_remote(name); save_backup(name,originals[name])
            except ftplib.error_perm: originals[name]=None

          try:
            for p in pages:
              remember(p)
              ftp.storbinary('STOR '+p,io.BytesIO(local[p]))
              assert get_remote(p)==local[p]
              touched.append(p)

            # Descobrir em quais XMLs cada URL ja aparece, sem duplicar entre sitemaps.
            xmls=[]
            for name in names:
              if name.lower().endswith('.xml'):
                try:
                  data=get_remote(name)
                  ET.fromstring(data)
                  xmls.append((name,data))
                except Exception:
                  pass
            locations={p:[] for p in monitored}
            for name,data in xmls:
              text=data.decode('utf-8','ignore')
              for p in monitored:
                if base+p in text: locations[p].append(name)
            print('SITEMAP_LOCATIONS',json.dumps(locations,ensure_ascii=False,sort_keys=True),flush=True)

            missing=[p for p in monitored if not locations[p]]
            sm='sitemap-bh.xml'
            if missing:
              remember(sm)
              existing=[]
              if originals[sm]:
                root=ET.fromstring(originals[sm])
                existing=[e.text for e in root.findall('.//{*}loc') if e.text]
              urls=[]
              for u in existing+[base+p for p in missing]:
                if u not in urls: urls.append(u)
              body='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              for u in urls:
                body+='  <url><loc>'+u+'</loc><lastmod>2026-10-16</lastmod></url>\n'
              body+='</urlset>\n'
              smdata=body.encode('utf-8')
              ET.fromstring(smdata)
              ftp.storbinary('STOR '+sm,io.BytesIO(smdata)); touched.append(sm)
              remember('robots.txt')
              robots=(originals['robots.txt'] or b'User-agent: *\nAllow: /\n').decode('utf-8','ignore').rstrip()+'\n'
              line='Sitemap: '+base+sm
              if line.lower() not in robots.lower(): robots+=line+'\n'
              ftp.storbinary('STOR robots.txt',io.BytesIO(robots.encode('utf-8'))); touched.append('robots.txt')
              for p in missing: locations[p].append(sm)

            ftp.quit()

            # Confirmar publicacao real, indexabilidade, mobile basico, canonical e links internos.
            public={}
            for p in monitored:
              req=urllib.request.Request(base+p,headers={'User-Agent':'ArquindexSEO/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                data=r.read(); assert r.status==200
              text=data.decode('utf-8')
              if p in pages:
                text=validate_html(p,data,deep=True)
                assert '<title>' in text and '</title>' in text
              else:
                checks={
                  'viewport':'<meta name="viewport"' in text,
                  'canonical':base+p in text and 'canonical' in text.lower(),
                  'h1':text.lower().count('<h1')>=1,
                  'indexable':'noindex' not in text.lower(),
                  'whatsapp':'5531973632725' in text or '31973632725' in text
                }
                print('EXISTING_PAGE_CHECKS',p,json.dumps(checks,sort_keys=True),flush=True)
                assert checks['canonical'] and checks['indexable']
              public[p]=text
              print('PUBLIC_VERIFIED',base+p,'HTTP 200','BYTES',len(data),flush=True)

            internal=set()
            for p in pages:
              internal.update(x for x in re.findall(r'href="(/[^"]+)"',public[p]) if not x.startswith('//'))
            for path in sorted(internal):
              req=urllib.request.Request(base.rstrip('/')+path,headers={'User-Agent':'ArquindexSEO/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: assert r.status==200
            print('INTERNAL_LINKS_OK',len(internal),flush=True)

            for p,sms in locations.items():
              assert sms, 'URL sem sitemap: '+p
            if any('sitemap-bh.xml' in x for x in locations.values()):
              with urllib.request.urlopen(base+'sitemap-bh.xml',timeout=30) as r:
                ET.fromstring(r.read()); assert r.status==200
              with urllib.request.urlopen(base+'robots.txt',timeout=30) as r:
                assert base+'sitemap-bh.xml' in r.read().decode('utf-8','ignore')
            print('BACKUP',backup,flush=True)
            print('DEPLOY_OK',json.dumps([base+p for p in pages],ensure_ascii=False),flush=True)
          except Exception:
            try:
              try: ftp.quit()
              except Exception: pass
              rb=ftplib.FTP(os.environ['FTP_HOST'],timeout=50)
              rb.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD']); rb.cwd('public_html')
              for name,data in originals.items():
                if data is None:
                  try: rb.delete(name)
                  except Exception: pass
                else: rb.storbinary('STOR '+name,io.BytesIO(data))
              rb.quit(); print('ROLLBACK_OK',flush=True)
            except Exception as e: print('ROLLBACK_ERROR',type(e).__name__,flush=True)
            raise
          PY

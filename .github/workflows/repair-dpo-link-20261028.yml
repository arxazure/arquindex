name: Repair DPO long link
on:
  push:
    branches: [master]
    paths: [.github/workflows/repair-dpo-link-20261028.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repair-dpo-link-20261028.py
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      - run: npm install playwright
      - run: node scripts/qa-repaired-pages-20261028.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mobile-qa
          path: |
            qa-report/
            repair-report/

name: Identidade e atendimento único ARQ-007 a ARQ-009

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/identidade-atendimento-arq007-arq009.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Instalar parser HTML
        run: pip install beautifulsoup4
      - name: Aplicar identidade oficial somente na ARQ-008
        env:
          DESIGN_TARGET: https://faz-consultoria-adequacao-lgpd.arquindex.com.br/como-escolher.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial somente na ARQ-009
        env:
          DESIGN_TARGET: https://servicos-consultoria-adequacao-lgpd-oferece-pequenas.arquindex.com.br/diagnostico-completo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Remover widgets antigos e publicar um atendimento por página
        env:
          ATENDIMENTO_TARGETS: https://consultoria-adequacao-lgpd-pequenas-empresas.arquindex.com.br/,https://faz-consultoria-adequacao-lgpd.arquindex.com.br/como-escolher.html,https://servicos-consultoria-adequacao-lgpd-oferece-pequenas.arquindex.com.br/diagnostico-completo.html
        run: python scripts/aplicar-atendimento-unico.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identidade-atendimento-arq007-arq009
          path: design-report/

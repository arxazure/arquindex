name: Melhorar ARQ-036 ARQ-038 ARQ-039 2026-10-20 tarde
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261020-tarde.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Aplicar identidade oficial ARQ-036
        env:
          DESIGN_TARGET: https://conarq-juridico-nova-lima.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-038
        env:
          DESIGN_TARGET: https://ged.arquindex.com.br/bh.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-039
        env:
          DESIGN_TARGET: https://ocr-prontuarios-contagem.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteudo AEO canonicals e atendimento
        run: python scripts/rodada-seo-20261020-tarde.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-rodada-seo-20261020-tarde
          path: design-report/

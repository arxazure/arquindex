name: Publicar conteudos tecnicos BH e WhatsApp
on:
  push:
    paths:
      - '.github/workflows/publicar-conteudos-bh-whatsapp.yml'
      - 'seo-bh/alfresco-belo-horizonte.html'
      - 'seo-bh/gestao-documental-belo-horizonte.html'
      - 'seo-bh/consultoria-lgpd-belo-horizonte.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-bh-conteudos-arquindex
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enviar com backup e verificar FTP
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USER: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib,io,os,pathlib,datetime,hashlib
          assert os.getenv('FTP_PASSWORD'), 'Secret FTP_PASSWORD ausente'
          files=['alfresco-belo-horizonte.html','gestao-documental-belo-horizonte.html','consultoria-lgpd-belo-horizonte.html']
          ftp=ftplib.FTP(os.environ['FTP_HOST'],timeout=40)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          try:
            ftp.cwd('public_html')
          except ftplib.error_perm:
            # Some FTP accounts are chrooted directly to public_html.
            listing=ftp.nlst()
            assert 'index.html' in listing or 'robots.txt' in listing, 'Raiz publica nao confirmada: abortando'
          print('FTP_PATH',ftp.pwd())
          stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          for name in files:
            source=pathlib.Path('seo-bh')/name
            data=source.read_bytes()
            assert b'wa.me/5531973632725' in data and b'arq-atualizacoes-fontes-20261018' in data
            previous=bytearray()
            try:
              ftp.retrbinary('RETR '+name,previous.extend)
            except ftplib.error_perm as exc:
              if not str(exc).startswith('550'):raise
            if previous:
              backup=name+'.backup-'+stamp
              ftp.storbinary('STOR '+backup,io.BytesIO(previous))
              check=bytearray();ftp.retrbinary('RETR '+backup,check.extend)
              assert check==previous,'Backup verification failed'
            ftp.storbinary('STOR '+name,io.BytesIO(data))
            check=bytearray();ftp.retrbinary('RETR '+name,check.extend)
            assert hashlib.sha256(check).digest()==hashlib.sha256(data).digest(), 'Upload checksum mismatch'
            print('FTP_VERIFIED',name,len(data))
          ftp.quit()
          PY
      - name: Testar paginas publicas
        run: |
          python - <<'PY'
          import urllib.request
          for name in ['alfresco-belo-horizonte.html','gestao-documental-belo-horizonte.html','consultoria-lgpd-belo-horizonte.html']:
            url='https://www.arquindex.com.br/'+name
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ArquindexDeployVerify/1.0','Cache-Control':'no-cache'}),timeout=35) as response:
              body=response.read()
              assert response.status==200 and b'arq-atualizacoes-fontes-20261018' in body and b'wa.me/5531973632725' in body,(url,response.status)
              print('HTTP_VERIFIED',url,response.status)
          PY

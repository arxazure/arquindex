name: Confirmar DNS e configuracao dos 56 hosts
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/diagnose_56_config.py'
      - '.github/workflows/diagnosticar-56-config.yml'
permissions:
  contents: read
  issues: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests dnspython
      - name: Consultar DNS independentes e API somente leitura
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/diagnose_56_config.py
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-configuracao-56
          path: audit-56-config/
      - name: Registrar na issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body-file audit-56-config/report.md

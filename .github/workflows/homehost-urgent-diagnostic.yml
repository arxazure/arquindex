name: HomeHost urgent recovery diagnostic
on:
  push:
    branches: [fix/homehost-urgent-recovery-20261030]
    paths: ['.github/workflows/homehost-urgent-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check connectivity and FTPS by IP without copying site content
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import urllib.request, json, ftplib, ssl, os, hashlib
          urls = {
            'replit_source':'https://9b2f2218-e332-4fb3-9838-ad65ee778b21-00-33klwqeoppbz6.reed.replit.dev/website/',
            'homehost_ip_preview':'http://177.234.150.42/~arquind2/',
            'homehost_domain':'https://www.arquindex.com.br/',
            'dns_www':'https://dns.google/resolve?name=www.arquindex.com.br&type=A',
            'dns_domain':'https://dns.google/resolve?name=arquindex.com.br&type=NS'
          }
          for label,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Arquindex-Recovery/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read(4000000)
                      print(label,'HTTP',r.status,'BYTES',len(data))
                  html=data.decode('utf-8','replace')
                  if label.startswith('dns_'):
                      result=json.loads(html)
                      print('DNS_STATUS',result.get('Status'),'DNS_ANSWER',result.get('Answer',[]))
                  else: print('UNAVAILABLE','Site Unavailable' in html or 'repl is currently not running' in html.lower())
              except Exception as e: print(label,'ERROR',type(e).__name__,str(e)[:250])
          password=os.environ.get('FTP_PASSWORD')
          if not password: print('FTPS_SECRET_MISSING')
          else:
              try:
                  ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
                  ftp.connect('177.234.150.42',21)
                  ftp.host='h59.servidorhh.com'
                  ftp.login('arquind2',password)
                  ftp.prot_p()
                  print('FTPS_IP_LOGIN_OK_CERTIFICATE_VERIFIED')
                  for root in ['/public_html','/home/arquind2/public_html']:
                      try:
                          ftp.cwd(root)
                          names={p.rsplit('/',1)[-1] for p in ftp.nlst()}
                          print('PUBLIC_ROOT_FOUND','INDEX_FILES',[p for p in ['index.html','index.php','index.htm'] if p in names])
                          break
                      except ftplib.error_perm: continue
                  ftp.quit()
              except Exception as e: print('FTPS_IP_ERROR',type(e).__name__,str(e)[:200].replace(password,'[REDACTED]'))
          PY

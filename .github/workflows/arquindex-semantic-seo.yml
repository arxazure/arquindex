name: Arquindex Semantic SEO Audit
on:
  pull_request:
    paths:
      - "seo-semantico/**"
      - ".github/workflows/arquindex-semantic-seo.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 10 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        run: PYTHONPATH=seo-semantico python -m unittest discover -s seo-semantico/tests -v
      - name: Compile Python modules
        run: python -m compileall -q seo-semantico
      - name: Audit approved URLs (read-only)
        if: github.event_name != 'pull_request'
        run: python seo-semantico/audit.py --sites seo-semantico/sites.txt --output seo-audit.json --workers 2
      - name: Create Markdown report
        if: github.event_name != 'pull_request'
        run: python seo-semantico/report.py seo-audit.json seo-report.md
      - name: Summarize semantic audit health
        if: github.event_name != 'pull_request'
        run: python seo-semantico/daily_health.py --input seo-audit.json --output seo-health.json --markdown seo-health.md --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: arquindex-semantic-seo-audit
          path: |
            seo-audit.json
            seo-report.md
            seo-health.json
            seo-health.md
          if-no-files-found: ignore
          retention-days: 30

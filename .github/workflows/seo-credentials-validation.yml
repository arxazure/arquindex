name: SEO credential validation - single authorized run
on:
  push:
    branches: [ops/seo-credentials-validation-20261104]
    paths: [.github/workflows/seo-credentials-validation.yml]
permissions:
  contents: read
concurrency:
  group: seo-credentials-validation-20261104
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openai
      - name: Offline GSC tests
        run: python -m unittest discover -s tests -p test_collect_gsc.py -v
      - name: Offline Wix tests
        run: python -m unittest discover -s tests -p test_wix_semantic_seo.py -v
  wix:
    needs: tests
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wix-semantic-seo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openai
      - name: One Google search, one OpenAI generation and at most one Wix draft
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX_ID: ${{ secrets.GOOGLE_CX_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_CREATE_DRAFT: 'true'
        run: python scripts/wix_semantic_seo.py
      - name: Upload Wix evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-validation-${{ github.run_id }}
          path: artifacts/semantic-seo/
          retention-days: 30
          if-no-files-found: error
  gsc:
    needs: tests
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gsc-direct-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One real GSC collection without commit or publication
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python painel-seo/collect_gsc.py
      - name: Upload GSC evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-validation-${{ github.run_id }}
          path: |
            artifacts/gsc/status.json
            painel-seo/gsc-real.json
          retention-days: 30
          if-no-files-found: error

name: Enable IndexNow 12
on:
  push:
    branches: [master]
    paths: [.github/workflows/enable-indexnow-12-20261028.yml]
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/install-indexnow-keys-12-20261028.py
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      - run: python scripts/submit-repaired-12-20261028.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-12-confirmations
          path: indexnow-report/

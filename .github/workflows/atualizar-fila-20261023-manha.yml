name: Atualizar fila ARQ-083 a ARQ-088 2026-10-23
on:
  push:
    branches: [master]
    paths: ['.github/workflows/atualizar-fila-20261023-manha.yml']
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar cursor e registros
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('seo/fila-seo-geo-aeo.csv')
          lines=p.read_text('utf-8').splitlines()
          lines=[x for x in lines if not x.startswith(tuple(f'ARQ-{n:03d};' for n in range(83,89))) and not x.startswith('CURSOR;')]
          block='''ARQ-083;https://aplicativos-facilitam-digitalizacao-documentos-pelo-celular.arquindex.com.br/;digitalização de documentos pelo celular;digitalização e OCR;;Diferenciar da ARQ-054 antes de publicar; corrigir overflow somente junto de tarefa editorial própria;2026-10-23;;;;auditoria GitHub;;;"HTTP 200 e canonical próprio; conteúdo extenso, mas título/H1 restritos a BH, identidade/AEO/CTA ausentes e overflow móvel; preservada por sobreposição com ARQ-054"
          ARQ-084;https://comoadequaralgpd.arquindex.com.br/;consultoria de adequação LGPD;LGPD e DPO;;Definir papel de apoio frente à ARQ-075 e pilar LGPD antes de alterar;2026-10-23;;;;auditoria GitHub;;;"HTTP 200 e canonical próprio; conteúdo extenso, identidade/AEO/CTA ausentes; preservada por grupo de 15 URLs e sobreposição"
          ARQ-085;https://consultoria-conarq-mg.arquindex.com.br/;consultoria CONARQ em Minas Gerais;gestão documental;Minas Gerais;Confirmar atendimento estadual e diferenciar da principal digitalizar-arquivos-mg antes de promover;2026-10-23;;;;auditoria GitHub;;;"HTTP 200 e canonical próprio; título/H1 citam BH, identidade/AEO/CTA ausentes; preservada por falta de comprovação regional"
          ARQ-086;https://databook-petrobras-elaboracao.arquindex.com.br/;montagem e conferência de databook;databooks e engenharia;;Medir consulta+URL em janelas completas; não repetir divulgação sem material novo;2026-10-23;2026-10-23;2026-10-23;GitHub+FTP+Instagram+LinkedIn+GoogleBusiness;sha256:5a9bdf1ca5671c5dc548223cbf6755259afeb5ca43aad2eb23758adf044e589b;https://github.com/arxazure/arquindex/actions/runs/39947610227 | https://github.com/arxazure/arquindex/actions/runs/39948095478 | Instagram 17994200952019291 | LinkedIn urn:li:share:7519363317245558784 | GBP 2934846749896264639 PROCESSING;"publicada e verificada mobile/desktop: canonical próprio, título/H1 distintos, identidade, atendimento, matriz AEO, ressalva de não afiliação, CTA UTM, sitemap e arte"
          ARQ-087;https://decreto10278-nova-lima.arquindex.com.br/custo.html;orçamento de digitalização em Nova Lima;digitalização;Nova Lima;Medir consulta+URL; divulgar em rotação futura com arte já verificada;2026-10-23;2026-10-23;;GitHub+FTP;sha256:a214f62048ef4d367c0e53ec04fe0e86a0891260d420c99c3d075820c32c293f;https://github.com/arxazure/arquindex/actions/runs/39947610227 | https://github.com/arxazure/arquindex/actions/runs/39948095478;"publicada e verificada mobile/desktop: canonical próprio, title/H1, identidade, atendimento, tabela de custos sem preço inventado, limites de logística/validade, CTA, sitemap e arte"
          ARQ-088;https://encontrar-consultoria-conformidade-lgpd-bom-custo-beneficio.arquindex.com.br/comparativo.html;preço da consultoria LGPD;LGPD e DPO;;Medir consulta+URL; divulgar em rotação futura com arte já verificada;2026-10-23;2026-10-23;;GitHub+FTP;sha256:f5af7169027f70e303ad4a43a428ef33e883ab9a3ce4a5b11d5d9d5e2a204b27;https://github.com/arxazure/arquindex/actions/runs/39947610227 | https://github.com/arxazure/arquindex/actions/runs/39948095478;"publicada e verificada mobile/desktop: canonical próprio, title/H1, identidade, atendimento, comparação por escopo/entregáveis, CTA, sitemap e arte"'''.splitlines()
          lines.extend(x.strip() for x in block)
          lines.append('CURSOR;ARQ-089;;;;Auditar ARQ-089 a ARQ-094 e preservar páginas já divulgadas;2026-10-23;;;fila;;;;pendente')
          p.write_text('\n'.join(lines)+'\n','utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/fila-seo-geo-aeo.csv
          git commit -m "atualizar fila para ARQ-089"
          git push

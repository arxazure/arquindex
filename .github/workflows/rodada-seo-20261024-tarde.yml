name: Melhorar ARQ-107 ARQ-110 ARQ-111 2026-10-24 tarde
on:
  push:
    paths:
      - '.github/workflows/rodada-seo-20261024-tarde.yml'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pillow
      - name: Padronizar identidade ARQ-107
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DESIGN_TARGET: https://consultoria-ocr-vantagens.arquindex.com.br/empresas.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Padronizar identidade ARQ-110
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DESIGN_TARGET: https://empresas-adequacao-lgpd-paulo.arquindex.com.br/diagnostico.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Padronizar identidade ARQ-111
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DESIGN_TARGET: https://gestao-de-arquivos-fisicos.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteúdo, sitemaps e artes
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/rodada-seo-20261024-tarde.py

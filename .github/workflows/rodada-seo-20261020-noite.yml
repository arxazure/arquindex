name: Melhorar ARQ-043 ARQ-044 ARQ-045 2026-10-20 noite
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261020-noite.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Identidade ARQ-043
        env:
          DESIGN_TARGET: https://www.arquindex.com.br/alfresco-belo-horizonte.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-044
        env:
          DESIGN_TARGET: https://www.arquindex.com.br/gestao-documental-belo-horizonte.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-045
        env:
          DESIGN_TARGET: https://www.arquindex.com.br/consultoria-lgpd-belo-horizonte.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar AEO e atendimento
        run: python scripts/rodada-seo-20261020-noite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-rodada-seo-20261020-noite
          path: design-report/

# rerun apos suporte ao dominio principal

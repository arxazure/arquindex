name: Otimizar DPO as a Service
on:
  push:
    paths:
      - '.github/workflows/seo-dpo-service-20261015.yml'
permissions:
  contents: read
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Backup, melhorar pagina DPO e validar
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import ftplib,os,io,re,ssl,json,time,urllib.request,urllib.error
          from datetime import datetime,timezone
          path="dpo-as-a-service-consultoria-lgpd.html"
          url="https://www.arquindex.com.br/"+path
          title="DPO as a Service e DPO Terceirizado | Arquindex"
          desc="DPO terceirizado para apoiar governança LGPD, titulares, fornecedores, incidentes, registros e orientação às áreas. Planos a partir de R$ 399/mês."
          marker="ARQUINDEX-DPO-SERVICE-20261015"
          block='''<!-- ARQUINDEX-DPO-SERVICE-20261015 -->
          <section id="dpo-as-a-service-arquindex" style="max-width:1120px;margin:2rem auto;padding:1.6rem;border:1px solid #dce7ea;border-radius:14px;background:#f7fbfc">
          <h2>DPO as a Service: privacidade integrada à rotina</h2>
          <p>O DPO terceirizado da Arquindex apoia a organização da governança de dados pessoais, o canal com titulares e a orientação das áreas internas. O trabalho é dimensionado conforme porte, risco, volume de operações, sistemas, fornecedores e maturidade da empresa.</p>
          <h3>Rotina que pode compor o serviço</h3>
          <ul><li>levantamento inicial, prioridades e plano de acompanhamento;</li><li>orientação para solicitações de titulares e registro das respostas;</li><li>apoio na revisão de operações, fornecedores, políticas e evidências;</li><li>orientação inicial em incidentes e articulação com jurídico, TI, RH e gestão;</li><li>reuniões periódicas e registro de pendências conforme o plano contratado.</li></ul>
          <p><strong>Importante:</strong> o DPO não substitui jurídico, TI ou decisões da administração e não representa garantia automática de conformidade. Ele coordena, orienta e acompanha dentro do escopo acordado.</p>
          <h3>Como começa</h3><ol><li>Reunião de diagnóstico e identificação das operações prioritárias.</li><li>Definição de responsabilidades, canais, frequência e entregáveis.</li><li>Plano inicial com riscos, lacunas, responsáveis e prazos.</li><li>Acompanhamento mensal com evidências e revisão de prioridades.</li></ol>
          <p>Planos mensais a partir de <strong>R$ 399,00</strong>, sujeitos ao porte, risco e escopo. A proposta informa limites, atividades incluídas e responsabilidades.</p>
          <p><a href="https://wa.me/5531973632725?text=Quero%20avaliar%20DPO%20as%20a%20Service%20para%20minha%20empresa" rel="noopener">Solicitar avaliação pelo WhatsApp +55 31 97363-2725</a></p>
          <p>Conteúdos relacionados: <a href="lgpd-consultoria.html">consultoria de adequação LGPD</a> · <a href="seguranca-da-informacao.html">segurança da informação</a> · <a href="gestao-documental.html">gestão documental</a>.</p>
          <h3>Perguntas frequentes</h3>
          <details><summary>O que faz um DPO terceirizado?</summary><p>Ele atua como ponto de contato e apoia a governança de privacidade, orientando áreas, acompanhando solicitações, registros, fornecedores, incidentes e prioridades conforme o escopo contratado.</p></details>
          <details><summary>DPO as a Service substitui consultoria de adequação?</summary><p>Não necessariamente. A adequação pode ser um projeto com diagnóstico e implantação; o DPO as a Service tende a acompanhar a rotina e a manutenção da governança. Os serviços podem ser combinados.</p></details>
          <details><summary>Toda empresa precisa do mesmo plano?</summary><p>Não. O formato depende do porte, do risco, da natureza e do volume do tratamento, das regras aplicáveis e da estrutura interna. A proposta deve refletir o caso concreto.</p></details>
          </section>
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"O que faz um DPO terceirizado?","acceptedAnswer":{"@type":"Answer","text":"Atua como ponto de contato e apoia a governança de privacidade, orientando áreas e acompanhando solicitações, registros, fornecedores, incidentes e prioridades conforme o escopo."}},{"@type":"Question","name":"DPO as a Service substitui consultoria de adequação?","acceptedAnswer":{"@type":"Answer","text":"Não necessariamente. A adequação pode ser um projeto de diagnóstico e implantação; o DPO as a Service acompanha a rotina e a manutenção da governança."}},{"@type":"Question","name":"Toda empresa precisa do mesmo plano?","acceptedAnswer":{"@type":"Answer","text":"Não. O formato depende do porte, do risco, das operações, das regras aplicáveis e da estrutura interna."}}]}</script>
          <!-- /ARQUINDEX-DPO-SERVICE-20261015 -->'''
          f=ftplib.FTP(timeout=30);f.connect(os.environ["FTP_HOST"],21);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]);f.cwd("public_html")
          raw=bytearray();f.retrbinary("RETR "+path,raw.extend);raw=bytes(raw)
          try: text=raw.decode("utf-8"); encoding="utf-8"
          except UnicodeDecodeError:text=raw.decode("latin-1");encoding="latin-1"
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ");backup="_backups/dpo-service-"+stamp
          try:f.mkd(backup)
          except ftplib.error_perm:pass
          f.storbinary("STOR "+backup+"/"+path,io.BytesIO(raw))
          changed=False
          if marker not in text:
            text=re.sub(r"<title\b[^>]*>.*?</title\s*>","<title>"+title+"</title>",text,count=1,flags=re.I|re.S)
            md='<meta name="description" content="'+desc+'">'
            if re.search(r"<meta\b[^>]*name\s*=\s*['\"]description['\"][^>]*>",text,re.I):text=re.sub(r"<meta\b[^>]*name\s*=\s*['\"]description['\"][^>]*>",md,text,count=1,flags=re.I)
            else:text=re.sub(r"</head\s*>",md+"\n</head>",text,count=1,flags=re.I)
            if not re.search(r"<link\b[^>]*rel\s*=\s*['\"][^'\"]*canonical",text,re.I):text=re.sub(r"</head\s*>",'<link rel="canonical" href="'+url+'">\n</head>',text,count=1,flags=re.I)
            if re.search(r"</main\s*>",text,re.I):text=re.sub(r"</main\s*>",block+"\n</main>",text,count=1,flags=re.I)
            elif re.search(r"</body\s*>",text,re.I):text=re.sub(r"</body\s*>",block+"\n</body>",text,count=1,flags=re.I)
            else:text+=block
            f.storbinary("STOR "+path,io.BytesIO(text.encode(encoding)));changed=True
          f.quit();time.sleep(4)
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; ArquindexVerify/1.0)"})
          try:
            with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:body=r.read(4000000).decode("utf-8",errors="replace");status=r.status
          except Exception as e: raise SystemExit("Falha HTTP apos publicacao: "+type(e).__name__)
          checks={"status_200":status==200,"marker":marker in body,"title":title in body,"canonical":url in body,"no_noindex":"noindex" not in body.lower(),"whatsapp":"5531973632725" in body,"price":"R$ 399,00" in body}
          print("PUBLISHED",url,"changed",changed,flush=True);print("BACKUP",backup,flush=True);print("VERIFY",json.dumps(checks,ensure_ascii=False),flush=True)
          if not all(checks.values()):raise SystemExit("Validacao incompleta")
          key=os.environ.get("INDEXNOW_KEY","").strip()
          if key:
            payload=json.dumps({"host":"www.arquindex.com.br","key":key,"keyLocation":"https://www.arquindex.com.br/"+key+".txt","urlList":[url]}).encode()
            req=urllib.request.Request("https://api.indexnow.org/indexnow",data=payload,headers={"Content-Type":"application/json"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=30) as r:print("INDEXNOW_STATUS",r.status,flush=True)
            except urllib.error.HTTPError as e:print("INDEXNOW_HTTP_ERROR",e.code,flush=True)
          else:print("INDEXNOW_SKIPPED key_ausente",flush=True)
          PY

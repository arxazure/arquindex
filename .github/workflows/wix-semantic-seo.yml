name: Wix Arquindex Semantic SEO

'on':
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests openai

      - name: Research and optional Wix draft
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX_ID: ${{ secrets.GOOGLE_CX_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_CREATE_DRAFT: ${{ vars.WIX_CREATE_DRAFT || 'false' }}
        run: python scripts/wix_semantic_seo.py

      - name: Upload diagnostic and draft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-semantic-seo-research
          path: artifacts/semantic-seo/
          if-no-files-found: warn
          retention-days: 30

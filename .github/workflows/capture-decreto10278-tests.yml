name: Capture Decreto 10278 tests
on:
  pull_request:
    paths:
      - 'capture-pro/**'
      - '.github/workflows/capture-decreto10278-tests.yml'
  push:
    paths:
      - 'capture-pro/**'
      - '.github/workflows/capture-decreto10278-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test capture-pro/decreto10278.test.js

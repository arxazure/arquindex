name: Verificar robots Arquindex
on:
  push:
    paths: ['.github/workflows/robots-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Ler robots e cabecalhos publicos
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib,os,urllib.request,json
          ftp=ftplib.FTP('ftp.arquindex.com.br',timeout=25)
          ftp.login('arquind2',os.environ['FTP_PASSWORD']);ftp.cwd('public_html')
          b=bytearray();ftp.retrbinary('RETR robots.txt',b.extend);ftp.quit()
          print('ROBOTS_CONTENT',json.dumps(b.decode('utf-8','replace'),ensure_ascii=False))
          for host in ['https://www.arquindex.com.br','https://arquindex.com.br']:
              for path in ['/robots.txt','/','/sitemap.xml']:
                  u=host+path
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Googlebot'}),timeout=20) as r:
                          print('HTTP_CHECK',json.dumps({'url':u,'status':r.status,'final':r.url,'x_robots_tag':r.headers.get('X-Robots-Tag'),'type':r.headers.get('Content-Type')}))
                  except Exception as e: print('HTTP_CHECK',json.dumps({'url':u,'error':type(e).__name__}))
          import urllib.robotparser,xml.etree.ElementTree as ET,collections
          rp=urllib.robotparser.RobotFileParser();rp.parse(b.decode('utf-8').splitlines())
          base='https://www.arquindex.com.br'
          queue=collections.deque([base+'/sitemap.xml',base+'/gestao-documental/sitemap.xml'])
          seen=set();urls=set();failures=[]
          while queue and len(seen)<30:
              u=queue.popleft()
              if u in seen:continue
              seen.add(u)
              if not rp.can_fetch('Googlebot',u):failures.append({'url':u,'error':'sitemap_blocked'});continue
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Googlebot'}),timeout=20) as response:root=ET.fromstring(response.read(10000000))
                  locs=[(n.text or '').strip() for n in root.iter() if n.tag.split('}')[-1]=='loc']
                  if root.tag.split('}')[-1]=='sitemapindex':queue.extend(locs)
                  elif root.tag.split('}')[-1]=='urlset':urls.update(locs)
                  else:failures.append({'url':u,'error':'invalid_xml_root'})
              except Exception as e:failures.append({'url':u,'error':type(e).__name__})
          blocked=[]
          for u in sorted(urls):
              bots=[bot for bot in ['Googlebot','Bingbot','OAI-SearchBot','ChatGPT-User'] if not rp.can_fetch(bot,u)]
              if bots:blocked.append({'url':u,'bots':bots})
          print('ROBOTS_AUDIT',json.dumps({'maps_checked':len(seen),'sitemap_urls_checked':len(urls),'blocked':blocked,'errors':failures,'pending_maps':len(queue)},ensure_ascii=False))
          if blocked or failures or queue:raise RuntimeError('Rastreamento exige revisao')
          PY

name: Melhorar ARQ-028 ARQ-031 ARQ-033 2026-10-20 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261020-manha.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Aplicar identidade oficial ARQ-028
        env:
          DESIGN_TARGET: https://instalacao-lgpd-sp.arquindex.com.br/empresas.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-031
        env:
          DESIGN_TARGET: https://software-reconhecimento-texto-documentos-digitalizados.arquindex.com.br/guia-completo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-033
        env:
          DESIGN_TARGET: https://digitalizar-arquivos-bh.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Consolidar atendimento unico
        env:
          ATENDIMENTO_TARGETS: https://instalacao-lgpd-sp.arquindex.com.br/empresas.html,https://software-reconhecimento-texto-documentos-digitalizados.arquindex.com.br/guia-completo.html
        run: python scripts/aplicar-atendimento-unico.py
      - name: Publicar conteudo AEO e canonicals
        run: python scripts/rodada-seo-20261020-manha.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-rodada-seo-20261020-manha
          path: design-report/

name: Publicar oportunidades Top10 2026-10-19
on:
  push:
    branches: [master]
    paths:
      - 'seo/top10-oportunidades-20261019/**'
      - 'scripts/publish-top10-opportunities.py'
      - '.github/workflows/publicar-top10-oportunidades-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Validar guia e sintaxe antes de acessar hospedagem
        run: |
          python -m py_compile scripts/publish-top10-opportunities.py
          python scripts/publish-top10-opportunities.py --check
      - name: Publicar guia e fortalecer tres paginas com backup e rollback
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publish-top10-opportunities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top10-oportunidades-publicacao
          path: publish-report/

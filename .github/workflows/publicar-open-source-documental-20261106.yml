name: Publicar biblioteca open-source documental na HomeHost
on:
  push:
    branches: [publish/docs-open-source-20261106]
    paths:
      - publicacoes/open-source-documental-20261106/**
      - scripts/publicar-open-source-documental-20261106.py
      - .github/workflows/publicar-open-source-documental-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar a colecao antes de acessar a hospedagem
        run: python scripts/publicar-open-source-documental-20261106.py --check
      - name: Publicar na origem HomeHost com backup e verificacao publica
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publicar-open-source-documental-20261106.py
      - name: Preservar backups e comprovante de publicacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homehost-open-source-documental-20261106
          path: publish-report/open-source-documental-20261106/
          retention-days: 90
          if-no-files-found: warn

name: Melhorar ARQ-102 ARQ-104 ARQ-106 2026-10-24 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261024-manha.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pillow
      - name: Identidade ARQ-102
        env:
          DESIGN_TARGET: https://gestao-eletronica-de-documentos-ged.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-104
        env:
          DESIGN_TARGET: https://arquivamento.arquindex.com.br/o-que-e.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-106
        env:
          DESIGN_TARGET: https://empresas-digitalizacao-documental-brasil-grandes-empresas.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteúdo, sitemaps e artes
        run: python scripts/rodada-seo-20261024-manha.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-seo-20261024-manha
          path: design-report/

name: Checar sitemaps ARQ-070 ARQ-073 ARQ-075 2026-10-22
on:
  push:
    branches: [master]
    paths: ['.github/workflows/checar-sitemaps-seo-20261022-tarde.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar robots e sitemaps públicos
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,time
          targets=[
          ('ARQ-070','https://ocr-maua.arquindex.com.br/'),
          ('ARQ-073','https://mapeamento-educacao.arquindex.com.br/'),
          ('ARQ-075','https://digitalizar-lgpd-solucao.arquindex.com.br/empresas.html')]
          for i,u in targets:
              root=u.split('/',3)[:3]; base='/'.join(root)+'/'
              robots=urllib.request.urlopen(base+'robots.txt',timeout=25).read().decode('utf-8','replace')
              sms=[x.split(':',1)[1].strip() for x in robots.splitlines() if x.lower().startswith('sitemap:')]
              if not sms:sms=[base+'sitemap.xml']
              found=[]
              for sm in sms:
                  try:
                      req=urllib.request.Request(sm,headers={'User-Agent':'ArquindexSEO/1.0','Cache-Control':'no-cache'});data=urllib.request.urlopen(req,timeout=30).read()
                      tree=ET.fromstring(data)
                      locs=[e.text.strip() for e in tree.iter() if e.tag.endswith('loc') and e.text]
                      hit=u in locs
                      found.append((sm,len(locs),hit))
                  except Exception as e:found.append((sm,'ERROR '+repr(e),False))
              print('SITEMAP_CHECK',i,u,found)
          PY

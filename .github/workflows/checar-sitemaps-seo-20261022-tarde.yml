name: Checar sitemaps ARQ-070 ARQ-073 ARQ-075 2026-10-22
on:
  push:
    branches: [master]
    paths: ['.github/workflows/checar-sitemaps-seo-20261022-tarde.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar robots e sitemaps públicos
        run: |
          python - <<'PY'
          import urllib.request,xml.etree.ElementTree as ET,time
          targets=[
          ('ARQ-070','https://ocr-maua.arquindex.com.br/'),
          ('ARQ-073','https://mapeamento-educacao.arquindex.com.br/'),
          ('ARQ-075','https://digitalizar-lgpd-solucao.arquindex.com.br/empresas.html')]
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ArquindexSEO','Accept':'text/plain,application/xml,text/xml,*/*','Cache-Control':'no-cache'})
              return urllib.request.urlopen(req,timeout=30).read()
          for ident,url in targets:
              base='/'.join(url.split('/',3)[:3])+'/'
              robots=''
              try:
                  robots=read(base+'robots.txt').decode('utf-8','replace')
              except Exception as e:
                  print('ROBOTS_UNAVAILABLE',ident,repr(e))
              sitemaps=[x.split(':',1)[1].strip() for x in robots.splitlines() if x.lower().startswith('sitemap:')]
              if not sitemaps:sitemaps=[base+'sitemap.xml']
              found=[]
              for sm in sitemaps:
                  try:
                      data=read(sm); tree=ET.fromstring(data)
                      locs=[e.text.strip() for e in tree.iter() if e.tag.endswith('loc') and e.text]
                      found.append((sm,len(locs),url in locs))
                  except Exception as e:
                      found.append((sm,'ERROR '+repr(e),False))
              print('SITEMAP_CHECK',ident,url,found)
          print('SITEMAP_CHECK_COMPLETE')
          PY

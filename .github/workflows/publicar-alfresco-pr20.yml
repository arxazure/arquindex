name: Publicar campanha Alfresco PR20
on:
  push:
    branches: [master]
    paths:
      - 'seo/alfresco-cloud-ocr-ia-*/**'
      - 'blog/alfresco-cloud-e-ocr-tco/**'
      - 'blog/ocr-inteligente-vs-busca-ecm/**'
      - 'blog/nuvem-dedicada-governanca-alfresco/**'
      - 'alfresco-cloud-ocr-ia/**'
      - 'scripts/publish-alfresco-pr20.py'
      - '.github/workflows/publicar-alfresco-pr20.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Preflight
        run: python scripts/publish-alfresco-pr20.py --check
      - name: Responsive rendering
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          export CHROME_PATH
          npm install --prefix "$RUNNER_TEMP/pr20-browser" playwright@1.61.1 --ignore-scripts --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/pr20-browser/node_modules" node scripts/qa/alfresco-campaign-browser.cjs
      - name: FTPS backup, release, public HTTP and official discovery
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/publish-alfresco-pr20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfresco-pr20-publication
          path: publish-report/

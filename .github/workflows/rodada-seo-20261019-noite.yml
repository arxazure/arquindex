name: Melhorar ARQ-022 ARQ-024 ARQ-025 2026-10-19 noite
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261019-noite.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Aplicar identidade oficial ARQ-022
        env:
          DESIGN_TARGET: https://digitalizar-arquivos-corporativo.arquindex.com.br/custo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-024
        env:
          DESIGN_TARGET: https://ecm.arquindex.com.br/custo.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Aplicar identidade oficial ARQ-025
        env:
          DESIGN_TARGET: https://empresas-adequacao-lgpd-paulo.arquindex.com.br/diagnostico.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Consolidar atendimento único
        env:
          ATENDIMENTO_TARGETS: https://digitalizar-arquivos-corporativo.arquindex.com.br/custo.html,https://ecm.arquindex.com.br/custo.html,https://empresas-adequacao-lgpd-paulo.arquindex.com.br/diagnostico.html
        run: python scripts/aplicar-atendimento-unico.py
      - name: Publicar conteúdo AEO e canonicals
        run: python scripts/rodada-seo-20261019-noite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-rodada-seo-20261019-noite
          path: design-report/

name: Publicar OCR prioritarios no HomeHost
# Publicacao solicitada em 2026-10-16: verificar FTPS e raiz documental antes do envio
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/priority_subdomains_ocr.py'
      - '.github/workflows/publicar-ocr-prioritarios.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar e validar arquivos
        run: |
          python scripts/priority_subdomains_ocr.py
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          from scripts.priority_subdomains_ocr import SITES
          sites=[pathlib.Path('seo-priority-ocr')/(slug+'.arquindex.com.br') for slug in SITES]
          assert len(sites)==9
          for s in sites:
            for name in ('index.html','robots.txt','sitemap.xml'):assert (s/name).is_file()
            ET.parse(s/'sitemap.xml')
            assert '<h1>' in (s/'index.html').read_text()
          PY
      - name: Publicar apenas em raizes confirmadas
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CPANEL_ROOT_MAP: ${{ vars.OCR_SUBDOMAIN_ROOT_MAP }}
        run: |
          python - <<'PY'
          import os,ftplib,json,pathlib,hashlib,io,time
          roots=json.loads(os.environ.get('CPANEL_ROOT_MAP') or '{}')
          base=pathlib.Path('seo-priority-ocr')
          from scripts.priority_subdomains_ocr import SITES
          sites=[base/(slug+'.arquindex.com.br') for slug in sorted(SITES)]
          pwd=os.getenv('FTP_PASSWORD')
          assert pwd,'FTP_PASSWORD secret missing'
          with ftplib.FTP_TLS(timeout=45) as ftp:
            ftp.connect('ftp.arquindex.com.br',21)
            ftp.login('arquind2',pwd)
            ftp.prot_p()
            ftp.set_pasv(True)
            initial=ftp.pwd()
            print('FTPS_AUTH_OK initial_dir=',initial,flush=True)
            for site in sites:
              candidates=[]
              if site.name in roots:
                candidates.append(roots[site.name])
              candidates.extend([
                'public_html/subdominios/'+site.name,
                'public_html/'+site.name,
                'subdominios/'+site.name,
                site.name
              ])
              found=None
              for candidate in dict.fromkeys(candidates):
                if not isinstance(candidate,str) or '..' in candidate or not candidate.strip():continue
                for full in (candidate,'/'+candidate.strip('/')):
                  try:
                    ftp.cwd(initial)
                    ftp.cwd(full)
                    files={str(x).rsplit('/',1)[-1] for x in ftp.nlst()}
                    # Only preexisting roots with a site marker may be modified
                    if ('index.html' in files or 'robots.txt' in files or 'sitemap.xml' in files):
                      found=ftp.pwd()
                      break
                  except ftplib.all_errors:
                    continue
                if found:break
              if not found:
                print('ROOT_NOT_CONFIRMED',site.name,'skipped without modifying files',flush=True)
                continue
              ftp.cwd(found)
              print('ROOT_CONFIRMED',site.name,found,flush=True)
              before=set(x.rsplit('/',1)[-1] for x in ftp.nlst())
              # Only write the required three files after preserving originals; never touch unrelated files.
              for name in ('index.html','robots.txt','sitemap.xml'):
                new=(site/name).read_bytes()
                if name in before:
                  old=bytearray();ftp.retrbinary('RETR '+name,old.extend)
                  if bytes(old)==new:continue
                  backup=name+'.backup-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
                  ftp.storbinary('STOR '+backup,io.BytesIO(old))
                ftp.storbinary('STOR '+name,io.BytesIO(new))
                got=bytearray();ftp.retrbinary('RETR '+name,got.extend)
                assert hashlib.sha256(got).digest()==hashlib.sha256(new).digest()
              print('FTP_FILES_VERIFIED',site.name)
          PY
      - name: Verificar dominios publicos
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.error
          from scripts.priority_subdomains_ocr import SITES
          for slug in sorted(SITES):
            site=pathlib.Path('seo-priority-ocr')/(slug+'.arquindex.com.br')
            host=site.name
            for item in ('','sitemap.xml','robots.txt'):
              try:
                with urllib.request.urlopen('https://'+host+'/'+item,timeout=25) as r:
                  assert r.status==200 and r.url.startswith('https://'+host+'/')
                  data=r.read()
                  assert len(data)>50
                print('PUBLIC_OK',host,item)
              except (urllib.error.URLError,AssertionError) as exc:
                print('PUBLIC_PENDING',host,item,type(exc).__name__,flush=True)
          PY

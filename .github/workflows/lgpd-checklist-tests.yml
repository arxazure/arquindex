name: LGPD Checklist - testes e exportacoes
on:
  push:
    paths:
      - 'lgpd-checklist/**'
      - '.github/workflows/lgpd-checklist-tests.yml'
  pull_request:
    paths:
      - 'lgpd-checklist/**'
      - '.github/workflows/lgpd-checklist-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lgpd-checklist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lgpd-checklist/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check export-files.js

name: Melhorar ARQ-078 ARQ-081 ARQ-082 2026-10-22 noite
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rodada-seo-20261022-noite-executora.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 pillow
      - name: Identidade ARQ-078
        env:
          DESIGN_TARGET: https://organizacao-de-arquivos-empresariais.arquindex.com.br/
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-081
        env:
          DESIGN_TARGET: https://acervos-medico-baixada-fluminense.arquindex.com.br/o-que-e.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Identidade ARQ-082
        env:
          DESIGN_TARGET: https://adequacao-exin-sp.arquindex.com.br/o-que-e.html
        run: python scripts/padronizar-identidade-arquindex.py
      - name: Publicar conteúdo, sitemaps e artes
        run: python scripts/rodada-seo-20261022-noite-executora.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-seo-20261022-noite
          path: design-report/

name: Diagnostico digitalizar.arquindex.com.br
on:
  push:
    paths:
      - '.github/workflows/diagnostico-digitalizar-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspecionar HTTP e FTP sem alterar arquivos
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib,os,re,ssl,urllib.request,urllib.error,json,html.parser
          host="https://digitalizar.arquindex.com.br"
          class H(html.parser.HTMLParser):
            def __init__(self): super().__init__();self.title=[];self.t=False;self.canon=[];self.robots=[];self.h1=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=="title":self.t=True
              if tag=="link" and "canonical" in a.get("rel","").lower():self.canon.append(a.get("href"))
              if tag=="meta" and a.get("name","").lower()=="robots":self.robots.append(a.get("content"))
            def handle_endtag(self,tag):
              if tag=="title":self.t=False
            def handle_data(self,d):
              if self.t:self.title.append(d)
          for path in ["/","/robots.txt","/sitemap.xml"]:
            u=host+path
            try:
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (compatible; ArquindexAudit/1.0)"})
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
                data=r.read(3000000); ct=r.headers.get("Content-Type"); final=r.geturl(); status=r.status
              print("HTTP",json.dumps({"url":u,"status":status,"final":final,"content_type":ct,"bytes":len(data)},ensure_ascii=False),flush=True)
              if "html" in (ct or "").lower():
                p=H();p.feed(data.decode("utf-8",errors="replace"))
                print("HTML",json.dumps({"title":" ".join(p.title).strip(),"canonical":p.canon,"robots":p.robots},ensure_ascii=False),flush=True)
              else:
                print("START",data[:500].decode("utf-8",errors="replace").replace("\n"," ")[:500],flush=True)
            except urllib.error.HTTPError as e: print("HTTP_ERROR",u,e.code,flush=True)
            except Exception as e: print("HTTP_ERROR",u,type(e).__name__,str(e)[:200],flush=True)

          f=ftplib.FTP(timeout=30);f.connect(os.environ["FTP_HOST"],21);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          start=f.pwd(); print("FTP_START",start,flush=True)
          def listdir(path):
            cur=f.pwd()
            try:
              f.cwd(path); here=f.pwd(); entries=list(f.mlsd())
              print("FTP_DIR",json.dumps({"requested":path,"resolved":here,"entries":[{"name":n,"type":x.get("type"),"size":x.get("size")} for n,x in entries if n not in (".","..")][:200]},ensure_ascii=False),flush=True)
              return here,entries
            except Exception as e:
              print("FTP_MISSING",path,type(e).__name__,flush=True);return None,[]
            finally:
              try:f.cwd(cur)
              except:pass
          roots=[start,"/","public_html","/public_html","digitalizar","/digitalizar","digitalizar.arquindex.com.br","/digitalizar.arquindex.com.br","public_html/digitalizar","public_html/digitalizar.arquindex.com.br","/home/arquind2/public_html","/home/arquind2/digitalizar.arquindex.com.br"]
          seen=set()
          for p in roots:
            if p in seen:continue
            seen.add(p);listdir(p)
          f.quit()
          print("READ_ONLY_COMPLETE",flush=True)
          PY

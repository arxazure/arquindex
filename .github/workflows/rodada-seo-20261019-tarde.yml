name: Consolidar canonical ARQ-016 ARQ-017 ARQ-021 2026-10-19
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rodada-seo-20261019-tarde.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - name: Consolidar canonical única nos três artigos
        run: python scripts/rodada-seo-20261019-tarde.py

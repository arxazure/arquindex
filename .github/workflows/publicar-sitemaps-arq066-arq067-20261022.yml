name: Publicar sitemaps ARQ-066 ARQ-067 2026-10-22
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publicar-sitemaps-arq066-arq067-20261022.yml']
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar XML com backup e rollback
        run: python scripts/atualizar-sitemaps-arq066-arq067-20261022.py

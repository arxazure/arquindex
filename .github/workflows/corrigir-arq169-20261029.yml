name: Corrigir title e canonical ARQ-169 2026-10-29
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/corrigir-arq169-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corrigir-arq169
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_USER: ${{ vars.FTP_USER || 'arquind2' }}
      FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST || 'h59.servidorhh.com' }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Corrigir com backup e rollback
        run: python seo-rotinas/corrigir-arq169-20261029.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - name: Validar mobile e desktop
        run: |
          node <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});const url='https://decreto10278-educacao.arquindex.com.br/custo.html';for(const [d,w,h] of [['mobile',390,844],['desktop',1440,900]]){const p=await b.newPage({viewport:{width:w,height:h}});const r=await p.goto(url+'?postcheck=20261029tarde',{waitUntil:'networkidle',timeout:60000});const x=await p.evaluate(()=>({title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||'',h1:document.querySelectorAll('h1').length,cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth}));console.log('POSTCHECK',JSON.stringify({d,status:r?.status(),...x}));if(r?.status()!==200||x.title!=='Custo de digitalização certificada para educação | Arquindex'||x.canonical!==url||x.h1!==1||x.sw>x.cw+2)throw Error('POSTCHECK_FAILED '+d);await p.close()}await b.close();console.log('PUBLIC_MOBILE_DESKTOP_VERIFIED')})().catch(e=>{console.error(e);process.exit(1)});
          JS

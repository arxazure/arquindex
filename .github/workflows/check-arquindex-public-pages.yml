name: Validate Arquindex landing pages
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check website availability
        run: |
          python3 - <<'PY'
          import urllib.request
          urls = [
            'https://www.arquindex.com.br/digitalizacao/local/belo-horizonte-mg/',
            'https://www.arquindex.com.br/alfresco-ia-local-open-source-2026/',
            'https://www.arquindex.com.br/sitemap.xml',
          ]
          failed=[]
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Arquindex-SEO-Healthcheck/1.0'}),timeout=20) as resp:
                      print(resp.status,url)
                      if resp.status != 200: failed.append(url)
              except Exception as error:
                  print(type(error).__name__,url)
                  failed.append(url)
          if failed: raise SystemExit('Some site URLs failed the health check')
          PY

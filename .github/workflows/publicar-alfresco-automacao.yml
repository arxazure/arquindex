name: Alfresco FTPS - diagnostico seguro (sem deploy)
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Digite DIAGNOSTICO para autorizar somente leituras FTPS"
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ inputs.confirm_read_only == 'DIAGNOSTICO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests - no network
        run: python3 -m unittest discover -s tests -p 'test_alfresco_ftps_safe.py' -v
      - name: Diagnostico remoto somente leitura
        env:
          FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_ROOT: ${{ vars.FTP_PUBLIC_ROOT }}
        run: python3 scripts/publicar-alfresco-automacao.py --diagnose
      - name: Guardar relatorio de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfresco-ftps-diagnostico
          path: publish-report/alfresco-automacao/
          if-no-files-found: warn
          retention-days: 30

name: Publicar 56 subdominios Arquindex
# Execucao FTPS HomeHost com pacote ZIP e 56 raizes documentais
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'seo-regional/56-sites/**'
      - '.github/workflows/publicar-56-subdominios.yml'
concurrency:
  group: arquindex-deploy-56
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python para publicacao
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias da auditoria publica
        run: |
          pip install requests beautifulsoup4
          python -m unittest discover -s tests -p test_audit_56.py
      - name: Bloquear envio sem DNS TLS HTTP e raiz propria dos 56 hosts
        run: python scripts/audit_56_public.py --preflight-gate
      - name: Verificar pacote completo antes de qualquer upload
        run: |
          python - <<'PY'
          import pathlib,re
          root=pathlib.Path('seo-regional/56-sites')
          sites=list(root.glob('*.arquindex.com.br/index.html'))
          print(f'Arquivos HTML encontrados: {len(sites)}')
          assert len(sites)==56, f'Esperados 56 sites, encontrados {len(sites)}. Confira se a geracao ja fez commit em master.'
          for f in sites:
            html=f.read_text(encoding='utf-8')
            words=len(re.findall(r'\b[\wÀ-ÿ]+\b',re.sub(r'<[^>]+>',' ',html)))
            assert words>=3000,(f,words)
            for name in ['robots.txt','sitemap.xml']:
              assert (f.parent/name).is_file(),(f,name)
          print('PACOTE_VALIDADO',len(sites))
          print('PASTAS_COMPLETAS',len(sites),'ARQUIVOS_ESPERADOS',len(sites)*3)
          PY
      - name: Montar ZIP manual com 56 pastas de subdominios
        run: |
          python - <<'PY'
          import pathlib,zipfile,json
          root=pathlib.Path('seo-regional/56-sites')
          sites=sorted(root.glob('*.arquindex.com.br'))
          assert len(sites)==56, f'Esperados 56 diretorios, encontrados {len(sites)}'
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert {x['host'] for x in manifest}=={x.name for x in sites}
          with zipfile.ZipFile('arquindex-56-subdominios-homehost.zip','w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for site in sites:
              for name in ('index.html','sitemap.xml','robots.txt'):
                file=site/name
                assert file.is_file(),str(file)
                z.write(file,arcname=site.name+'/'+name)
            z.writestr('LEIA-ME-PUBLICACAO.txt',
              'ARQUINDEX - 56 SUBDOMINIOS\\n'
              'Cada pasta no ZIP possui index.html, sitemap.xml e robots.txt.\\n'
              'Extraia no diretorio PAI das 56 raizes documentais configuradas no cPanel.\\n'
              'Exemplo: public_html/subdominios/digitalizacaodedocumentosembh.arquindex.com.br/index.html\\n'
              'Configure cada subdominio no cPanel com document root correspondente; verifique DNS e SSL.\\n')
          print('ZIP_MANUAL_OK',len(sites),'pastas',pathlib.Path('arquindex-56-subdominios-homehost.zip').stat().st_size,'bytes')
          PY
      - name: Disponibilizar ZIP para download manual
        uses: actions/upload-artifact@v4
        with:
          name: arquindex-56-subdominios-homehost
          path: arquindex-56-subdominios-homehost.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar formulario comercial antes de publicar
        run: |
          npm install --prefix /tmp/guarda-form-test --no-package-lock --no-save playwright@1.62.1
          /tmp/guarda-form-test/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/guarda-form-test/node_modules node tests/guarda-form.cjs
      - name: Enviar para HomeHost via FTPS explicito (porta 21)
        env:
          HOMEHOST_PASS: ${{ secrets.FTP_PASSWORD }}
          HOMEHOST_HOST: ftp.arquindex.com.br
          HOMEHOST_USER: arquind2
          HOMEHOST_PORT: '21'
        run: |
          python - <<'PY'
          import os,ftplib,pathlib,io,hashlib,time,ssl
          root=pathlib.Path('seo-regional/56-sites')
          sites=sorted(root.glob('*.arquindex.com.br'))
          def deploy(host,user,password,base,label):
            assert host and user and password, f'{label}: credenciais FTP ausentes'
            with ftplib.FTP_TLS(timeout=45,context=ssl.create_default_context()) as ftp:
              ftp.connect(host,port=int(os.getenv('HOMEHOST_PORT','21') if label=='HOMEHOST' else '21'))
              print(label,'FTP_LOGIN_ATTEMPT',host,user,flush=True)
              ftp.login(user,password)
              ftp.prot_p()
              ftp.set_pasv(True)
              initial=ftp.pwd()
              print(label,'FTP_CONNECTED',host,'PORT',21,'USER',user,'INITIAL_DIR',initial,flush=True)
              candidates=[base,'/home/arquind2/public_html','/public_html','.']
              found=False
              for candidate in candidates:
                try:
                  ftp.cwd(initial)
                  if candidate!='.':ftp.cwd(candidate)
                  current=ftp.pwd()
                  entries=set(ftp.nlst())
                  indicators=('index.html','index.php','.htaccess','wp-config.php','robots.txt')
                  hits=[x for x in indicators if x in entries or any(str(y).rstrip('/').endswith('/'+x) for y in entries)]
                  print(label,'FTP_ROOT_CANDIDATE',candidate,'DIR',current,'INDICATORS',hits,flush=True)
                  if hits:
                    found=True
                    print(label,'FTP_ROOT_SELECTED',current,flush=True)
                    break
                except ftplib.all_errors as exc:
                  print(label,'FTP_ROOT_UNAVAILABLE',candidate,type(exc).__name__,str(exc)[:150],flush=True)
              if not found:raise RuntimeError(label+': raiz publica nao identificada; confira o FTP root no cPanel')
              try:ftp.mkd('subdominios')
              except ftplib.error_perm as e:
                if not str(e).startswith('550'):raise
              ftp.cwd('subdominios')
              for site in sites:
                try:ftp.mkd(site.name)
                except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
                ftp.cwd(site.name)
                existing=set(ftp.nlst())
                for f in site.iterdir():
                  if f.name not in ('index.html','sitemap.xml','robots.txt'):continue
                  data=f.read_bytes()
                  if f.name in existing:
                    old=bytearray();ftp.retrbinary('RETR '+f.name,old.extend)
                    if bytes(old)!=data:
                      backup=f.name+'.backup-'+time.strftime('%Y%m%d%H%M%S',time.gmtime())
                      ftp.storbinary('STOR '+backup,io.BytesIO(old))
                  ftp.storbinary('STOR '+f.name,io.BytesIO(data))
                  got=bytearray();ftp.retrbinary('RETR '+f.name,got.extend)
                  assert hashlib.sha256(got).digest()==hashlib.sha256(data).digest()
                ftp.cwd('..')
                print(label,'FTP_VERIFIED',site.name,'index.html sitemap.xml robots.txt')
          deploy(os.environ['HOMEHOST_HOST'],os.environ['HOMEHOST_USER'],os.environ['HOMEHOST_PASS'],'public_html','HOMEHOST')
          print('HOMEHOST_DEPLOY_FINISHED; Hostinger nao sera autenticada neste workflow')
          PY
      - name: Confirmar publicamente todos os 56 subdominios apos upload
        run: python scripts/audit_56_public.py --gate
      - name: Preservar evidencias individuais inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-publica-56
          path: audit-56/
      - name: Confirmar formulario no dominio publico de guarda BH
        run: |
          python - <<'PYCODE'
          import urllib.request
          url='https://guardadocumentalembh.arquindex.com.br/'
          req=urllib.request.Request(url,headers={'User-Agent':'Arquindex-Form-Deploy-Check/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as response:
              page=response.read(500000).decode('utf-8')
              assert response.status==200
              assert response.url.split('/')[2]=='guardadocumentalembh.arquindex.com.br', 'Redirecionamento para outro dominio'
              assert 'id="commercial-form"' in page and 'data-form-version="2026-10-16-v1"' in page, 'Formulario novo nao encontrado no HTML publico'
              print('GUARDA_BH_PUBLIC_FORM_VERIFIED',response.status)
          PYCODE

name: Identidade visual ARQ-007
# Revisao 2: localizar arquivo diretamente
on:
  push:
    branches: [master]
    paths: ['.github/workflows/identidade-arq007.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DESIGN_TARGET: https://consultoria-adequacao-lgpd-pequenas-empresas.arquindex.com.br/
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python scripts/padronizar-identidade-arquindex.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identidade-arq007
          path: design-report/


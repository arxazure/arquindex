name: Recuperacao SEO Homehost
on:
  push:
    paths:
      - '.github/workflows/seo-recovery.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Aplicar correcoes verificadas com backup; desmarcado apenas confere'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e corrigir referencias SEO confirmadas
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APPLY_CHANGES: ${{ github.event_name == 'push' && 'true' || inputs.apply == true && 'true' || 'false' }}
        run: python3 scripts/seo_recovery.py

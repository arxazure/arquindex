name: Corrigir descricao truncada de governanca
on:
  push:
    branches: [master]
    paths: ['.github/workflows/governanca-description-20261018.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Corrigir tres metadados com backup e verificacao publica
        run: |
          python - <<'PY'
          import os,io,ftplib,re,html,json,hashlib,urllib.request
          from datetime import datetime,timezone
          url='https://governanca.arquindex.com.br/bh.html'
          desc='Governança de dados e documentos em Belo Horizonte: organização do acervo, controle de acesso, rastreabilidade e integração com gestão documental.'
          def public(u):
           with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'ArquindexSEO/1.0','Cache-Control':'no-cache'}),timeout=30) as r:
            assert r.status==200;return r.read()
          def read(f,p):
           b=bytearray();f.retrbinary('RETR '+p,b.extend);return bytes(b)
          def put(f,p,b):f.storbinary('STOR '+p,io.BytesIO(b));assert read(f,p)==b
          def attrs(t):return {k.lower():html.unescape(v) for k,q,v in re.findall(r'([\w:-]+)\s*=\s*(["\x27])(.*?)\2',t,re.S)}
          with ftplib.FTP_TLS(timeout=35) as f:
           f.connect('ftp.arquindex.com.br',21);f.login('arquind2',os.environ['FTP_PASSWORD']);f.prot_p()
           path='/governanca.arquindex.com.br/bh.html';old=read(f,path);s=old.decode()
           assert public(url)==old,'PUBLIC_SOURCE_MISMATCH'
           counts={}
           def patch(m):
            a=attrs(m[0]);key=a.get('name',a.get('property','')).lower()
            if key not in ['description','og:description','twitter:description']:return m[0]
            counts[key]=counts.get(key,0)+1
            attribute='property' if key=='og:description' else 'name'
            return '<meta '+attribute+'="'+key+'" content="'+html.escape(desc,quote=True)+'">'
           new=re.sub(r'<meta\b[^>]*>',patch,s,flags=re.I).encode()
           assert counts=={'description':1,'og:description':1,'twitter:description':1},counts
           if new==old:print('ALREADY_CORRECT');raise SystemExit(0)
           assert b'Require all denied' in read(f,'/seo-backups/.htaccess')
           stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
           put(f,'/seo-backups/governanca-description-'+stamp+'.html',old)
           assert read(f,path)==old,'CONCURRENT_CHANGE'
           try:
            put(f,path,new)
            for u in [url,url+'?post=como-digitalizar-documentos-em-qualquer-impressora']:assert public(u)==new,'PUBLIC_MISMATCH'
           except Exception:
            put(f,path,old);assert public(url)==old;print('ROLLBACK_VERIFIED');raise
           print('PUBLIC_VERIFIED',json.dumps({'url':url,'description':desc,'tags':counts,'hash':hashlib.sha256(new).hexdigest()},ensure_ascii=False),flush=True)
          
          PY

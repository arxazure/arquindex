name: Arquindex - Publicar artigos tecnicos 2026-10-27

on:
  push:
    branches: [master]
    paths:
      - artigos-tecnicos/2026-10-27/**
      - scripts/publicar-artigos-tecnicos-20261027.py
      - .github/workflows/publicar-artigos-tecnicos-20261027.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar com backup e validar producao
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publicar-artigos-tecnicos-20261027.py
      - name: Preservar comprovante
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artigos-tecnicos-20261027
          path: publish-report/artigos-20261027.json
          if-no-files-found: warn
          retention-days: 90

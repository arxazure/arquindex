name: IndexNow diario - dominios e subdominios Arquindex
on:
  schedule:
    - cron: '17 9 * * *' # 06h17 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/indexnow-daily.yml'
      - 'scripts/indexnow_daily.py'
      - 'tests/test_indexnow_daily.py'
permissions:
  contents: read
concurrency:
  group: arquindex-indexnow-daily
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar separacao de hosts e confirmacoes
        run: python -m unittest discover -s tests -p test_indexnow_daily.py -v
      - name: Recuperar URLs recebidas na ultima execucao
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Validar chaves por host e notificar alteracoes publicas
        run: python scripts/indexnow_daily.py
      - name: Preservar confirmacoes mesmo com falhas parciais
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Guardar relatorio por host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: indexnow-report/
          if-no-files-found: warn
          retention-days: 30

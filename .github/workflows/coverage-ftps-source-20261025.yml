name: Coverage localizar fontes FTPS
on:
  push:
    branches: [master]
    paths: ['.github/workflows/coverage-ftps-source-20261025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ler fontes comerciais sem alterar hospedagem
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/coverage-ftps-source-20261025.py

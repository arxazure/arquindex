name: Arte ARQ055 protocolo
on:
  push:
    branches: [master]
    paths: ['.github/workflows/arte-arq055-20261021.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - run: python scripts/arte-arq055-20261021.py
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

name: Testar formulario comercial de guarda BH
on:
  push:
    branches: ['work/formulario-guarda-bh']
  pull_request:
    paths:
      - 'scripts/templates/guarda-commercial-form.html'
      - 'scripts/sync_guarda_form.py'
      - 'tests/guarda-form.cjs'
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm install --prefix /tmp/guarda-form-test --no-package-lock --no-save playwright@1.62.1
          /tmp/guarda-form-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Testar sem enviar mensagens
        run: NODE_PATH=/tmp/guarda-form-test/node_modules SCREENSHOT_DIR=/tmp/guarda-preview node tests/guarda-form.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formulario-guarda-preview
          path: /tmp/guarda-preview
          if-no-files-found: ignore

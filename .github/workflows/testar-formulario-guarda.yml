name: Verificar acesso publico guarda BH
on:
  push:
    branches: ['work/formulario-guarda-bh']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar DNS e formulario HTTPS publicado
        run: |
          python - <<'PY'
          import socket, urllib.request
          host='guardadocumentalembh.arquindex.com.br'
          print('DNS',sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)}),flush=True)
          with urllib.request.urlopen('https://'+host+'/',timeout=25) as response:
              page=response.read(500000).decode('utf-8')
              print('HTTP_STATUS',response.status,flush=True)
              assert response.status==200 and response.url.split('/')[2]==host
              assert 'id="commercial-form"' in page and 'data-form-version="2026-10-16-v1"' in page
              print('GUARDA_BH_PUBLIC_FORM_VERIFIED',flush=True)
          PY

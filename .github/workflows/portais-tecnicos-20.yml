name: Portais técnicos Arquindex - 20 temas
on:
  push:
    branches: [pilot/conarq-guias-approved-20261104]
    paths:
      - 'portais-tecnicos/catalogo.json'
      - 'scripts/portais-tecnicos/**'
      - '.github/workflows/portais-tecnicos-20.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, pilot]
        default: preflight
      portal:
        type: string
        default: conarq-guias
      approval:
        description: 'Somente após aprovação: APPROVED:<slug>'
        type: string
      artifact_run:
        description: 'Execução com conteúdo aprovado'
        type: string
        default: '41931224469'
permissions:
  contents: read
  actions: read
concurrency:
  group: homehost-portais-tecnicos-20
  cancel-in-progress: false
jobs:
  build-qa-publish:
    if: github.event_name == 'push' && github.event.head_commit.message == 'deploy: approved conarq-guias pilot 20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar validação sem acessar hospedagem
        run: python -m unittest discover -s scripts/portais-tecnicos -p 'test_*.py' -v
      - name: Recuperar conteúdo já aprovado
        uses: actions/download-artifact@v4
        with:
          name: portais-tecnicos-20
          run-id: '41931224469'
          github-token: ${{ github.token }}
          path: restored
      - name: Restaurar e revalidar entrega
        run: |
          cp -a restored/portais-tecnicos/dist portais-tecnicos/dist
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python scripts/portais-tecnicos/qa.py
      - name: Preflight de leitura ou piloto manual autorizado
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          MODE: pilot
          PORTAL: conarq-guias
          APPROVAL: APPROVED:conarq-guias
        run: python scripts/portais-tecnicos/publish.py --mode "$MODE" --portal "$PORTAL" --approval "$APPROVAL"
      - name: Preservar entrega e comprovantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portais-tecnicos-20
          path: |
            portais-tecnicos/dist/
            portais-tecnicos/qa-report.json
            publish-report/portais-tecnicos-20.json
          retention-days: 30


name: Diagnosticar sitemaps ARQ-055 ARQ-057 2026-10-21
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-sitemaps-arq055-arq057-20261021.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          python - <<'PY'
          import requests,xml.etree.ElementTree as ET
          for u in ['https://arquivo.arquindex.com.br/sitemap.xml','https://solucoes-ocr-sp.arquindex.com.br/sitemap.xml']:
            r=requests.get(u,timeout=30,headers={'User-Agent':'ArquindexSEO/1.0'});print('STATUS',u,r.status_code);r.raise_for_status()
            root=ET.fromstring(r.content);locs=[e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
            print('LOCS',u,locs)
          PY

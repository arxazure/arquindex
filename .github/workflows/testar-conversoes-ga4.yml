name: Testar conversoes GA4 sem rede
on:
  pull_request:
    paths:
      - 'assets/js/arquindex-conversions-v1.js'
      - 'tests/conversions-isolated.cjs'
      - '.github/workflows/testar-conversoes-ga4.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/conversions-isolated.cjs
        env:
          EXPECT_PRIVACY_FIX: '1'

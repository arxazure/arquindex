name: Melhorias SEO prioritarias 2026-10-15
on:
  push:
    paths:
      - '.github/workflows/seo-priority-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backup, otimizar tres paginas e validar publicacao
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import ftplib, os, re, io, json, ssl, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          HOST=os.environ["FTP_HOST"]; USER=os.environ["FTP_USERNAME"]; PASSWORD=os.environ["FTP_PASSWORD"]
          BASE="https://www.arquindex.com.br/"
          MARK="ARQUINDEX-SEO-20261015"
          pages={
            "digitalizacao.html":{
              "title":"Empresa de Digitalização de Documentos e OCR | Arquindex",
              "description":"Digitalização empresarial com diagnóstico, preparo, OCR, indexação, controle de qualidade e entrega rastreável. Atendimento nacional. Peça uma avaliação.",
              "heading":"Digitalização empresarial: do diagnóstico à consulta rastreável",
              "intro":"A Arquindex planeja a captura conforme o tipo documental, o uso futuro e os riscos do acervo. O escopo pode combinar preparação, digitalização, OCR, metadados, conferência e integração com gestão eletrônica de documentos.",
              "items":["Projeto-piloto e critérios de aceite antes da escala","OCR com conferência adequada ao risco de cada classe documental","Metadados e trilha de qualidade para facilitar busca e auditoria"],
              "links":[("digitalizacao-com-ocr.html","Entenda a digitalização com OCR"),("guarda_de_documentos.html","Conheça a gestão e guarda documental"),("lgpd-consultoria.html","Veja consultoria LGPD e DPO")],
              "faqs":[
                ("Como é calculado um projeto de digitalização?","O orçamento considera volume, estado físico, preparação, formatos, metadados, nível de conferência, OCR e forma de entrega. Uma amostra representativa ajuda a reduzir incerteza."),
                ("OCR elimina a conferência humana?","Não. O OCR facilita busca e extração, mas campos críticos, manuscritos, tabelas e originais de baixa qualidade podem exigir conferência definida no projeto."),
                ("Digitalizar permite descartar todo original?","Não automaticamente. Temporalidade, finalidade, requisitos legais e exceções aplicáveis ao documento precisam ser avaliados antes de qualquer destinação.")
              ]
            },
            "lgpd-consultoria.html":{
              "title":"DPO Terceirizado e Consultoria LGPD | Arquindex",
              "description":"DPO as a Service e consultoria LGPD com diagnóstico, mapa de dados, plano de ação, apoio a titulares, fornecedores, incidentes e governança contínua.",
              "heading":"DPO terceirizado e consultoria LGPD orientados à operação",
              "intro":"A Arquindex apoia empresas que precisam estruturar privacidade de forma contínua: diagnóstico, registro das operações, prioridades, interface com titulares e fornecedores, orientação interna e acompanhamento do plano de adequação.",
              "items":["Escopo definido conforme porte, risco e operações de tratamento","Rotina de acompanhamento e evidências, sem promessa genérica de conformidade","Integração entre jurídico, TI, RH, segurança e gestão documental"],
              "links":[("dpo-terceirizado.html","Conheça o DPO como serviço"),("seguranca-da-informacao.html","Veja segurança da informação"),("gestao_documental_documentos.html","Integre privacidade e gestão documental")],
              "faqs":[
                ("O que faz um DPO terceirizado?","O serviço apoia a governança de privacidade, orienta áreas internas, acompanha solicitações de titulares e incidentes, mantém registros e atua como canal quando aplicável. O escopo deve ser formalizado."),
                ("DPO as a Service substitui jurídico e TI?","Não. O encarregado articula e orienta, mas decisões jurídicas, controles técnicos e execução operacional continuam com as áreas responsáveis e a administração."),
                ("Toda empresa precisa do mesmo modelo de encarregado?","Não. A necessidade e o formato dependem da LGPD, da regulamentação da ANPD, do porte, do risco e das operações. A avaliação deve considerar o caso concreto.")
              ]
            },
            "digitalizacao-com-ocr.html":{
              "title":"Digitalização com OCR: PDF Pesquisável e Extração | Arquindex",
              "description":"OCR para documentos empresariais: PDF pesquisável, classificação, extração de campos, limites técnicos e critérios de conferência. Solicite um piloto.",
              "heading":"OCR empresarial com critérios de precisão e aceite",
              "intro":"OCR transforma imagens em texto pesquisável e pode apoiar classificação e extração de campos. A Arquindex define amostra, idiomas, classes documentais, campos críticos, tratamento de exceções e critérios de conferência antes da escala.",
              "items":["PDF pesquisável para localizar termos sem substituir a imagem original","Extração de campos condicionada à qualidade e ao layout do documento","Piloto com medição por classe documental e revisão de exceções"],
              "links":[("digitalizacao.html","Veja o serviço completo de digitalização"),("digitalizacao-processamento-dados.html","Conheça processamento e indexação de dados"),("gestao_documental_documentos.html","Integre OCR à gestão documental")],
              "faqs":[
                ("OCR funciona em manuscritos e tabelas?","O desempenho varia. Manuscritos, tabelas, carimbos, fundos coloridos e imagens degradadas exigem testes e podem demandar revisão humana."),
                ("PDF pesquisável é o mesmo que extração estruturada?","Não. A camada de texto permite busca; a extração estruturada identifica campos e exige regras, validação e tratamento de exceções."),
                ("Como avaliar a qualidade do OCR?","Defina amostra representativa, campos críticos, taxa aceitável de erro e método de conferência. Acurácia média isolada pode esconder falhas relevantes.")
              ]
            }
          }

          def connect():
            f=ftplib.FTP(timeout=30); f.connect(HOST,21); f.login(USER,PASSWORD); f.cwd("public_html"); return f
          def read(f,p):
            b=bytearray(); f.retrbinary("RETR "+p,b.extend); return bytes(b)
          def mkdirs(f,path):
            cur=f.pwd()
            for part in path.strip("/").split("/"):
              try: f.mkd(part)
              except ftplib.error_perm: pass
              f.cwd(part)
            f.cwd(cur)
          def upload(f,p,data):
            f.storbinary("STOR "+p,io.BytesIO(data))
          def enc(raw):
            try: raw.decode("utf-8"); return "utf-8"
            except UnicodeDecodeError: return "latin-1"
          def esc(s):
            return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"',"&quot;")
          def block(path,cfg):
            faq_entities=[{"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}} for q,a in cfg["faqs"]]
            faq_json=json.dumps({"@context":"https://schema.org","@type":"FAQPage","mainEntity":faq_entities},ensure_ascii=False,separators=(",",":"))
            lis="".join("<li>"+esc(x)+"</li>" for x in cfg["items"])
            links=" · ".join('<a href="'+esc(h)+'">'+esc(t)+'</a>' for h,t in cfg["links"])
            faqs="".join("<details><summary>"+esc(q)+"</summary><p>"+esc(a)+"</p></details>" for q,a in cfg["faqs"])
            return f'''<!-- {MARK}:{path} -->
          <section id="seo-prioridade-20261015" aria-labelledby="seo-prioridade-titulo" style="max-width:1120px;margin:2rem auto;padding:1.5rem;border:1px solid #dbe4ea;border-radius:12px;background:#f8fbfc">
            <h2 id="seo-prioridade-titulo">{esc(cfg["heading"])}</h2>
            <p>{esc(cfg["intro"])}</p>
            <ul>{lis}</ul>
            <p>{links}</p>
            <p><a href="https://wa.me/5531973632725?text=Quero%20avaliar%20um%20projeto%20com%20a%20Arquindex" rel="noopener">Solicitar avaliação pelo WhatsApp: +55 31 97363-2725</a></p>
            <h3>Perguntas frequentes</h3>{faqs}
          </section>
          <script type="application/ld+json">{faq_json}</script>
          <!-- /{MARK}:{path} -->'''
          def patch(path,raw,cfg):
            encoding=enc(raw); s=raw.decode(encoding)
            if f"{MARK}:{path}" in s: return raw,encoding,False
            title=esc(cfg["title"]); desc=esc(cfg["description"]); canonical=BASE+path
            if re.search(r"<title\b[^>]*>.*?</title\s*>",s,re.I|re.S):
              s=re.sub(r"<title\b[^>]*>.*?</title\s*>","<title>"+title+"</title>",s,count=1,flags=re.I|re.S)
            else: s=re.sub(r"</head\s*>","<title>"+title+"</title>\n</head>",s,count=1,flags=re.I)
            md='<meta name="description" content="'+desc+'">'
            if re.search(r"<meta\b[^>]*name\s*=\s*['\"]description['\"][^>]*>",s,re.I):
              s=re.sub(r"<meta\b[^>]*name\s*=\s*['\"]description['\"][^>]*>",md,s,count=1,flags=re.I)
            else: s=re.sub(r"</head\s*>",md+"\n</head>",s,count=1,flags=re.I)
            if not re.search(r"<link\b[^>]*rel\s*=\s*['\"][^'\"]*canonical",s,re.I):
              s=re.sub(r"</head\s*>",'<link rel="canonical" href="'+canonical+'">\n</head>',s,count=1,flags=re.I)
            b=block(path,cfg)
            if re.search(r"</main\s*>",s,re.I): s=re.sub(r"</main\s*>",b+"\n</main>",s,count=1,flags=re.I)
            elif re.search(r"</body\s*>",s,re.I): s=re.sub(r"</body\s*>",b+"\n</body>",s,count=1,flags=re.I)
            else: s += b
            return s.encode(encoding),encoding,True

          f=connect()
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup="_backups/seo-priority-"+stamp
          mkdirs(f,backup)
          originals={}; changed=[]
          try:
            for path,cfg in pages.items():
              raw=read(f,path); originals[path]=raw
              upload(f,backup+"/"+path,raw)
              new,encoding,did=patch(path,raw,cfg)
              if did:
                upload(f,path,new); changed.append(path)
              print("PAGE",path,"backup",backup+"/"+path,"encoding",encoding,"changed",did,flush=True)
            f.quit()
            time.sleep(4)
            failures=[]
            for path,cfg in pages.items():
              req=urllib.request.Request(BASE+path,headers={"User-Agent":"Mozilla/5.0 (compatible; ArquindexSEOAudit/1.0)"})
              try:
                with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
                  body=r.read(6000000).decode("utf-8",errors="replace")
                  status=r.status
                checks={
                  "status_200":status==200,
                  "marker":f"{MARK}:{path}" in body,
                  "canonical":BASE+path in body,
                  "no_noindex":not bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+noindex',body,re.I)),
                  "title":cfg["title"] in body,
                  "whatsapp":"5531973632725" in body
                }
                print("VERIFY",path,json.dumps(checks,ensure_ascii=False),flush=True)
                if not all(checks.values()): failures.append(path+":"+json.dumps(checks))
              except Exception as e: failures.append(path+":"+type(e).__name__)
            if failures:
              print("VALIDATION_FAILED",failures,flush=True)
              f=connect()
              for path,raw in originals.items(): upload(f,path,raw)
              f.quit()
              raise SystemExit("Validacao falhou; originais restaurados. Backup: "+backup)
            print("PUBLISHED",json.dumps([BASE+p for p in changed]),flush=True)
            print("BACKUP",backup,flush=True)
          except Exception:
            try: f.quit()
            except Exception: pass
            raise

          key=os.environ.get("INDEXNOW_KEY","").strip()
          if key and changed:
            payload=json.dumps({"host":"www.arquindex.com.br","key":key,"keyLocation":BASE+key+".txt","urlList":[BASE+p for p in changed]}).encode()
            req=urllib.request.Request("https://api.indexnow.org/indexnow",data=payload,headers={"Content-Type":"application/json; charset=utf-8"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=30) as r: print("INDEXNOW",r.status,flush=True)
            except urllib.error.HTTPError as e: print("INDEXNOW_HTTP_ERROR",e.code,flush=True)
            except Exception as e: print("INDEXNOW_ERROR",type(e).__name__,flush=True)
          else:
            print("INDEXNOW_SKIPPED key_ausente_ou_sem_alteracoes",flush=True)
          PY

name: Auditar 56 subdominios publicos
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1'
  push:
    branches: [master]
    paths:
      - 'scripts/audit_56_public.py'
      - '.github/workflows/auditar-56-publicos.yml'
permissions:
  contents: read
  issues: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Auditar DNS TLS HTTP SEO e links sem publicar
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/audit_56_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-publica-56
          path: audit-56/
      - name: Registrar resultados na issue 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat audit-56/report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body-file audit-56/report.md

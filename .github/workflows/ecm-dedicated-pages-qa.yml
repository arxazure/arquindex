name: ECM Dedicated Pages QA (no deploy)
on:
  pull_request:
    paths:
      - 'deploy/subdominios/ecm-arquindex/**'
      - 'scripts/validate_ecm_dedicated_site.py'
      - '.github/workflows/ecm-dedicated-pages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ECM editorial pages, canonicals and sitemap
        run: python3 scripts/validate_ecm_dedicated_site.py

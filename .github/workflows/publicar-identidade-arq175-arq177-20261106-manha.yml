name: Publicar identidade ARQ-175 e ARQ-177 - 2026-11-06 manha
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publicar-identidade-arq175-arq177-20261106-manha.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install beautifulsoup4
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Backup e identidade ARQ-175
        env:
          DESIGN_TARGET: https://digitalizar-digitalizacao-custo.arquindex.com.br/
        run: |
          python scripts/padronizar-identidade-arquindex.py
          cp design-report/identity-report.json design-report/arq175.json
      - name: Backup e identidade ARQ-177
        env:
          DESIGN_TARGET: https://documentos.arquindex.com.br/
        run: |
          python scripts/padronizar-identidade-arquindex.py
          cp design-report/identity-report.json design-report/arq177.json
      - name: Verificar publicacao mobile desktop SEO e descoberta
        run: |
          cat > verify.js <<'JS'
          const {chromium}=require('playwright');
          const rows=[
            ['ARQ-175','https://digitalizar-digitalizacao-custo.arquindex.com.br/'],
            ['ARQ-177','https://documentos.arquindex.com.br/']
          ];
          (async()=>{const b=await chromium.launch({headless:true});for(const [id,url] of rows){const ctx=await b.newContext({viewport:{width:390,height:844}});const p=await ctx.newPage();const r=await p.goto(url+'?verify=20261106-manha',{waitUntil:'domcontentloaded',timeout:45000});const d=await p.evaluate(()=>({title:document.title,description:document.querySelector('meta[name=description]')?.content||'',h1:[...document.querySelectorAll('h1')].map(x=>x.textContent.trim()),canonical:document.querySelector('link[rel=canonical]')?.href||'',robots:document.querySelector('meta[name=robots]')?.content||'',logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"],.aq-logo-name'),menu:document.querySelectorAll('header nav,nav[aria-label]').length,floating:!!document.querySelector('#arq-floating,.arq-floating,.aq-brand-wa'),wa:!!document.querySelector('a[href*="5531973632725"]'),marker:!!document.querySelector('#arquindex-identidade-20261018'),utm:document.querySelectorAll('a[href*="utm_"]').length,cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth}));await p.setViewportSize({width:1440,height:900});const desktop=await p.evaluate(()=>({cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth}));if(r.status()!==200||d.canonical!==url||d.h1.length!==1||!d.logo||!d.menu||!d.floating||!d.wa||!d.marker||d.sw>d.cw||desktop.sw>desktop.cw)throw new Error(id+' falha '+JSON.stringify({status:r.status(),...d,desktop}));console.log('PUBLIC_VERIFIED',JSON.stringify({id,url,status:r.status(),...d,desktop}));for(const path of ['/robots.txt','/sitemap.xml']){const rp=await ctx.newPage();const rr=await rp.goto(new URL(url).origin+path,{waitUntil:'domcontentloaded',timeout:30000});const body=(await rp.textContent('body').catch(()=>''))||'';console.log('DISCOVERY_CHECK',JSON.stringify({id,path,status:rr.status(),mentions:body.includes(url),length:body.length}));await rp.close()}await ctx.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identidade-arq175-arq177-20261106-manha
          path: design-report/

name: Inventario 56 Arquindex lote 10 final read-only

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inventario-56-lote10-final-20261113.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
      - name: Verificar dois hosts finais sem alterar producao
        env:
          HOSTS: 'escaneardossiefuncionario-novalima.arquindex.com.br,digitalizacaodepartamentopessoal-novalima.arquindex.com.br'
        run: |
          python - <<'PY'
          import os, json, socket, ssl, requests
          from bs4 import BeautifulSoup

          result = []
          for host in os.environ['HOSTS'].split(','):
              d = {'host': host, 'url': 'https://' + host + '/'}
              try:
                  d['dns'] = sorted({x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              except Exception as e:
                  d['dns_error'] = str(e)

              if d.get('dns'):
                  try:
                      with socket.create_connection((host, 443), timeout=8) as s:
                          with ssl.create_default_context().wrap_socket(s, server_hostname=host) as t:
                              d['tls_valid'] = True
                              d['tls_version'] = t.version()
                              d['tls_not_after'] = t.getpeercert().get('notAfter')
                  except Exception as e:
                      d['tls_error'] = str(e)

                  for key, path in [
                      ('page', '/'),
                      ('http', 'http://' + host + '/'),
                      ('robots', '/robots.txt'),
                      ('sitemap', '/sitemap.xml'),
                  ]:
                      try:
                          url = path if key == 'http' else 'https://' + host + path
                          r = requests.get(url, timeout=14, allow_redirects=True, headers={'User-Agent': 'Arquindex-Audit/1.0'})
                          d[key] = {
                              'status': r.status_code,
                              'final_url': r.url,
                              'redirects': [
                                  {'status': h.status_code, 'url': h.url, 'location': h.headers.get('location')}
                                  for h in r.history
                              ],
                          }
                          if key == 'page' and r.status_code == 200:
                              soup = BeautifulSoup(r.text, 'html.parser')
                              canonical = soup.find('link', rel=lambda v: v and 'canonical' in v)
                              description = soup.find('meta', attrs={'name': lambda v: v and v.lower() == 'description'})
                              viewport = soup.find('meta', attrs={'name': lambda v: v and v.lower() == 'viewport'})
                              robots = soup.find('meta', attrs={'name': lambda v: v and v.lower() == 'robots'})
                              d[key].update({
                                  'title': soup.title.get_text(' ', strip=True) if soup.title else None,
                                  'h1': [x.get_text(' ', strip=True) for x in soup.find_all('h1')],
                                  'canonical': canonical.get('href') if canonical else None,
                                  'description': description.get('content') if description else None,
                                  'viewport': viewport.get('content') if viewport else None,
                                  'meta_robots': robots.get('content') if robots else None,
                                  'forms': len(soup.find_all('form')),
                                  'whatsapp': bool(soup.find(href=lambda v: v and ('wa.me' in v or 'whatsapp' in v.lower()))),
                                  'logo': bool(soup.find('img', alt=lambda v: v and 'arquindex' in v.lower())),
                                  'nav': bool(soup.find('nav')),
                                  'internal_links': len(soup.find_all('a', href=lambda v: v and ('arquindex.com.br' in v or v.startswith('/')))),
                                  'words': len(soup.get_text(' ', strip=True).split()),
                              })
                          if key == 'sitemap' and r.status_code == 200:
                              d['sitemap_mentions_url'] = d['url'] in r.text
                      except Exception as e:
                          d[key] = {'error': str(e)}

              result.append(d)
              print(json.dumps(d, ensure_ascii=False))

          with open('inventario-lote10-final.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          assert len(result) == 2
          PY
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-56-lote10-final
          path: inventario-lote10-final.json

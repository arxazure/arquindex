name: Diagnostico FTP Homehost (somente leitura)
on:
  push:
    paths:
      - '.github/workflows/ftp-inventory.yml'
  workflow_dispatch:
    inputs:
      remote_dir:
        description: 'Destino apos subir dois niveis; vazio tenta arquind2/public_html e a raiz publica conhecida'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  ftps-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnosticar conexao FTPS sem alterar servidor
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INPUT_REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          python - <<'PY'
          import ftplib, os, sys
          host = os.getenv('FTP_HOST')
          user = os.getenv('FTP_USERNAME')
          password = os.getenv('FTP_PASSWORD')
          for label, present in [('servidor', bool(host)), ('usuario', bool(user)), ('senha', bool(password))]:
              print(f'{label}: ' + ('configurado' if present else 'AUSENTE'))
          if not all((host,user,password)):
              sys.exit('Faltam secrets com os nomes esperados; nenhum acesso foi tentado.')
          try:
              port = 21
              ftp = ftplib.FTP(timeout=20)
              ftp.connect(host, port)
              try:
                  ftp.login(user, password)
              except ftplib.error_perm:
                  print('Autenticacao recusada: FTP_PASSWORD deve conter a senha do usuario arquind2.')
                  raise
              print('FTP sem TLS: conexao e autenticacao OK')
              start = ftp.pwd()
              print('Diretorio inicial acessivel.')
              import collections, time
              start = ftp.pwd()
              for i in range(2):
                  before = ftp.pwd()
                  try:
                      ftp.cwd('..')
                      print('Subida', i+1, 'de 2:', 'mesma raiz virtual' if ftp.pwd()==before else 'nivel superior acessivel')
                  except ftplib.all_errors as exc:
                      print('Subida', i+1, 'de 2: acesso negado:', type(exc).__name__)
              root = ftp.pwd()
              requested = os.getenv('INPUT_REMOTE_DIR', '').strip()
              candidates = [requested] if requested else [
                  'arquind2/public_html',
                  '/arquind2/public_html',
                  '/home/arquind2/public_html',
                  'public_html',
              ]
              selected = None
              for candidate in candidates:
                  try:
                      ftp.cwd(root)
                      ftp.cwd(candidate)
                      selected = ftp.pwd()
                      print('Destino solicitado acessivel:', candidate, flush=True)
                      break
                  except ftplib.error_perm:
                      print('Destino solicitado sem acesso:', candidate, flush=True)
              if selected is None:
                  ftp.quit()
                  sys.exit('FTP autenticado, mas a pasta do site nao esta acessivel. Nenhum arquivo alterado.')
              root = selected
              queue = collections.deque([(root, 0)])
              visited = set()
              directories = files = errors = 0
              started = time.monotonic()
              limit = 10000
              while queue and directories < limit and time.monotonic()-started < 420:
                  path, depth = queue.popleft()
                  if path in visited:
                      continue
                  visited.add(path)
                  try:
                      ftp.cwd(path)
                      entries = list(ftp.mlsd())
                      directories += 1
                      for name, facts in entries:
                          if name in ('.','..'):
                              continue
                          kind = facts.get('type','').lower()
                          if kind == 'dir':
                              child = ftp.pwd().rstrip('/') + '/' + name
                              if child not in visited:
                                  queue.append((child, depth+1))
                          elif kind == 'file':
                              files += 1
                      if directories % 100 == 0:
                          print('Progresso: pastas',directories,'arquivos',files,flush=True)
                  except ftplib.error_perm:
                      errors += 1
                      print('Pasta sem acesso ou MLSD indisponivel; diagnostico parcial.')
                  except (OSError, EOFError) as exc:
                      errors += 1
                      print('Erro de listagem:',type(exc).__name__)
              print('Inventario FTP: pastas',directories,'arquivos',files,'erros',errors,'pendentes',len(queue))
              print('Nomes e caminhos internos omitidos dos logs.')
              ftp.quit()
              print('Diagnostico concluido. Nenhum arquivo alterado.')
          except (*ftplib.all_errors, OSError, ValueError) as exc:
              print('Falha de conexao, autenticacao, permissao ou listagem:', type(exc).__name__)
              sys.exit(1)
          PY

# Execucao solicitada em 2026-10-13: auditoria FTPS somente leitura.

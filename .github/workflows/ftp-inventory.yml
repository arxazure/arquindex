name: Diagnostico FTPS Homehost (somente leitura)
on:
  push:
    paths:
      - '.github/workflows/ftp-inventory.yml'
  workflow_dispatch:
    inputs:
      remote_dir:
        description: 'Opcional: public_html, ../public_html ou /; vazio detecta automaticamente'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  ftps-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnosticar conexao FTPS sem alterar servidor
        env:
          FTP_HOMEHOST: ${{ secrets.FTP_HOMEHOST }}
          FTP_HOST: ftp.arquindex.com.br
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: chat1@arquindex.com.br
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          INPUT_REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          python - <<'PY'
          import ftplib, os, ssl, sys
          host = os.getenv('FTP_HOMEHOST') or os.getenv('FTP_HOST') or os.getenv('FTP_SERVER')
          user = os.getenv('FTP_USERNAME') or os.getenv('FTP_USER')
          password = os.getenv('FTP_PASSWORD')
          for label, present in [('servidor', bool(host)), ('usuario', bool(user)), ('senha', bool(password))]:
              print(f'{label}: ' + ('configurado' if present else 'AUSENTE'))
          if not all((host,user,password)):
              sys.exit('Faltam secrets com os nomes esperados; nenhum acesso foi tentado.')
          try:
              port = int(os.getenv('FTP_PORT') or '21')
              ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20)
              ftp.connect(host, port)
              ftp.login(user, password)
              ftp.prot_p()
              print('FTPS com TLS: conexao e autenticacao OK')
              start = ftp.pwd()
              print('Diretorio inicial acessivel.')
              requested = (os.getenv('INPUT_REMOTE_DIR') or os.getenv('FTP_DIR') or '').strip()
              # Contas FTP restritas podem iniciar diretamente dentro de public_html.
              # Tentamos primeiro o diretorio inicial, depois um nivel acima e a raiz.
              candidates = ([requested] if requested else
                            ['.', 'public_html', '../public_html', '..', '/', '/public_html',
                             '/home/arquind2/public_html'])
              selected = None
              for candidate in candidates:
                  try:
                      ftp.cwd(start)
                      ftp.cwd(candidate)
                      names = {x.rstrip('/').rsplit('/',1)[-1] for x in ftp.nlst()}
                      site_markers = {'index.php','index.html','robots.txt','sitemap.xml','.htaccess'}
                      if names & site_markers:
                          selected = candidate
                          print('Raiz publica identificada por arquivos do site.')
                          break
                      if candidate in ('.', '/', '..') and 'public_html' in names:
                          ftp.cwd('public_html')
                          selected = candidate.rstrip('/') + '/public_html'
                          print('Diretorio public_html encontrado a partir da raiz acessivel.')
                          break
                      print('Candidato acessivel sem indicadores de raiz publica:', candidate)
                  except (ftplib.error_perm, OSError):
                      continue
              if selected is None:
                  sys.exit('Nenhuma raiz publica identificada. Confira o diretorio inicial e as permissoes da conta FTP.')
              print('Diretorio remoto selecionado:', selected)
              entries = ftp.nlst()
              print('Total de entradas:', len(entries))
              safe_names = {'index.html','index.php','wp-config.php','wp-content','wp-includes','wp-admin','robots.txt','sitemap.xml','.htaccess','assets','css','js','composer.json','package.json'}
              found = {item.rstrip('/').rsplit('/', 1)[-1] for item in entries}
              print('Indicadores de tecnologia encontrados:')
              for name in sorted(found & safe_names):
                  print(' -', name)
              print('Outros nomes omitidos para evitar vazamento de dados em logs.')
              ftp.quit()
              print('Diagnostico concluido. Nenhum arquivo alterado.')
          except (ftplib.all_errors, OSError, ValueError) as exc:
              print('Falha de conexao, TLS, permissao ou listagem:', type(exc).__name__)
              sys.exit(1)
          PY

# Execucao solicitada em 2026-10-13: auditoria FTPS somente leitura.

name: Inventario FTP somente leitura
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar nomes de secrets sem exibir valores
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          for name in ('FTP_HOST','FTP_SERVER','FTP_USERNAME','FTP_USER','FTP_PASSWORD'):
              print(f'{name}: ' + ('configurado' if os.getenv(name) else 'ausente'))
          PY
      - name: Listar diretorio remoto sem modificar arquivos
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          python - <<'PY'
          import os, ftplib, ssl, posixpath
          host=os.getenv('FTP_HOST') or os.getenv('FTP_SERVER')
          user=os.getenv('FTP_USERNAME') or os.getenv('FTP_USER')
          password=os.getenv('FTP_PASSWORD')
          if not all((host,user,password)):
              print('Credenciais esperadas nao encontradas; confira nomes dos secrets.')
              raise SystemExit(1)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(host,21)
          ftp.login(user,password)
          ftp.prot_p()
          remote=os.getenv('FTP_DIR') or 'public_html'
          ftp.cwd(remote)
          print('Conexao FTPS estabelecida. Pasta remota acessivel.')
          names=ftp.nlst()
          for name in names[:150]:
              base=posixpath.basename(name.rstrip('/'))
              if base and not base.startswith('.'):
                  print('Arquivo ou pasta:',base)
          print('Total de entradas listadas:',len(names))
          ftp.quit()
          PY

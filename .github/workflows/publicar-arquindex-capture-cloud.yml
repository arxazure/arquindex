name: Publicar Arquindex Capture Cloud
on:
  push:
    branches: [master]
    paths:
      - 'arquindex-capture-cloud.html'
      - '.github/workflows/publicar-arquindex-capture-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar conteudo e preco sob consulta
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arquindex-capture-cloud.html').read_text(encoding='utf-8')
          for term in ('100 GB','300 GB','500 GB','1.000 GB','2.000 GB','Sob consulta','baixarCatalogo'):
              assert term in p,term
          PY
      - name: Publicar somente pagina Capture via FTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib,os,ssl,hashlib,io
          from pathlib import Path
          assert os.environ.get('FTP_PASSWORD'),'FTP_PASSWORD ausente'
          data=Path('arquindex-capture-cloud.html').read_bytes()
          with ftplib.FTP_TLS(timeout=45,context=ssl.create_default_context()) as ftp:
              ftp.connect('ftp.arquindex.com.br',21)
              ftp.login('arquind2',os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              initial=ftp.pwd()
              ok=False
              for path in ('public_html','/home/arquind2/public_html','/public_html','.'):
                  try:
                      ftp.cwd(initial)
                      if path!='.':ftp.cwd(path)
                      names=set(Path(x).name for x in ftp.nlst())
                      if 'index.html' in names or 'index.php' in names:
                          ok=True
                          break
                  except ftplib.all_errors:
                      continue
              assert ok,'Raiz publica nao identificada'
              ftp.storbinary('STOR arquindex-capture-cloud.html',io.BytesIO(data))
              verification=io.BytesIO()
              ftp.retrbinary('RETR arquindex-capture-cloud.html',verification.write)
              assert hashlib.sha256(data).digest()==hashlib.sha256(verification.getvalue()).digest()
          print('UPLOAD_FTPS_VALIDADO')
          PY
      - name: Teste publico
        run: |
          python - <<'PY'
          import urllib.request,time
          url='https://www.arquindex.com.br/arquindex-capture-cloud.html'
          for i in range(5):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Arquindex-Deploy-Check'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      page=r.read().decode('utf-8','replace')
                      assert r.status==200 and 'CAPTURE CLOUD' in page and '100 GB' in page
                      print('PAGINA_PUBLICA_OK',url)
                      break
              except Exception:
                  if i==4:raise
                  time.sleep(10)
          PY

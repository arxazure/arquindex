name: Publicar Arquindex Capture Cloud
on:
  push:
    branches: [master]
    paths:
      - arquindex-capture-cloud.html
      - .github/workflows/publicar-arquindex-capture-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-arquindex-capture-cloud
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar pagina Capture e Alfresco
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('arquindex-capture-cloud.html').read_text(encoding='utf-8')
          for item in ('Capture Start', 'R$ 499','R$ 849','R$ 1.099','R$ 1.549','R$ 599','R$ 899','baixarCatalogo'):
              assert item in page,item
          print('LANDING_VALIDADA')
          PY
      - name: Publicar em public_html e validar no servidor
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_LEGACY_MODE: ${{ vars.FTP_LEGACY_MODE }}
        run: |
          python - <<'PY'
          import os,ftplib,ssl,io,hashlib
          from pathlib import Path
          data=Path('arquindex-capture-cloud.html').read_bytes()
          dst='arquindex-capture-cloud.html'
          pw=os.getenv('FTP_PASSWORD')
          if not pw:raise RuntimeError('Secret FTP_PASSWORD ausente ou vazio no GitHub Actions')
          remote=os.getenv('FTP_REMOTE_DIR') or 'public_html'
          host='ftp.arquindex.com.br'
          # Encrypted FTPS is always the default. Use explicitly enabled legacy FTP
          # only for hosts that cannot support the secured transport.
          legacy=(os.getenv('FTP_LEGACY_MODE') or '').strip().lower()=='true'
          if legacy:
              print('AVISO: FTP legado sem criptografia habilitado explicitamente via FTP_LEGACY_MODE')
              conn=ftplib.FTP(timeout=40)
          else:
              conn=ftplib.FTP_TLS(timeout=40,context=ssl.create_default_context())
          with conn as ftp:
              ftp.connect(host,21)
              ftp.login('arquind2',pw)
              if not legacy:ftp.prot_p()
              ftp.set_pasv(True)
              ftp.cwd(remote)
              print('DESTINO',ftp.pwd())
              existing=set(x.rsplit('/',1)[-1] for x in ftp.nlst())
              if dst in existing:
                  previous=io.BytesIO()
                  ftp.retrbinary('RETR '+dst,previous.write)
                  if previous.getvalue()==data:
                      print('ALREADY_CURRENT')
                  else:
                      ftp.storbinary('STOR '+dst+'.backup',io.BytesIO(previous.getvalue()))
                      ftp.storbinary('STOR '+dst,io.BytesIO(data))
              else:
                  ftp.storbinary('STOR '+dst,io.BytesIO(data))
              result=io.BytesIO()
              ftp.retrbinary('RETR '+dst,result.write)
              assert hashlib.sha256(result.getvalue()).digest()==hashlib.sha256(data).digest(),'FTP hash mismatch'
              print('UPLOAD_VERIFICADO',dst,len(data))
          PY
      - name: Validar pagina no dominio publico
        run: |
          python - <<'PY'
          import urllib.request,time
          url='https://www.arquindex.com.br/arquindex-capture-cloud.html'
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url+'?capturedeploy='+str(int(time.time())),headers={'User-Agent':'ArquindexDeploy/1.0','Cache-Control':'no-cache'}),timeout=20) as response:
                      body=response.read().decode('utf-8','replace')
                      assert response.status==200 and 'R$ 499' in body and 'R$ 599' in body
                      print('SITE_PUBLICADO_E_VALIDADO',url)
                      break
              except Exception as exc:
                  print('VALIDACAO_PUBLICA_FALHOU',type(exc).__name__,str(exc)[:180])
                  if attempt==4:raise
                  time.sleep(8)
          PY

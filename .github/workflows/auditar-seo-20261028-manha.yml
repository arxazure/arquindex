name: Auditar ARQ-143 a ARQ-148 2026-10-28 manha

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/auditar-seo-20261028-manha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - name: Auditoria pública mobile e desktop
        run: |
          cat > audit.js <<'JS'
          const { chromium, request } = require('playwright');
          const dns = require('node:dns').promises;
          const items = [
            ['ARQ-143','https://digitalizar-lgpd-sp.arquindex.com.br/'],
            ['ARQ-144','https://digitalizardocumentos.arquindex.com.br/'],
            ['ARQ-145','https://exin-rh-maua.arquindex.com.br/'],
            ['ARQ-146','https://gestao-arquivos-custo.arquindex.com.br/'],
            ['ARQ-147','https://ia.arquindex.com.br/custo.html'],
            ['ARQ-148','https://implantacao-arquivos-mg.arquindex.com.br/']
          ];
          const line = value => console.log(JSON.stringify(value));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const api=await request.newContext({ignoreHTTPSErrors:false});
            for(const [id,url] of items){
              const host=new URL(url).hostname;
              let addresses=[];
              try { addresses=await dns.resolve4(host); }
              catch(error) { line({id,url,phase:'dns',ok:false,error:String(error.message||error)}); continue; }
              line({id,url,phase:'dns',ok:true,addresses});
              for(const asset of ['/robots.txt','/sitemap.xml']){
                try {
                  const response=await api.get('https://'+host+asset,{timeout:30000});
                  line({id,url,phase:asset,status:response.status(),contentType:response.headers()['content-type']||''});
                } catch(error) { line({id,url,phase:asset,status:null,error:String(error.message||error)}); }
              }
              for(const [device,width,height] of [['mobile',390,844],['desktop',1440,900]]){
                const page=await browser.newPage({viewport:{width,height}});
                try {
                  const res=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                  const data=await page.evaluate(()=>({
                    finalUrl:location.href,title:document.title,
                    h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()),
                    description:document.querySelector('meta[name="description"]')?.content||'',
                    canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                    robots:document.querySelector('meta[name="robots"]')?.content||'',
                    viewport:document.querySelector('meta[name="viewport"]')?.content||'',
                    logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),
                    menu:!!document.querySelector('#aq-nav, header nav'),
                    widget:document.querySelectorAll('#arq-floating,.aq-brand-wa,#wa-widget-send-button').length,
                    cta:[...document.querySelectorAll('a[href]')].filter(a=>/wa.me|solicitar-proposta|orcamento/i.test(a.href)).length,
                    forms:document.querySelectorAll('form').length,
                    jsonld:document.querySelectorAll('script[type="application/ld+json"]').length,
                    links:document.querySelectorAll('a[href]').length,
                    words:(document.body.innerText.match(/\S+/g)||[]).length,
                    clientWidth:document.documentElement.clientWidth,
                    scrollWidth:document.documentElement.scrollWidth
                  }));
                  line({id,url,phase:'page',device,status:res?.status(),...data});
                } catch(error) { line({id,url,phase:'page',device,status:null,error:String(error.message||error)}); }
                finally { await page.close(); }
              }
            }
            await api.dispose(); await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
          node audit.js

name: Atualizar sitemap BH dos manuais

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/atualizar-sitemap-bh-manuais-20261025.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar com backup, validacao e rollback
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/atualizar-sitemap-bh-manuais-20261025.py
      - name: Guardar XML anterior e validado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-bh-20261025
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

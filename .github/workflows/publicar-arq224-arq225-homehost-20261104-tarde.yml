name: Publicar ARQ-224 ARQ-225 HomeHost - 2026-11-04 tarde
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publicar-arq224-arq225-homehost-20261104-tarde.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar fontes
        run: |
          python - <<'PY'
          import pathlib,re
          for id,slug in [('ARQ-224','pedro-leopoldo'),('ARQ-225','santa-luzia')]:
            p=pathlib.Path('seo-regional/gestao-documental-ecm-databooks')/slug/'index.html';s=p.read_text()
            assert len(re.findall(r'<h1\b',s,re.I))==1
            assert len(re.findall(r'<link[^>]+rel="canonical"',s,re.I))==1
            assert 'arquindex-logo-oficial.webp' in s and 'id="arq-floating"' in s
            assert 'data-aq-aeo="'+id+'"' in s and '5531973632725' in s
            assert 'noindex' not in s.lower()
            print('SOURCE_VALIDATED',id,len(s))
          PY
      - name: Resolver FTPS com TLS verificado
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
        shell: bash
        run: |
          set -euo pipefail
          cert=$(timeout 25 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName)
          selected=""
          if echo "$cert" | grep -Eq "DNS:$FTP_HOST([,[:space:]]|$)"; then selected="$FTP_HOST"; else
            original_ips=$(getent ahostsv4 "$FTP_HOST" | awk '{print $1}' | sort -u)
            while IFS= read -r candidate; do
              case "$candidate" in ""|*"*"*) continue ;; esac
              candidate_ips=$(getent ahostsv4 "$candidate" 2>/dev/null | awk '{print $1}' | sort -u || true)
              [ -n "$candidate_ips" ] || continue
              comm -12 <(printf '%s\n' "$original_ips") <(printf '%s\n' "$candidate_ips") | grep -q . || continue
              if timeout 25 openssl s_client -starttls ftp -connect "$candidate:21" -servername "$candidate" -verify_hostname "$candidate" -verify_return_error </dev/null 2>&1 | grep -q 'Verification: OK'; then selected="$candidate"; break; fi
            done < <(echo "$cert" | grep -oE 'DNS:[A-Za-z0-9.*_-]+(\.[A-Za-z0-9.*_-]+)+' | sed 's/^DNS://' | sort -u)
          fi
          test -n "$selected" || { echo "::error::FTPS sem hostname verificável"; exit 1; }
          echo "FTP_DEPLOY_HOST=$selected" >> "$GITHUB_ENV"
          echo "FTPS_VERIFIED $selected"
      - name: Backup remoto, publicar e conferir leitura
        env:
          FTP_HOST: ${{ env.FTP_DEPLOY_HOST }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_PASS"
          python - <<'PY'
          import ftplib,ssl,pathlib,hashlib,io,json,os
          slugs=['pedro-leopoldo','santa-luzia'];rows=[];pathlib.Path('backup').mkdir()
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(os.environ['FTP_HOST'],21);f.login(os.environ['FTP_USER'],os.environ['FTP_PASS']);f.prot_p()
          try:
            for slug in slugs:
              rel=f'seo-regional/gestao-documental-ecm-databooks/{slug}/index.html';remote='public_html/'+rel;local=pathlib.Path(rel).read_bytes();old=bytearray();f.retrbinary('RETR '+remote,old.extend)
              pathlib.Path('backup',slug+'.before.html').write_bytes(old)
              row={'slug':slug,'remote':remote,'before_sha256':hashlib.sha256(old).hexdigest(),'after_sha256':hashlib.sha256(local).hexdigest()};rows.append(row)
            for row in rows:
              rel=row['remote'].removeprefix('public_html/');local=pathlib.Path(rel).read_bytes();f.storbinary('STOR '+row['remote'],io.BytesIO(local));check=bytearray();f.retrbinary('RETR '+row['remote'],check.extend);assert hashlib.sha256(check).digest()==hashlib.sha256(local).digest()
          finally:f.quit()
          pathlib.Path('backup/manifest.json').write_text(json.dumps(rows,indent=2))
          print('BACKUP_AND_READBACK',json.dumps(rows))
          PY
      - name: Verificar público mobile e sitemap
        run: |
          npm install --no-save playwright >/dev/null
          cat > verify.js <<'JS'
          const {chromium}=require('playwright');const rows=[['ARQ-224','pedro-leopoldo','Databooks de Engenharia em Pedro Leopoldo | Arquindex'],['ARQ-225','santa-luzia','Databooks de RH e Documentos Trabalhistas em Santa Luzia | Arquindex']];
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});for(const [id,slug,title] of rows){const u='https://www.arquindex.com.br/seo-regional/gestao-documental-ecm-databooks/'+slug+'/';for(const vp of [{width:390,height:844},{width:1440,height:900}]){const p=await b.newPage({viewport:vp});const r=await p.goto(u+'?v=20261104tarde',{waitUntil:'domcontentloaded',timeout:60000});const d=await p.evaluate(()=>({title:document.title,h1:document.querySelectorAll('h1').length,canonical:document.querySelector('link[rel=canonical]')?.href,logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),floating:!!document.querySelector('#arq-floating'),marker:!!document.querySelector('[data-aq-aeo]'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}));if(!r||r.status()!=200||d.title!==title||d.h1!==1||d.canonical!==u||!d.logo||!d.floating||!d.marker||d.overflow)throw Error(id+' '+JSON.stringify(d));console.log('PUBLIC_VERIFIED',id,vp.width,d.title);await p.close()}}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.js
          curl -fsSL https://www.arquindex.com.br/seo-regional/gestao-documental-ecm-databooks/sitemap.xml > /tmp/sm
          grep -q '/pedro-leopoldo/' /tmp/sm
          grep -q '/santa-luzia/' /tmp/sm
          echo SITEMAP_VERIFIED
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backup-arq224-arq225-${{ github.run_id }}, path: backup/, retention-days: 30 }

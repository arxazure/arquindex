name: QA repaired pages
on:
  push:
    branches: [master]
    paths: [.github/workflows/qa-repaired-pages-20261028.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: node scripts/qa-repaired-pages-20261028.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-repaired-pages
          path: qa-report/

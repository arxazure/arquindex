name: Publicar Arquindex SEO na HomeHost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Publicação bloqueada até validação dos gates
        run: |
          echo "::error::Publicação desativada: faltam evidências de backup integral restaurável, raiz HomeHost verificada, FTPS/TLS validado, lote aprovado e plano de rollback."
          exit 1

name: Publicar Arquindex SEO na HomeHost

on:
  push:
    branches: [master, main]
    paths:
      - 'blog/montagem-de-databooks-de-engenharia/index.html'
      - 'seo-regional/gestao-documental-ecm-databooks/**'
      - '.github/workflows/publicar-databooks-homehost.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-databooks-homehost
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar credenciais FTP
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "::error::Defina FTP_TLS_HOST nas variables"; exit 1; }
          test -n "$FTP_USER" || { echo "::error::Usuario FTP nao configurado"; exit 1; }
          test -n "$FTP_PASS" || { echo "::error::Defina FTP_PASSWORD nos GitHub Actions Secrets"; exit 1; }
      - name: Detectar hostname FTPS valido
        env:
          FTP_HOST: ${{ vars.FTP_TLS_HOST || 'ftp.arquindex.com.br' }}
        shell: bash
        run: |
          set -euo pipefail
          # Nao desabilita a verificacao TLS: exige nome valido e o mesmo IP.
          cert=$(timeout 25 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName)
          echo "$cert"
          selected=""
          if echo "$cert" | grep -Eq "DNS:$FTP_HOST([,[:space:]]|$)"; then
            selected="$FTP_HOST"
          else
            original_ips=$(getent ahostsv4 "$FTP_HOST" | awk '{print $1}' | sort -u)
            while IFS= read -r candidate; do
              case "$candidate" in ""|*"*"*) continue ;; esac
              candidate_ips=$(getent ahostsv4 "$candidate" 2>/dev/null | awk '{print $1}' | sort -u || true)
              [ -n "$candidate_ips" ] || continue
              if ! comm -12 <(printf '%s\n' "$original_ips") <(printf '%s\n' "$candidate_ips") | grep -q .; then
                continue
              fi
              if timeout 25 openssl s_client -starttls ftp -connect "$candidate:21" -servername "$candidate" -verify_hostname "$candidate" -verify_return_error </dev/null 2>&1 | grep -q 'Verification: OK'; then
                selected="$candidate"
                break
              fi
            done < <(echo "$cert" | grep -oE 'DNS:[A-Za-z0-9.*_-]+(\.[A-Za-z0-9.*_-]+)+' | sed 's/^DNS://' | sort -u)
          fi
          if [ -z "$selected" ]; then
            echo "::error::O certificado FTPS nao tem hostname verificavel no mesmo IP. Configure vars.FTP_TLS_HOST com o hostname correto indicado pela HomeHost, ou solicite a correcao do certificado."
            exit 1
          fi
          echo "FTP_DEPLOY_HOST=$selected" >> "$GITHUB_ENV"
          echo "Servidor FTPS validado: $selected"
      - name: Instalar cliente FTP seguro
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Enviar somente a pagina solicitada
        env:
          FTP_HOST: ${{ env.FTP_DEPLOY_HOST }}
          FTP_USER: arquind2
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set net:max-retries 2
          set ftp:ssl-allow yes
          set ssl:verify-certificate yes
          mkdir -p public_html/blog/montagem-de-databooks-de-engenharia
          put -O public_html/blog/montagem-de-databooks-de-engenharia/ blog/montagem-de-databooks-de-engenharia/index.html
          mkdir -p public_html/seo-regional/gestao-documental-ecm-databooks
          mirror -R --verbose seo-regional/gestao-documental-ecm-databooks public_html/seo-regional/gestao-documental-ecm-databooks
          bye
          LFTP
      - name: Conferir URL publica
        run: |
          set -euo pipefail
          URL=https://www.arquindex.com.br/blog/montagem-de-databooks-de-engenharia/
          for attempt in 1 2 3; do
            if curl --fail --location --silent --show-error --retry 2 "$URL" | grep -q 'Montagem de Databooks de Engenharia'; then
              echo "Pagina publicada e validada: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::A URL nao apresentou o conteudo esperado."
          exit 1
      - name: Verificar indice e sitemap regional
        run: |
          set -euo pipefail
          base="https://www.arquindex.com.br/seo-regional/gestao-documental-ecm-databooks"
          curl -fsSL --retry 3 --retry-delay 5 "$base/" | grep -q 'Gestão documental'
          curl -fsSL --retry 3 --retry-delay 5 "$base/sitemap.xml" | grep -q '<urlset'
          echo "Indice e sitemap regional acessiveis"

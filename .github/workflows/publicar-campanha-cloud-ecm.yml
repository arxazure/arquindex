name: Publicar campanha Arquindex Cloud ECM
on:
  push:
    branches: [master]
    paths:
      - 'arquindex-cloud-ecm.html'
      - '.github/workflows/publicar-campanha-cloud-ecm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar pagina comercial
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('arquindex-cloud-ecm.html').read_text(encoding='utf-8')
          for item in ('R$ 599','R$ 899','Cloudflare R2','Temporalidade','fase de implantação'):
              assert item in page, item
          print('Pagina verificada')
          PY
      - name: Publicar somente a pagina da campanha em HomeHost (FTPS)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib,os,ssl,hashlib
          from pathlib import Path
          assert os.environ.get('FTP_PASSWORD'), 'Secret FTP_PASSWORD nao definido'
          data=Path('arquindex-cloud-ecm.html').read_bytes()
          with ftplib.FTP_TLS(timeout=45, context=ssl.create_default_context()) as ftp:
              ftp.connect('ftp.arquindex.com.br',21)
              ftp.login('arquind2',os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              initial=ftp.pwd()
              ok=False
              for path in ('public_html','/home/arquind2/public_html','/public_html','.'):
                  try:
                      ftp.cwd(initial)
                      if path!='.':ftp.cwd(path)
                      names=set(Path(x).name for x in ftp.nlst())
                      if 'index.html' in names or 'index.php' in names:
                          print('Raiz publica validada:',ftp.pwd())
                          ok=True
                          break
                  except ftplib.all_errors:
                      continue
              assert ok, 'Raiz publica nao encontrada: upload bloqueado'
              import io
              ftp.storbinary('STOR arquindex-cloud-ecm.html',io.BytesIO(data))
              bio=io.BytesIO()
              ftp.retrbinary('RETR arquindex-cloud-ecm.html',bio.write)
              assert hashlib.sha256(bio.getvalue()).digest()==hashlib.sha256(data).digest(), 'Hash divergente'
              print('CAMPANHA_FTPS_VALIDADA',len(data))
          PY
      - name: Verificar pagina publica HTTPS
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://www.arquindex.com.br/arquindex-cloud-ecm.html'
          for i in range(4):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Arquindex-Deploy-Check'}),timeout=20) as r:
                      html=r.read().decode('utf-8','replace')
                      assert r.status==200 and 'R$ 599' in html and 'R$ 899' in html
                      print('PUBLICACAO_HTTP_OK',url)
                      break
              except Exception:
                  if i==3:raise
                  time.sleep(8)
          PY

name: Auditoria dos sitemaps na Homehost
on:
  push:
    paths:
      - '.github/workflows/seo-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Conferir arquivos e sitemaps existentes sem alterar servidor
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import collections, ftplib, hashlib, json, os, posixpath, sys
          import urllib.error, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ.get("FTP_PASSWORD", "")
          if not password:
              sys.exit("FTP_PASSWORD ausente; nenhum acesso realizado.")
          ftp = ftplib.FTP(timeout=20)
          ftp.connect(host, 21)
          ftp.login(user, password)
          start = ftp.pwd()
          for _ in range(2):
              ftp.cwd("..")
          upper = ftp.pwd()
          root = None
          for candidate in ("arquind2/public_html", "/arquind2/public_html", "/home/arquind2/public_html", "public_html"):
              try:
                  ftp.cwd(upper)
                  ftp.cwd(candidate)
                  root = ftp.pwd()
                  break
              except ftplib.error_perm:
                  pass
          if root is None:
              ftp.quit()
              sys.exit("A pasta do site ainda nao esta acessivel.")
          print("Pasta do site acessivel; auditoria somente leitura.", flush=True)
          try:
              names = [name for name, facts in ftp.mlsd() if facts.get("type") == "file"]
          except ftplib.error_perm:
              sys.exit("Listagem indisponivel; nenhum arquivo alterado.")
          targets = sorted(name for name in names if name.lower().startswith("sitemap") and name.lower().endswith((".xml", ".txt")))[:60]
          report = {"root_accessible": True, "root_files": len(names), "sitemaps_audited": [], "changes": 0}
          def read_file(name):
              data = bytearray()
              def append(chunk):
                  data.extend(chunk)
                  if len(data) > 8 * 1024 * 1024:
                      raise ValueError("Arquivo acima do limite de auditoria")
              ftp.retrbinary("RETR " + name, append)
              return bytes(data)
          def public_get(path):
              url = "https://www.arquindex.com.br/" + urllib.parse.quote(path, safe="/")
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"ArquindexRecoveryAudit/1.0"}), timeout=12) as response:
                      data = response.read(8 * 1024 * 1024 + 1)
                      return response.status, data
              except urllib.error.HTTPError as exc:
                  return exc.code, b""
              except (OSError, ValueError):
                  return None, b""
          for name in targets:
              row = {"file": name}
              try:
                  data = read_file(name)
                  row["bytes"] = len(data)
                  status, public = public_get(name)
                  row["public_status"] = status
                  row["matches_public"] = status == 200 and hashlib.sha256(data).digest() == hashlib.sha256(public).digest()
                  if name.endswith(".xml"):
                      xml = ET.fromstring(data)
                      row["xml_type"] = xml.tag.split("}")[-1]
                      urls = [(element.text or "").strip() for element in xml.iter() if element.tag.split("}")[-1] == "loc"]
                  else:
                      row["xml_type"] = "text"
                      urls = data.decode("utf-8-sig").splitlines()
                  row["urls"] = len(urls)
                  invalid = []
                  for url in urls:
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.scheme not in ("http", "https") or not parsed.netloc or any(c.isspace() for c in url) or "->" in url:
                          invalid.append(url)
                  row["malformed_urls"] = len(invalid)
                  row["duplicate_urls"] = len(urls) - len(set(urls))
                  row["over_url_limit"] = row["xml_type"] == "urlset" and len(urls) > 50000
              except (ftplib.Error, OSError, ValueError, ET.ParseError) as exc:
                  row["error"] = type(exc).__name__
              report["sitemaps_audited"].append(row)
              print(json.dumps(row, ensure_ascii=False), flush=True)
          ftp.quit()
          print("RESUMO " + json.dumps(report, ensure_ascii=False), flush=True)
          print("Nenhum arquivo alterado.")
          PY

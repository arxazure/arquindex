name: Corrigir overflow ARQ-159 - 2026-11-05 manha v2
on:
  push:
    branches: [master]
    paths: ['.github/workflows/corrigir-overflow-arq159-20261105-manha.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: corrigir-overflow-arq159-20261105-manha
  cancel-in-progress: false
jobs:
  corrigir:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DESIGN_TARGET: https://alfresco.arquindex.com.br/
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          pip install beautifulsoup4
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Atualizar identidade com backup isolado
        run: |
          python scripts/padronizar-identidade-arquindex.py
          cat design-report/identity-report.json
      - name: Verificar ARQ-159 publicada
        run: |
          cat > verify.js <<'JS'
          const {chromium}=require('playwright');
          const url='https://alfresco.arquindex.com.br/';
          (async()=>{const b=await chromium.launch({headless:true});for(const vp of [{device:'mobile',width:390,height:844},{device:'desktop',width:1440,height:900}]){const c=await b.newContext({viewport:vp});const p=await c.newPage();const r=await p.goto(url+'?verify=20261105manha2',{waitUntil:'domcontentloaded',timeout:60000});const d=await p.evaluate(()=>({title:document.title,h1:[...document.querySelectorAll('h1')].map(x=>x.textContent.trim()),canonical:document.querySelector('link[rel=canonical]')?.href||'',robots:document.querySelector('meta[name=robots]')?.content||'',marker:!!document.querySelector('#arquindex-identidade-20261018'),logo:!!document.querySelector('img[src*="arquindex-logo-oficial.webp"]'),menu:!!document.querySelector('.aq-header nav'),footer:!!document.querySelector('.aq-footer'),wa:!!document.querySelector('a[href*="5531973632725"],a[href*="wa.me/5531973632725"]'),cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth}));const out={url,...vp,status:r?.status()||0,...d};console.log('PUBLIC_VERIFY',JSON.stringify(out));if(out.status!==200||!out.marker||!out.logo||!out.menu||!out.footer||!out.wa||out.h1.length!==1||out.canonical!==url||out.sw>out.cw)throw new Error('VERIFY_FAILED '+JSON.stringify(out));await c.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correcao-arq159-20261105
          path: design-report/

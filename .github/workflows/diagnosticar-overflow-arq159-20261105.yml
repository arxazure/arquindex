name: Diagnosticar overflow ARQ-159 - 2026-11-05
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnosticar-overflow-arq159-20261105.yml']
permissions: { contents: read }
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > diag.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});const p=await c.newPage();await p.goto('https://alfresco.arquindex.com.br/?diag=20261105',{waitUntil:'domcontentloaded',timeout:60000});const d=await p.evaluate(()=>{const w=document.documentElement.clientWidth;return {cw:w,sw:document.documentElement.scrollWidth,offenders:[...document.querySelectorAll('*')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,cls:String(e.className||'').slice(0,120),left:r.left,right:r.right,width:r.width,text:(e.textContent||'').trim().slice(0,80)}}).filter(x=>x.right>w+.1||x.left<-.1).sort((a,b)=>b.right-a.right).slice(0,30)}});console.log('OVERFLOW_DIAG',JSON.stringify(d));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node diag.js

name: Atualizar ARQ-081 PDF extenso 2026-10-23

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/atualizar-arq081-pdf-extenso-20261023.yml"
      - "scripts/atualizar-arq081-pdf-extenso-20261023.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arquindex-seo-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Contexto vigente do site institucional - HomeHost
        shell: bash
        run: |
          echo 'ARQUINDEX_WEBSITE_HOSTING=homehost' >> "$GITHUB_ENV"
          echo 'ARQUINDEX_WEBSITE_HOSTING_CONFIG=config/site-hosting.json' >> "$GITHUB_ENV"
          echo '::notice title=Site institucional na HomeHost::Marina informou em 01/11/2026 o retorno de arquindex.com.br e www.arquindex.com.br à HomeHost. Confira DNS/HTTP/TLS atuais. Railway não comprova publicação nesses hosts; aplicativos independentes mantêm seus destinos.'
          printf '%s\n' 'Site institucional: HomeHost, conforme instrução da usuária de 01/11/2026. Consulte AGENTS.md e config/site-hosting.json. Preserve o conteúdo restaurado; confirme FTPS/TLS, backup e leitura pública. Não altere DNS/e-mail nem migre aplicativos independentes. Esta etapa registra contexto; não publica conteúdo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe antes de acessar a origem
        run: python -m py_compile scripts/atualizar-arq081-pdf-extenso-20261023.py

      - name: Instalar dependência
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Publicar com backup, rollback e validação pública
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/atualizar-arq081-pdf-extenso-20261023.py

      - name: Guardar relatório da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arq081-pdf-extenso-20261023-report
          path: publish-report/arq081-pdf-extenso-20261023.json
          if-no-files-found: warn

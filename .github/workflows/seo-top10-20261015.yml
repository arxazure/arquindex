name: Estrategia Top 10 e Top 3 Arquindex
on:
  push:
    paths:
      - '.github/workflows/seo-top10-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquindex-seo-top10
  cancel-in-progress: false
jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aplicar e verificar estrategia
        env:
          FTP_HOST: ftp.arquindex.com.br
          FTP_USERNAME: arquind2
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import ftplib,os,re,io,json,html,urllib.request,urllib.error,uuid,hashlib
          from datetime import datetime,timezone
          BASE="https://www.arquindex.com.br/"
          paths=["guarda_de_documentos.html","digitalizacao.html","digitalizacao-com-ocr.html","lgpd-consultoria.html","dpo-as-a-service-consultoria-lgpd.html","gestao_documental_documentos.html"]
          f=ftplib.FTP(os.environ["FTP_HOST"],timeout=40);f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]);f.cwd("public_html");root=f.pwd()
          def read(p):
           b=bytearray();f.retrbinary("RETR "+p,b.extend);return bytes(b)
          def put(p,b):f.storbinary("STOR "+p,io.BytesIO(b))
          original={p:read(p) for p in paths};changes={};counts={}
          for p,b in original.items():
           try:s=b.decode("utf8");enc="utf8"
           except UnicodeDecodeError:s=b.decode("latin1");enc="latin1"
           count=[0]
           def clean(m):
            text=html.unescape(re.sub("<[^>]+>"," ",m.group(1)))
            if ("No cenário atual" in text or "Este conteúdo apresenta uma abordagem completa" in text) and text.count("A melhoria contínua deve ser considerada um pilar fundamental")>=3:
             count[0]+=1;return ""
            return m.group(0)
           s=re.sub(r"<section\b[^>]*>((?:(?!<section\b).)*?)</section>",clean,s,flags=re.S|re.I)
           if count[0]:changes[p]=s.encode(enc);counts[p]=count[0]
          f.cwd("..");f.cwd("seo-backups");folder="quality-"+datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ");f.mkd(folder);f.cwd(folder);backup=f.pwd()
          for p in changes:put(p,original[p])
          f.cwd(root);written=[]
          try:
           for p,b in changes.items():
            assert read(p)==original[p],("Concurrent modification",p)
            written.append(p);put(p,b);assert read(p)==b
           for p in paths:
            with urllib.request.urlopen(urllib.request.Request(BASE+p,headers={"User-Agent":"ArquindexSEOAudit/1.0","Cache-Control":"no-cache"}),timeout=30) as r:
             b=r.read();assert r.status==200
            assert b==changes.get(p,original[p]),("Public bytes differ",p)
            print("FINAL_PUBLIC_VERIFIED",p,"boilerplate_removed",counts.get(p,0),flush=True)
          except Exception:
           for p in written:put(p,original[p])
           print("CLEANUP_ROLLED_BACK",flush=True);raise
          print("QUALITY_BACKUP_OUTSIDE_PUBLIC_ROOT",backup,flush=True)
          # IndexNow keys are public verification tokens; preserve one stable file for future submissions.
          try:
           key=read("indexnow-key.txt").decode("ascii").strip()
           assert re.fullmatch("[A-Za-z0-9-]{8,128}",key)
          except ftplib.error_perm:
           key=uuid.uuid4().hex
           put(key+".txt",key.encode("ascii"));put("indexnow-key.txt",key.encode("ascii"))
          keyurl=BASE+key+".txt"
          try:
           token=read(key+".txt").decode("ascii").strip()
          except ftplib.error_perm:
           put(key+".txt",key.encode("ascii"));token=key
          assert token==key
          f.quit()
          with urllib.request.urlopen(keyurl,timeout=25) as r:assert r.status==200 and r.read().decode("ascii").strip()==key
          print("INDEXNOW_KEY_FILE_VERIFIED",flush=True)
          payload=json.dumps({"host":"www.arquindex.com.br","key":key,"keyLocation":keyurl,"urlList":[BASE+p for p in paths]}).encode()
          try:
           with urllib.request.urlopen(urllib.request.Request("https://api.indexnow.org/indexnow",data=payload,headers={"Content-Type":"application/json; charset=utf-8"},method="POST"),timeout=30) as r:
            print("INDEXNOW_SUBMISSION",r.status,"urls",len(paths),flush=True)
          except urllib.error.HTTPError as e:print("INDEXNOW_HTTP_ERROR",e.code,flush=True)
          
          PY
